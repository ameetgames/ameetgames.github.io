/* ============================================================
   Beat the Reveal: calendar (replay any earlier day)
   Covers the retroactive archive (up to launch) and every daily that has already passed.
   Archive and practice games never change your streak or stats.
   ============================================================ */

/* What is on a given calendar date? null = nothing there, otherwise an info record. */
function calInfo(dn, todayDN) {
  const sDN = archiveDN(0);
  const lDN = dayNum(LAUNCH[0], LAUNCH[1], LAUNCH[2]);
  if (dn < sDN || dn >= lDN + BANK_N) return null;
  const isArch = dn < lDN;
  const idx = isArch ? dn - sDN : dn - lDN;
  const meta = (isArch ? DATA.archive : DATA.puzzles)[idx];
  const info = { dn, idx, bank: isArch ? 'a' : 'd', cat: meta.cat, diff: meta.diff, playable: dn <= todayDN, today: dn === todayDN, status: 'new', pts: 0, later: false };
  if (isArch) {
    const r = DB.archive[idx];
    if (r) { info.status = r.o === 'correct' ? 'win' : 'lose'; info.pts = r.o === 'correct' ? r.p : 0; }
    return info;
  }
  const rec = DB.days[idx];
  const later = DB.later[idx];
  if (rec && rec.state === 'done' && rec.outcome === 'correct') { info.status = 'win'; info.pts = rec.points; }
  else if (later) { info.status = 'win'; info.later = true; info.pts = later.p; }   // got it, just not on the day
  else if (rec && rec.state === 'done') info.status = 'lose';
  else if (dn < todayDN) info.status = 'missed';
  else info.status = info.today ? 'today' : 'new';
  return info;
}
const CAL_GLYPH = { win: '✓', lose: '✗', new: '●', missed: '!', today: '★' };

function openCalendar() {
  const t = today();
  const todayDN = dayNum(t.y, t.m, t.d);
  const sDN = archiveDN(0);
  const lastDN = dayNum(LAUNCH[0], LAUNCH[1], LAUNCH[2]) + BANK_N - 1;
  let sel = clamp(todayDN, sDN, lastDN);
  const first = dateOfDayNum(sDN);
  const endMonth = dateOfDayNum(Math.min(Math.max(todayDN, sDN), lastDN));
  let view = (() => { const d = dateOfDayNum(sel); return { y: d.y, m: d.m }; })();
  const monthIdx = (y, m) => y * 12 + (m - 1);
  const minMi = monthIdx(first.y, first.m);
  const maxMi = monthIdx(endMonth.y, endMonth.m);

  const title = h('span', { class: 'mname px', 'aria-live': 'polite' });
  const prev = h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Previous month', onclick: () => go(-1) }, h('span', { class: 'px', text: '◀' }));
  const next = h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Next month', onclick: () => go(1) }, h('span', { class: 'px', text: '▶' }));
  const grid = h('div', { class: 'cal-grid', role: 'group', 'aria-label': 'Days' });
  const detail = h('div', { class: 'cal-detail', 'aria-live': 'polite' });
  const prog = h('p', { class: 'cal-prog px' });
  let entry;

  function go(dir) {
    const mi = monthIdx(view.y, view.m) + dir;
    if (mi < minMi || mi > maxMi) return;
    view = { y: Math.floor(mi / 12), m: (mi % 12) + 1 };
    render();
  }
  function choose(dn, keepFocus) {
    sel = dn;
    const d = dateOfDayNum(dn);
    view = { y: d.y, m: d.m };
    render();
    const f = grid.querySelector('.cal-day.sel');
    if (f && keepFocus !== false) f.focus({ preventScroll: true });
  }
  // Arrow keys move between days (left/right = a day, up/down = a week).
  grid.addEventListener('keydown', (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (!step) return;
    const dn = sel + step;
    if (dn < sDN || dn > lastDN) return;
    e.preventDefault();
    choose(dn);
  });
  function label(info, dn) {
    const d = fmtDayNum(dn);
    if (!info) return d;
    if (!info.playable) return d + ', not out yet';
    return d + ', ' + info.cat + ', ' + statusText(info);
  }
  function statusText(info) {
    if (info.today && info.status === 'today') return 'today’s puzzle';
    if (info.status === 'win') return info.later ? 'got it later' : 'solved, ' + info.pts + ' points';
    if (info.status === 'lose') return 'not solved yet';
    if (info.status === 'missed') return 'missed';
    return 'new';
  }
  function render() {
    const mi = monthIdx(view.y, view.m);
    title.textContent = MONTHS_FULL[view.m - 1] + ' ' + view.y;
    prev.disabled = mi <= minMi;
    next.disabled = mi >= maxMi;
    grid.replaceChildren();
    WEEKDAYS.forEach((w) => grid.append(h('div', { class: 'cal-wd px', 'aria-hidden': 'true', text: w.slice(0, 2).toUpperCase() })));
    const firstDN = dayNum(view.y, view.m, 1);
    const lead = dateOfDayNum(firstDN).wd;
    for (let i = 0; i < lead; i++) grid.append(h('div', { class: 'cal-day blank', 'aria-hidden': 'true' }));
    const dim = new Date(Date.UTC(view.y, view.m, 0)).getUTCDate();
    for (let d = 1; d <= dim; d++) {
      const dn = firstDN + d - 1;
      const info = calInfo(dn, todayDN);
      let cls = 'cal-day';
      let glyph = '';
      if (!info) cls += ' none';
      else if (!info.playable) cls += ' locked';
      else { cls += ' ' + info.status + (info.later ? ' later' : ''); glyph = CAL_GLYPH[info.status] || ''; }
      if (info && info.today) cls += ' is-today';
      if (dn === sel) cls += ' sel';
      const b = h('button', { class: cls, type: 'button', disabled: !info, 'aria-label': label(info, dn), 'aria-pressed': String(dn === sel),
        onclick: () => choose(dn) },
      h('span', { class: 'px', text: String(d) }), h('small', { class: 'px', text: glyph }));
      grid.append(b);
    }
    renderDetail();
  }
  function renderDetail() {
    detail.replaceChildren();
    const info = calInfo(sel, todayDN);
    if (!info) { detail.append(h('p', { class: 'quip', text: 'Pick a day to see its puzzle.' })); return; }
    detail.append(h('div', { class: 'dt px', text: fmtDayNum(sel).toUpperCase() }));
    if (!info.playable) {
      detail.append(h('p', { class: 'quip', text: 'This puzzle comes out on its day. No peeking!' }));
      return;
    }
    detail.append(h('div', { class: 'row' }, chip('cat', info.cat), chip('diff', info.diff)));
    const stText = info.status === 'win' ? (info.later ? '✓ GOT IT (LATER)' : '✓ SOLVED · ' + info.pts + ' PTS')
      : info.status === 'lose' ? '✗ NOT SOLVED YET' : info.status === 'missed' ? '! MISSED' : info.status === 'today' ? '★ TODAY’S PUZZLE' : '● NEW';
    detail.append(h('div', { class: 'st px ' + info.status, text: stText }));
    let btn;
    if (info.today) {
      const rec = DB.days[info.idx];
      const st = rec ? rec.state : 'fresh';
      btn = h('button', { class: 'btn', type: 'button', onclick: () => { entry.close(); if (st === 'done') openResult(info.idx); else startToday(info.idx); },
        text: st === 'done' ? 'VIEW RESULT' : st === 'fresh' ? 'PLAY TODAY’S PUZZLE' : 'CONTINUE' });
      detail.append(btn);
    } else {
      const played = info.status === 'win' || info.status === 'lose';
      btn = h('button', { class: 'btn', type: 'button', onclick: () => { entry.close(); startPractice(info.idx, info.bank); }, text: played ? 'PLAY AGAIN' : 'PLAY THIS DAY' });
      detail.append(btn, h('p', { class: 'about-small', text: 'Archive games never change your streak or stats.' }));
    }
  }

  // progress through the retroactive archive
  let solved = 0;
  for (let i = 0; i < ARCHIVE_N; i++) if (DB.archive[i] && DB.archive[i].o === 'correct') solved++;
  prog.textContent = 'ARCHIVE: ' + solved + ' OF ' + ARCHIVE_N + ' SOLVED';

  const legend = h('div', { class: 'cal-legend px', 'aria-hidden': 'true' },
    h('span', { class: 'win', text: '✓ SOLVED' }), h('span', { class: 'new', text: '● NEW' }), h('span', { class: 'lose', text: '✗ TRIED' }), h('span', { class: 'missed', text: '! MISSED' }));
  render();
  entry = openModal({
    title: 'CALENDAR', cls: 'cyan',
    body: [h('div', { class: 'cal-head' }, prev, title, next), grid, legend, prog, detail],
    actions: [{ label: 'CLOSE', cls: 'ghost' }],
    focus: '.cal-day.sel',
  });
}

/* ============================================================
   Beat the Reveal: boot, keyboard, easter egg, self-test
   ============================================================ */
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konIdx = 0;

function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = ((e.target && e.target.tagName) || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  if (e.key === 'Escape') {
    if (closeTopModal()) { e.preventDefault(); return; }
    if (armed) { e.preventDefault(); disarm(); }
    return;
  }
  if (typing) return;
  // Konami code: a little arcade fireworks
  konIdx = e.key === KONAMI[konIdx] || e.key.toLowerCase() === KONAMI[konIdx] ? konIdx + 1 : e.key === KONAMI[0] ? 1 : 0;
  if (konIdx === KONAMI.length) { konIdx = 0; Confetti.show('big'); Sfx.play('win'); toast('+30 LIVES! (NOT REALLY)'); }
  if (e.key === '?') { if (!overlays.length) openHowTo(); return; }
  if (overlays.length || privacyOpen) return;
  if (currentScreen === 'play' && cur && cur.state === 'reading' && ui && ui.lockBtn) {
    if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') { if (cur.mode !== 'replay') { e.preventDefault(); doPay(false); } }
    else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); onLockTap(); }
  }
}

function init() {
  DB = loadDB();
  initMedia();
  applySettings();
  buildBackdrop();
  buildWipe();
  bootIndex = puzzleIndex();
  document.addEventListener('visibilitychange', () => { if (document.hidden) persistElapsed(); syncClock(); });
  window.addEventListener('pagehide', persistElapsed);
  window.addEventListener('hashchange', () => { if (!overlays.length && !privacyOpen) handleReplayHash(); });
  document.addEventListener('keydown', onKey);
  setInterval(houseTick, 1000);
  showScreen('home', buildHome(), true);
  if (!handleReplayHash() && !DB.seen.how) {
    DB.seen.how = true;
    saveDB();
    openHowTo();
  }
}

/* ---------- Self-test (run BTR.selfTest() in the console) ---------- */
function selfTest() {
  const real = DB;
  DB = defaultDB();                       // run against a throwaway copy, never the player's real data
  try { return runSelfTest(); } finally { DB = real; saveDB(); }
}
function runSelfTest() {
  const out = [];
  const ok = (name, cond) => out.push([name, !!cond]);
  // F-6 scoring table
  let scoreOK = true;
  for (let k = 1; k <= 5; k++) {
    const a = new Run(0, 'practice'); a.k = k; a.state = 'locked'; a.finish('correct', a.p.answer.id);
    const b = new Run(0, 'practice'); b.k = k; b.state = 'locked'; b.finish('wrong', 'x');
    const c = new Run(0, 'practice'); c.k = k; c.state = 'locked'; c.finish('gave_up', null);
    if (a.points !== LADDER[k - 1] || b.points !== 0 || c.points !== 0) scoreOK = false;
  }
  ok('scoring table (5 clues x correct/wrong/gave up)', scoreOK);
  // F-1 date logic across DST and leap days
  ok('consecutive days differ by exactly 1 (US DST 2027-03-14)', dayNum(2027, 3, 15) - dayNum(2027, 3, 14) === 1);
  ok('consecutive days differ by exactly 1 (EU DST 2026-10-25)', dayNum(2026, 10, 26) - dayNum(2026, 10, 25) === 1);
  ok('leap day 2028-02-29 exists', dayNum(2028, 3, 1) - dayNum(2028, 2, 28) === 2);
  ok('year boundary', dayNum(2027, 1, 1) - dayNum(2026, 12, 31) === 1);
  ok('launch day is puzzle 0', puzzleIndex({ y: LAUNCH[0], m: LAUNCH[1], d: LAUNCH[2] }) === 0);
  // F-20 clock with a fake monotonic time source
  let t = 0;
  const c = new Clock(() => t);
  c.reset(17000, 0); c.run(); t = 16999;
  ok('clock not due at 16.999 s', !c.due());
  t = 17000;
  ok('clock due at 17 s', c.due());
  t = 0; c.reset(17000, 12000); c.run();
  ok('reload restores elapsed time (12 s)', Math.abs(c.elapsed() - 12000) < 1);
  t = 3000; c.pause(); t = 3000 + 5 * 60 * 1000; c.run();
  ok('hidden for 5 minutes: no time lost or gained', Math.abs(c.elapsed() - 15000) < 1);
  const off = new Clock(() => t); off.reset(Infinity, 0); off.run(); t += 99999999;
  ok('Off mode never times out', !off.due());
  // T13/T14: timeouts through the state machine
  const r = new Run(1, 'practice'); r.timer = 'std'; r.begin();
  const len1 = r.lenMs(1);
  r.pay(true, len1);
  ok('T13: timeout pays automatically (k=2, timeouts=1, route t)', r.k === 2 && r.timeouts === 1 && r.route === 't');
  r.finish('correct', r.p.answer.id);
  ok('T13: share square 1 is yellow after a timeout', shareSquares(r, false).charAt(0) === '\ud83d' && shareSquares(r, false).slice(0, 2) === '🟨');
  const r5 = new Run(1, 'practice'); r5.begin(); r5.k = 5; r5.lock(true, 20000);
  ok('T14: clock at clue 5 auto-locks (state locked, auto)', r5.state === 'locked' && r5.auto);
  const sd = new Run(1, 'practice'); sd.begin(); sd.el = sd.lenMs(1) + 10; settleDue(sd);
  ok('reload with a due timeout applies it before render', sd.k === 2 && sd.timeouts === 1);
  const rl = new Run(1, 'practice'); rl.timer = 'rlx';
  ok('Relaxed doubles the clock', rl.lenMs(1) === 2 * new Run(1, 'practice').lenMs(1));
  // Clock lengths stay in 16 to 23 s for every clue in the bank (C-4)
  let lenOK = true;
  for (let n = 0; n < BANK_N; n++) {
    const p = unseal(n);
    p.clues.forEach((cl) => { const s = 15 + Math.ceil(cl.length / 40); if (s < 16 || s > 23) lenOK = false; });
  }
  ok('every clue clock is 16 to 23 seconds', lenOK);
  // Replay codec
  const sample = { n: 7, lock: 3, outcome: 1, timer: 0, auto: false, dwell: [8, 19, 17, 0, 0] };
  const code = encodeReplay(sample);
  const dec = decodeReplay(code);
  ok('replay code is 16 chars', code.length === 16);
  ok('replay round trip', dec.n === 7 && dec.lock === 3 && dec.outcome === 1 && dec.dwell[1] === 19);
  const flipped = code.slice(0, 5) + (code[5] === 'A' ? 'B' : 'A') + code.slice(6);
  ok('T9: flipped character is rejected', decodeReplay(flipped).error === 'damaged');
  ok('invite link points at the hosted copy and round-trips', (function () {
    const run = new Run(4, 'daily');
    run.begin(); run.finish('wrong', 'zz');
    const link = replayLink(run);
    const m = /^(https:\/\/ameetgames\.github\.io\/beat-the-reveal\/)#w=([A-Za-z0-9_-]{16})$/.exec(link);
    const back = m && decodeReplay(m[2]);
    return !!back && !back.error && back.n === 4;
  })());
  ok('replay with another bank hash says newer', (function () {
    const saved = DATA.hash16;
    // re-encode with a different hash by flipping the hash bits and recomputing the CRC
    const bytes = unb64u(code);
    bytes[9] ^= 1; bytes[11] = crc8(bytes.slice(0, 11));
    const res = decodeReplay(b64u(bytes));
    DATA.hash16 = saved;
    return res.error === 'newer';
  })());
  // T10: the share text never contains an answer or any clue text
  let leak = false;
  for (let n = 0; n < BANK_N; n++) {
    const run = new Run(n, 'practice');
    run.begin(); run.pay(false, 3000); run.finish('wrong', 'zz');
    const s = shareText(run).toLowerCase();
    if (s.indexOf(run.p.answer.display.toLowerCase()) >= 0) leak = true;
    run.p.clues.forEach((cl) => { if (s.indexOf(cl.toLowerCase().slice(0, 20)) >= 0) leak = true; });
  }
  ok('T10: share text never leaks answers or clues', !leak);
  // "Try it" link: on by default, ends the shared text, can be switched off, and still leaks nothing
  {
    const was = DB.settings.tryLink;
    const run = new Run(0, 'practice');
    run.begin(); run.finish('wrong', 'zz');
    DB.settings.tryLink = true;
    const withLink = withTryLink(shareText(run));
    DB.settings.tryLink = false;
    const without = withTryLink(shareText(run));
    DB.settings.tryLink = was;
    let linkLeak = false;
    for (let n = 0; n < BANK_N; n++) if (TRY_URL.toLowerCase().indexOf(unseal(n).answer.display.toLowerCase()) >= 0) linkLeak = true;
    ok('Try it: link is added by default and ends the shared text', TRY_URL === 'https://ameetgames.github.io/beat-the-reveal/' && /\nTry it: https:\/\/ameetgames\.github\.io\/beat-the-reveal\/$/.test(withLink));
    ok('Try it: the Settings switch removes it, and the link names no answer', without.indexOf('Try it') < 0 && without === shareText(run) && !linkLeak);
  }
  // Answers
  ok('answers: gibberish is not in the closed list', exactEntry('zzqxj') === null);
  // Autocorrect: free typing, snapped to the closest known answer (never to "the right one" on purpose)
  const frank = unseal(2);                                   // Frankenstein
  const odyId = exactEntry('The Odyssey').id;
  const ody = resolveGuess('Odyhsey');
  ok('autocorrect: "Odyhsey" becomes Odyssey', ody && ody.fixed && ody.id === odyId);
  const fr = resolveGuess('Frankenstine');
  ok('autocorrect: "Frankenstine" becomes Frankenstein', fr && fr.fixed && fr.id === frank.answer.id);
  const onFrank = new Run(2, 'practice'); onFrank.begin(); onFrank.pay(false, 3000); onFrank.lock(false, 3000); onFrank.guess(resolveGuess('Odyhsey'));
  ok('autocorrect: on the Frankenstein puzzle, "Odyhsey" is a wrong guess read as Odyssey', onFrank.outcome === 'wrong' && onFrank.gt === 'The Odyssey' && onFrank.ty === 'Odyhsey');
  const onFrank2 = new Run(2, 'practice'); onFrank2.begin(); onFrank2.lock(false, 3000); onFrank2.guess(resolveGuess('Frankenstine'));
  ok('autocorrect: "Frankenstine" scores as correct (100 at clue 1)', onFrank2.outcome === 'correct' && onFrank2.points === 100);
  ok('autocorrect: swapped letters ("Zues") become Zeus', resolveGuess('Zues').id === exactEntry('Zeus').id);
  ok('autocorrect: a typo in a longer title ("Mount Everst") is fixed', resolveGuess('Mount Everst').id === unseal(47).answer.id);
  ok('autocorrect: "everest" matches Mount Everest exactly', resolveGuess('everest').id === unseal(47).answer.id && !resolveGuess('everest').fixed);
  const none = resolveGuess('zzqxj');
  ok('autocorrect: nothing close stays as typed and counts as a miss', none && none.none && none.id === null && none.text === 'zzqxj');
  const missRun = new Run(2, 'practice'); missRun.begin(); missRun.lock(false, 1000); missRun.guess(none);
  ok('autocorrect: a no-match guess scores zero', missRun.outcome === 'wrong' && missRun.points === 0);
  ok('autocorrect: empty text is not a guess', resolveGuess('   ') === null);
  let t0 = performance.now();
  for (let i = 0; i < 20; i++) resolveGuess('Qwertyuiop asdfghjk');
  ok('autocorrect is fast (under 40 ms per guess)', (performance.now() - t0) / 20 < 40);
  ok('answers: accents and punctuation normalise', norm('Pac-Man') === norm('pac man') && norm('Résumé') === 'resume');
  // Every puzzle answer resolves to a list entry
  let allMap = true;
  for (let n = 0; n < BANK_N; n++) {
    const p = unseal(n);
    const e = exactEntry(p.answer.display);
    if (!e || e.id !== p.answer.id) allMap = false;
    p.answer.accept.forEach((a) => { const x = exactEntry(a); if (!x || x.id !== p.answer.id) allMap = false; });
  }
  ok('every answer and alternate maps to its entry', allMap);
  // Practice: a separate pool of extra puzzles
  ok('undated extras pool has puzzles', PRACTICE_N >= 12);
  const dailyIds = new Set();
  for (let n = 0; n < BANK_N; n++) dailyIds.add(unseal(n).answer.id);
  let pMap = true, pOverlap = false, pLeak = false;
  for (let i = 0; i < PRACTICE_N; i++) {
    const p = unseal(i, 'x');
    const e = exactEntry(p.answer.display);
    if (!e || e.id !== p.answer.id) pMap = false;
    p.answer.accept.forEach((a) => { const x = exactEntry(a); if (!x || x.id !== p.answer.id) pMap = false; });
    if (dailyIds.has(p.answer.id)) pOverlap = true;
    const run = new Run(i, 'practice', null, { bank: 'x' });
    run.begin(); run.pay(false, 3000); run.finish('wrong', 'zz');
    if (shareText(run).toLowerCase().indexOf(p.answer.display.toLowerCase()) >= 0) pLeak = true;
  }
  ok('every practice answer and alternate maps to its entry', pMap);
  ok('no practice puzzle shares an answer with a daily puzzle', !pOverlap);
  ok('practice share text never leaks the answer', !pLeak);
  // Calendar archive: dated puzzles that run right up to launch
  ok('archive has 31 puzzles (Oct 25 to Nov 24)', ARCHIVE_N === 31);
  ok('archive runs right up to launch', archiveDN(ARCHIVE_N) === dayNum(LAUNCH[0], LAUNCH[1], LAUNCH[2]));
  ok('archive starts on Oct 25, 2026 (a Sunday)', ARCH[0] === 2026 && ARCH[1] === 10 && ARCH[2] === 25 && dateOfDayNum(archiveDN(0)).wd === 0);
  let aMap = true, aOverlap = false, aLeak = false, aArc = true, aLen = true;
  const arc = { 0: 'HS', 1: 'MS', 2: 'HS', 3: 'HS', 4: 'College', 5: 'College', 6: 'Open' };
  const xIds = new Set();
  for (let i = 0; i < PRACTICE_N; i++) xIds.add(unseal(i, 'x').answer.id);
  for (let i = 0; i < ARCHIVE_N; i++) {
    const p = unseal(i, 'a');
    const e = exactEntry(p.answer.display);
    if (!e || e.id !== p.answer.id) aMap = false;
    p.answer.accept.forEach((a) => { const x = exactEntry(a); if (!x || x.id !== p.answer.id) aMap = false; });
    if (dailyIds.has(p.answer.id) || xIds.has(p.answer.id)) aOverlap = true;
    if (arc[dateOfDayNum(archiveDN(i)).wd] !== p.diff) aArc = false;
    p.clues.forEach((cl) => { const s = 15 + Math.ceil(cl.length / 40); if (s < 16 || s > 23) aLen = false; });
    const run = new Run(i, 'practice', null, { bank: 'a' });
    run.begin(); run.pay(false, 3000); run.finish('wrong', 'zz');
    if (shareText(run).toLowerCase().indexOf(p.answer.display.toLowerCase()) >= 0) aLeak = true;
  }
  ok('every archive answer and alternate maps to its entry', aMap);
  ok('archive answers are unique across archive, extras and dailies', !aOverlap);
  ok('archive follows the weekday difficulty arc', aArc);
  ok('archive clue clocks are 16 to 23 seconds', aLen);
  ok('archive share text never leaks the answer', !aLeak);
  const archBefore = JSON.stringify(DB.days);
  const ar = new Run(3, 'practice', null, { bank: 'a' }); ar.begin(); ar.finish('wrong', 'zz');
  const ar2 = new Run(3, 'practice', null, { bank: 'a' }); ar2.begin(); ar2.finish('correct', ar2.p.answer.id);
  const ar3 = new Run(3, 'practice', null, { bank: 'a' }); ar3.begin(); ar3.finish('wrong', 'zz');
  ok('archive keeps your best result (a later miss does not undo a solve)', DB.archive[3] && DB.archive[3].o === 'correct');
  ok('archive play never touches daily history', JSON.stringify(DB.days) === archBefore);
  const ti = (dn, tdn) => calInfo(dn, tdn);
  ok('calendar: a day before the archive is empty', ti(archiveDN(0) - 1, archiveDN(40)) === null);
  ok('calendar: future days are not playable', ti(archiveDN(40), archiveDN(35)).playable === false);
  const daysBefore = JSON.stringify(DB.days);
  const later = new Run(0, 'practice'); later.begin(); later.finish('correct', later.p.answer.id);
  ok('practice: getting a past day right is remembered as "got it later"', DB.later[0] && DB.later[0].p === 100);
  ok('practice never touches daily history or stats', JSON.stringify(DB.days) === daysBefore);
  return out;
}

/* ---------- Debug hooks for testing ---------- */
BTR.selfTest = selfTest;
BTR.setToday = (y, m, d) => { testToday = y ? { y, m, d } : null; bootIndex = puzzleIndex(); rolloverShown = false; goHome(); };
BTR.reset = () => { DB = defaultDB(); saveDB(); applySettings(); goHome(); };
BTR.db = () => DB;
BTR.cur = () => cur;
BTR.clock = clock;
BTR.unseal = unseal;
BTR.Run = Run;
BTR.Clock = Clock;
BTR.encodeReplay = encodeReplay;
BTR.decodeReplay = decodeReplay;
BTR.fx = { burstShards, stampOver, lockSlam, flashBorder, Confetti, Sfx };
BTR.version = DATA.build;

init();

})();
