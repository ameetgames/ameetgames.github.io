    const ours = this.owner ? this.owner.team === p.team : !!(lk && lk.team === p.team && lk.pass && this.lastTouch.team === p.team && this.tick - lk.tick < 150);
    const d = this.dirOf(f);
    // keeper control toggle (G)
    if (c.press & B.KEEPER) {
      const g = this.gk(p.team);
      if (g && p !== g) { c.keeperFrom = p.id; this.control(c, g); return; }
      if (p.pos === 'GK' && c.keeperFrom) { const back = this.byId.get(c.keeperFrom); if (back?.onPitch) this.control(c, back); return; }
    }
    // move
    p.wantX = d ? d.x : 0; p.wantY = d ? d.y : 0;
    const sprint = !!(f.b & B.SPRINT);
    const jock = !!(f.b & B.JOCK);
    p.wantS = d ? (sprint ? 1 : 0.74) : 0;
    p.jockey = !hasBall && jock && !ours;
    p.sprintJockey = p.jockey && sprint;
    if (hasBall) p.dribMode = jock ? 'close' : sprint ? 'sprint' : 'normal';
    else p.dribMode = null;
    // keeper holding the ball
    if (hasBall && p.pos === 'GK' && p.holding) { this.humanKeeperBall(c, p, f, d); return; }
    if (p.act && (p.act.type === 'down' || p.act.type === 'slide' || p.act.type === 'stumble' || p.act.type === 'dive')) { c.hold = null; return; }

    // Timed Finish second press
    if (c.timed && !c.timed.done && (c.press & B.SHOOT)) {
      const tt = this.tick - c.timed.start, w = c.timed.wind;
      const g = this.greenWindow(c, p);
      const off = Math.abs(tt - w);
      const grade = off <= g ? 'perfect' : off <= g * 2.2 ? 'good' : off <= g * 4 ? 'poor' : 'bad';
      c.timed.done = true;
      const actp = this.byId.get(c.timed.p);
      if (actp && actp.act && actp.act.type === 'kick') actp.act.spec.timed = grade;
      else if (this.lastKick && this.lastKick.pid === c.timed.p && this.tick - this.lastKick.tick < 12) { /* too late: already struck */ }
      this.cue('timed', { grade });
      c.timedGrade = { grade, tick: this.tick };
      return;
    }
    if (c.timed && this.tick - c.timed.start > c.timed.wind + 20) c.timed = null;

    if (hasBall) return this.humanAttackBall(c, p, f, d);
    if (ours) return this.humanAttackOff(c, p, f, d);
    return this.humanDefend(c, p, f, d);
  }

  greenWindow(c, p) {
    // steps either side of the contact frame: location-based (AR's Mini2K rule)
    const t = this.teams[p.team];
    const goalX = t.dir * PITCH.HALF_L;
    const dGoal = Math.hypot(goalX - this.ball.x, this.ball.y);
    const box = inBox(this.ball.x, this.ball.y, t.dir);
    const skill = (box ? p.attrs.fin : p.attrs.lng) ?? 60;
    let g = box ? 2.6 : 1.7;
    g *= 0.7 + 0.6 * skill / 99;
    g *= dGoal > 25 ? 0.75 : 1;
    const ang = Math.abs(Math.atan2(Math.abs(this.ball.y), Math.abs(goalX - this.ball.x)));
    if (ang > 0.9) g *= 0.75;
    const opp = this.nearestOpp(p);
    if (opp.d < 1.5) g *= 0.8;
    return g * this.diff.green;
  }

  /** Button handling with hold-for-power. Returns {btn, power, mods} when an action fires. */
  holdFire(c, buttons) {
    const f = c.frame;
    if (!c.hold) {
      for (const k of buttons) if (c.press & k) { c.hold = { btn: k, t: 0, mods: f.b & ~k }; break; }
      return null;
    }
    c.hold.t++;
    c.hold.mods |= f.b & ~c.hold.btn;
    const max = c.hold.btn === B.SHOOT ? HOLD_MAX.shot : HOLD_MAX.pass;
    if ((c.rel & c.hold.btn) || !(f.b & c.hold.btn) || c.hold.t >= max + HOLD_EXTRA) {
      const out = { btn: c.hold.btn, power: clamp(c.hold.t / max, 0, 1), mods: c.hold.mods | f.b, t: c.hold.t };
      c.hold = null;
      return out;
    }
    return null;
  }

  humanAttackBall(c, p, f, d) {
    if (p.skill) return;
    if (this.skillInput(c, p, f)) return;
    if (this.knockOnInput(c, p, d)) return;
    // Q tap (alone): call a runner
    if ((c.rel & B.MOD) && !c.hold && this.tick - (c.lastPress[B.MOD] ?? 0) < 14) AI.callRun(this, p);
    if (c.press & B.CALL) AI.callRun(this, p, true);
    const fire = this.holdFire(c, [B.SHOOT, B.PASS, B.LOB, B.THRU]);
    if (!fire) return;
    const spec = this.humanSpec(c, p, fire, d);
    if (!spec) return;
    const wind = spec.type === 'shot' ? (spec.shotType === 'power' ? 30 : spec.shotType === 'finesse' ? 22 : 18) : 7;
    this.startKick(p, spec, wind);
    if (spec.type === 'shot') this.timedWindow(c, p, spec, wind);
    if (spec.oneTwo) AI.oneTwo(this, p, spec.receiver);
  }

  // ---------------------------------------------------------------- skill moves
  /** Skill stick gestures -> a move. Returns true when a move starts. */
  skillInput(c, p, f) {
    const t = this.teams[p.team];
    const tok = token(f.sx ?? 0, f.sy ?? 0, t.dir);
    const sk = c.sk ?? (c.sk = { seq: [], last: null, hold: 0, at: 0 });
    if (tok && tok !== sk.last) {
      if (this.tick - sk.at > 18) sk.seq = [];
      sk.seq.push(tok); sk.at = this.tick; sk.hold = 0;
      if (sk.seq.length > 5) sk.seq.shift();
    } else if (tok) sk.hold++;
    sk.last = tok;
    let held = false;
    if (tok && sk.hold === 16) held = true;
    else if (tok || !sk.seq.length) return false;
    const seq = sk.seq; sk.seq = [];
    const r = recognise(seq, held, p.speed ?? 0);
    if (!r) return false;
    return this.startSkill(p, r.name, r.side);
  }

  /** Double-tap a direction: knock the ball well ahead and race for it. */
  knockOnInput(c, p, d) {
    const mt = d ? token(d.x, d.y, 1) : null;
    let fired = false;
    if (mt && mt !== c.mvLast) {
      if (mt === c.mvPrev && c.mvLast === null && this.tick - c.mvAt < 14 && (p.speed ?? 0) > 2.5) {
        const ang = Math.atan2(d.y, d.x), b = this.ball;
        this.owner = null;
        const v = 8 + 3 * (p.attrs.spd ?? 60) / 99;
        b.vx = Math.cos(ang) * v; b.vy = Math.sin(ang) * v; b.vz = 0;
        p.cool = 8;
        this.lastKick = { pid: p.id, team: p.team, type: 'knock', tick: this.tick, foot: true, pass: false };
        this.log('knock_on', { pid: p.id, team: p.team });
        this.newPath();
        fired = true;
      }
      c.mvPrev = mt; c.mvAt = this.tick;
    }
    c.mvLast = mt;
    return fired;
  }

  /** Start a skill move (human or CPU). Moves above the player's stars become a body feint. */
  startSkill(p, name, side = 1) {
    if (p.skill || this.owner !== p || p.act) return false;
    let mv = MOVES[name];
    if (!mv) return false;
    if (mv.tier > (p.sm ?? 2)) { name = 'feint'; mv = MOVES.feint; }
    const t = this.teams[p.team];
    p.skillChain = this.tick - (p.lastSkill ?? -999) < 120 ? (p.skillChain ?? 0) + 1 : 0;
    p.lastSkill = this.tick;
    p.skill = { name, mv, t: 0, side, dir: t.dir, face0: p.face };
    this.log('skill', { pid: p.id, team: p.team, move: name });
    this.cue('skill', { pid: p.id, label: mv.label });
    return true;
  }

  skillVec(sk, f, s) { return { x: f * sk.dir, y: s * sk.side }; }

  stepSkill(p) {
    const sk = p.skill, mv = sk.mv;
    sk.t++;
    const v = this.skillVec(sk, mv.drift[0], mv.drift[1]);
    p.vx = v.x; p.vy = v.y;
    p.x += p.vx * STEP; p.y += p.vy * STEP;
    this.boundPlayer(p);
    p.speed = Math.hypot(p.vx, p.vy);
    // body turns from the start facing to the exit
    const ex = this.skillVec(sk, mv.exit[0], mv.exit[1]);
    const k = sk.t / mv.dur;
    p.face = sk.face0 + angDiff(Math.atan2(ex.y, ex.x), sk.face0) * Math.min(1, k * 1.3);
    p.exposed = 0.15;
    if (sk.t >= mv.dur) this.endSkill(p);
  }

  /** Ball path during a move: at the feet, dragged behind for drag moves, popped up for flicks. */
  skillBall(p) {
    const sk = p.skill, mv = sk.mv, b = this.ball;
    const k = Math.min(1, sk.t / mv.dur);
    let r = 0.45;
    if (mv.back) r = 0.45 * Math.cos(k * Math.PI);
    const a = p.face;
    b.x = p.x + Math.cos(a) * r;
    b.y = p.y + Math.sin(a) * r;
    b.z = mv.lift ? Math.sin(k * Math.PI) * Math.min(1.2, mv.lift * 0.18) : 0;
    b.vx = p.vx; b.vy = p.vy; b.vz = 0;
  }

  endSkill(p) {
    const sk = p.skill, mv = sk.mv, b = this.ball;
    p.skill = null;
    const ex = this.skillVec(sk, mv.exit[0], mv.exit[1]);
    const ea = Math.atan2(ex.y, ex.x);
    p.face = ea;
    p.vx = Math.cos(ea) * mv.burst; p.vy = Math.sin(ea) * mv.burst;
    b.x = p.x + Math.cos(ea) * 0.6; b.y = p.y + Math.sin(ea) * 0.6; b.z = 0;
    p.touchPh = 0;
    const opp = this.nearestOpp(p);
    const at = p.attrs;
    const skill = ((at.dri ?? 60) * 0.5 + (at.agi ?? 60) * 0.3 + (at.bal ?? 60) * 0.2) / 99;
    if (opp.p && opp.d < 3.2) {
      const q = opp.p, qa = q.attrs;
      const def = ((qa.rea ?? 60) * 0.5 + (qa.stt ?? 60) * 0.3 + (qa.awa ?? 60) * 0.2) / 99;
      const cpuDef = this.teams[q.team].cpu;
      const pBeat = clamp(mv.beat * (0.6 + skill) - (def - 0.6) * 0.6 - (p.skillChain ?? 0) * 0.12, 0.05, 0.9) * (cpuDef ? 1.15 - 0.3 * (this.diff.intercept ?? 0.8) : 1);
      if (this.rng.chance(pBeat)) {
        if (!q.act) q.act = { type: 'stumble', t: 0, dur: 20 + mv.tier * 4 };
        this.log('skill_beat', { pid: p.id, team: p.team, on: q.id, move: sk.name });
      } else {
        const lose = clamp(0.14 + (p.skillChain ?? 0) * 0.12 - skill * 0.1, 0.03, 0.45) * (opp.d < 1.6 ? 1 : 0.3);
        if (this.rng.chance(lose)) { this.looseFromCarrier(p, 3 + this.rng.range(0, 2), Math.atan2(q.y - p.y, q.x - p.x) + this.rng.range(-0.8, 0.8), 'skill'); return; }
      }
    }
    if (mv.lift) {
      // flick over: the ball is airborne for a moment, the carrier runs onto it
      this.owner = null;
      const v = mv.burst + 1.5;
      b.vx = Math.cos(ea) * v; b.vy = Math.sin(ea) * v; b.vz = mv.lift;
      this.lastKick = { pid: p.id, team: p.team, type: 'flick', tick: this.tick, foot: true, pass: false };
      p.cool = 10;
      this.newPath();
    }
  }

  /** Turn a fired button into a kick spec for the user's carrier (or a queued first-time action). */
  humanSpec(c, p, fire, d) {
    const m = fire.mods;
    const t = this.teams[p.team];
    const dir = d ?? { x: Math.cos(p.face), y: Math.sin(p.face) };
    if (fire.btn === B.SHOOT) {
      const st = m & B.MOD ? 'chip' : m & B.FIN ? 'finesse' : m & B.PWR ? 'power' : 'normal';
      return AI.shotSpec(this, p, st, fire.power, d, c.assist.shot);
    }
    const lofted = fire.btn === B.LOB;
    let kind = fire.btn === B.PASS ? (m & B.FIN ? 'driven' : 'ground') : fire.btn === B.THRU ? (m & B.MOD ? 'lofted' : m & B.FIN ? 'lofted_driven' : 'through') : 'lob';
    if (lofted && m & B.FIN) kind = 'driven_lob';
    const spec = AI.userPass(this, p, kind, d ?? null, fire.power, c.assist.pass, dir);
    if (spec && fire.btn === B.PASS && (m & B.MOD)) spec.oneTwo = true;
    if (spec && (m & B.PWR) && fire.btn === B.PASS) spec.errMult = 1.12;
    return spec;
  }

  humanAttackOff(c, p, f, d) {
    // switch (Q) and call for the ball (S) / through (W)
    if (c.press & B.MOD) { const n = this.switchTarget(c); if (n) this.control(c, n); return; }
    if ((f.sx || f.sy) && this.tick - (c.lastSwitch ?? 0) > 12) { const n = this.switchTarget(c, f.sx, f.sy); if (n) { this.control(c, n); c.lastSwitch = this.tick; } return; }
    const fire = this.holdFire(c, [B.SHOOT, B.PASS, B.LOB, B.THRU]);
    // ball coming to me: queue a first-time action
    if (fire && !this.owner) {
      const btn = fire.btn, pw = fire.power, mods = fire.mods, dd = d;
      p.queued = { tick: this.tick, kind: btn === B.SHOOT ? 'shot' : 'pass', power: pw, aim: dd, spec: (m, pl) => this.humanSpec(c, pl, { btn, power: pw, mods }, dd) };
    } else if (fire && this.owner && this.owner.team === p.team && !this.owner.ctl) {
      // co-op / CPU teammate: ask for the ball
      AI.requestBall(this, this.owner, p, fire.btn === B.THRU);
    }
    // receive assist: the intended receiver goes to meet the ball unless the stick clearly points elsewhere
    const lk = this.lastKick;
    if (!this.owner && lk && lk.receiver === p.id && lk.team === p.team) {
      const c2 = this.teams[p.team].chaseMap?.get(p.id);
      const tgt = c2 ? { x: c2.x, y: c2.y } : this.ballTarget();
      const dx = tgt.x - p.x, dy = tgt.y - p.y, dl = Math.hypot(dx, dy);
      const agree = !d || dl < 0.5 || (d.x * dx + d.y * dy) / dl > 0.35 || this.tick - lk.tick < 25;
      if (agree && dl < 30) { p.wantX = dl > 0.3 ? dx / dl : 0; p.wantY = dl > 0.3 ? dy / dl : 0; p.wantS = dl > 0.3 ? (dl > 4 ? 1 : 0.7) : 0; }
    }
  }

  humanDefend(c, p, f, d) {
    // switching
    if (c.press & B.MOD) { const n = this.switchTarget(c); if (n) this.control(c, n); return; }
    if ((f.sx || f.sy) && this.tick - (c.lastSwitch ?? 0) > 12) { const n = this.switchTarget(c, f.sx, f.sy); if (n) { this.control(c, n); c.lastSwitch = this.tick; } return; }
    // auto-switch on air balls to whoever reaches the landing spot
    if (!this.owner && c.assist.autoSwitch !== 'manual' && this.path && this.tick === this.pathT + 1 && this.ball.vz > 3) {
      const n = this.switchTarget(c); if (n && dist(n, this.ballTarget()) + 3 < dist(p, this.ballTarget())) this.control(c, n);
    }
    // contain (hold S): AI moves the player to the blocking spot
    if ((f.b & B.PASS) && this.owner) {
      const s = AI.containSpot(this, p, this.owner);
      p.wantX = s.x - p.x; p.wantY = s.y - p.y; p.wantS = Math.min(1, Math.hypot(p.wantX, p.wantY) / 3 + 0.3);
      p.jockey = Math.hypot(p.wantX, p.wantY) < 3;
    }
    // teammate contain (hold Shift)
    this.teams[p.team].teamContain = !!(f.b & B.FIN);
    if (c.press & B.SHOOT) {
      if (!this.owner && this.ball.z > 1.0 && dist(p, this.ball) < 3) p.queued = { tick: this.tick, kind: 'clear', power: 1, spec: () => null };
      else this.tryTackle(p, 'stand');
    }
    if (c.press & B.LOB) this.tryTackle(p, 'slide');
    if (c.press & B.THRU) AI.keeperRush(this, p.team);
    if (c.press & B.CALL) AI.stepUpLine(this, p.team);
  }

  humanKeeperBall(c, p, f, d) {
    p.holding.t++;
    p.wantS = 0;
    const fire = this.holdFire(c, [B.PASS, B.LOB, B.THRU, B.SHOOT]);
    if (c.press & B.JOCK) { p.holding = null; return; }   // drop to feet
    if (!fire) return;
    const dir = d ?? { x: this.teams[p.team].dir, y: 0 };
    let spec;
    if (fire.btn === B.PASS) spec = AI.userPass(this, p, 'gkthrow', dir, fire.power, c.assist.pass);
    else if (fire.btn === B.THRU) spec = AI.userPass(this, p, 'gkthrow_far', dir, fire.power, c.assist.pass);
    else spec = AI.userPass(this, p, fire.mods & B.FIN ? 'driven_lob' : 'gkkick', dir, fire.power, c.assist.pass);
    if (spec) { p.holding = null; this.startKick(p, spec, 10); }
  }

  humanRestart(c, taker, r) {
    const f = c.frame ?? EMPTY;
    const t = this.teams[r.team];
    // aim marker (free kicks near goal, corners)
    const d = this.dirOf(f);
    taker.wantX = 0; taker.wantY = 0; taker.wantS = 0;
    if (d) taker.face = Math.atan2(d.y, d.x);
    if (c.press & B.MOD) {
      // cycle takers / receivers
      AI.cycleTaker(this, r);
      const nt = this.byId.get(r.taker);
      if (nt) this.control(c, nt);
      return;
    }
    if ((f.sx || f.sy) && r.type === 'freekick') { r.curl = clamp((r.curl ?? 0) + f.sx * 0.05, -3, 3); }
    const fire = this.holdFire(c, [B.SHOOT, B.PASS, B.LOB, B.THRU]);
    if (!fire) return;
    let spec;
    if (fire.btn === B.SHOOT && r.type !== 'throw') {
      spec = AI.shotSpec(this, taker, 'normal', fire.power, d, c.assist.shot);
      if (r.type === 'freekick') { spec.shotType = 'fk'; spec.setPiece = 'freekick'; spec.curl = (r.curl ?? 0) * -t.dir + (spec.curl ?? 0); if (fire.mods & B.FIN) spec.power = Math.min(1, spec.power + 0.1); }
    } else if (r.type === 'corner' && fire.btn === B.LOB) {
      // corner zones: near post, middle, far post, edge of the box; arrows pick, none = middle
      const L = PITCH.HALF_L, sy = Math.sign(r.y) || 1, dir = t.dir;
      const zones = [{ x: dir * (L - 5), y: sy * 3 }, { x: dir * (L - 8.5), y: 0 }, { x: dir * (L - 6), y: -sy * 4.5 }, { x: dir * (L - 17), y: sy * 2 }];
      let z = zones[1];
      if (d) { let bc = -2; for (const zz of zones) { const dx = zz.x - taker.x, dy = zz.y - taker.y, dl = Math.hypot(dx, dy); const cs = (dx * d.x + dy * d.y) / dl; if (cs > bc) { bc = cs; z = zz; } } }
      let recv = null, rd = 1e9;
      for (const q of t.on) { if (!q.onPitch || q.red || q === taker || q.pos === 'GK') continue; const dd = Math.hypot(q.x - z.x, q.y - z.y); if (dd < rd) { rd = dd; recv = q; } }
      spec = { type: 'cross', tx: z.x, ty: z.y, receiver: recv?.id ?? null, power: fire.power, setPiece: 'corner', whip: !!(fire.mods & B.FIN), low: false };
    } else {
      const kind = fire.btn === B.PASS ? 'ground' : fire.btn === B.THRU ? 'through' : r.type === 'corner' || r.type === 'freekick' ? 'cross' : 'lob';
      const toBox = { x: t.dir * (PITCH.HALF_L - 10) - taker.x, y: -taker.y };
      const tl = Math.hypot(toBox.x, toBox.y) || 1;
      spec = AI.userPass(this, taker, kind, d ?? (kind === 'cross' ? { x: toBox.x / tl, y: toBox.y / tl } : null), fire.power, c.assist.pass, { x: t.dir, y: 0 });
      if (spec && r.type === 'corner') spec.setPiece = 'corner';
      if (spec && r.type === 'freekick') spec.setPiece = 'freekick';
      if (spec && kind === 'cross' && (fire.mods & B.FIN)) spec.whip = true;
    }
    if (!spec) return;
    this.startKick(taker, spec, spec.type === 'shot' ? 18 : 8);
    if (spec.type === 'shot') this.timedWindow(c, taker, spec, 18);
  }
}

export { STEPS_PER_S };
</script>
<script type="text/plain" data-mod="engine/boxscore.js">// Match stats derived ONLY from the event log (never tracked separately).
export function deriveStats(m) {
  const ev = m.events;
  const team = () => ({ goals: 0, shots: 0, onTarget: 0, xg: 0, passes: 0, passOk: 0, crosses: 0, corners: 0, offsides: 0, fouls: 0, yellows: 0, reds: 0, tackles: 0, tacklesWon: 0, interceptions: 0, saves: 0, bigChances: 0, possession: 0, blocks: 0 });
  const T = [team(), team()];
  const P = new Map();
  const ps = (id) => { if (!P.has(id)) P.set(id, { id, goals: 0, assists: 0, shots: 0, onTarget: 0, xg: 0, xa: 0, keyPasses: 0, passes: 0, passOk: 0, tackles: 0, interceptions: 0, clearances: 0, fouls: 0, yellow: 0, red: 0, saves: 0, conceded: 0, blocks: 0, miscontrols: 0, rating: 6.0, owngoals: 0 }); return P.get(id); };
  const shots = [];
  for (let i = 0; i < ev.length; i++) {
    const e = ev[i];
    switch (e.type) {
      case 'shot': {
        const t = T[e.team], p = ps(e.pid);
        t.shots++; p.shots++; t.xg += e.xg; p.xg += e.xg;
        if (e.xg >= 0.3) t.bigChances++;
        // on target if a save or goal follows for this shot before the next shot
        let outcome = 'off';
        for (let j = i + 1; j < ev.length && j < i + 40; j++) {
          const f = ev[j];
          if (f.type === 'shot') break;
          if (f.type === 'goal' && f.team === e.team && !f.own) { outcome = 'goal'; break; }
          if (f.type === 'save' && f.shooter === e.pid) { outcome = 'saved'; break; }
          if (f.type === 'block' && f.shooter === e.pid) { outcome = 'blocked'; break; }
          if (f.type === 'woodwork') { outcome = 'post'; break; }
          if (f.type === 'kickoff' || f.type === 'out') break;
        }
        if (outcome === 'goal' || outcome === 'saved') { t.onTarget++; p.onTarget++; }
        if (outcome === 'blocked') T[1 - e.team].blocks++;
        shots.push({ team: e.team, pid: e.pid, x: e.x, y: e.y, xg: e.xg, outcome, t: e.t, kind: e.kind });
        // key pass / xA: last pass to the shooter
        for (let j = i - 1; j >= 0 && j > i - 12; j--) {
          const f = ev[j];
          if (f.type === 'pass_ok' && f.to === e.pid && f.team === e.team) { const a = ps(f.pid); a.keyPasses++; a.xa += e.xg; break; }
          if (f.type === 'shot' || f.type === 'kickoff') break;
        }
        break;
      }
      case 'pass': T[e.team].passes++; ps(e.pid).passes++; if (e.cross) T[e.team].crosses++; break;
      case 'pass_ok': T[e.team].passOk++; ps(e.pid).passOk++; break;
      case 'goal': {
        T[e.team].goals++;
        const p = ps(e.pid);
        if (e.own) p.owngoals++; else p.goals++;
        if (e.assist) ps(e.assist).assists++;
        // conceded for the keeper and defenders on the pitch
        break;
      }
      case 'save': T[e.team].saves++; ps(e.pid).saves++; break;
      case 'tackle': T[e.team].tackles++; ps(e.pid).tackles++; if (e.won) T[e.team].tacklesWon++; break;
      case 'interception': T[e.team].interceptions++; ps(e.pid).interceptions++; break;
      case 'clearance': ps(e.pid).clearances++; break;
      case 'foul': T[e.team].fouls++; ps(e.pid).fouls++; break;
      case 'card': if (e.card === 'Y' && !e.second) { T[e.team].yellows++; ps(e.pid).yellow++; } else { T[e.team].reds++; ps(e.pid).red++; if (e.second) T[e.team].yellows++; } break;
      case 'offside': T[e.team].offsides++; break;
      case 'corner': T[e.team].corners++; break;
      case 'block': ps(e.pid).blocks++; break;
      case 'miscontrol': ps(e.pid).miscontrols++; break;
    }
  }
  // passes completed also count when the receiver of a pass is a teammate controlling it (logged as pass_ok)
  const pt = m.teams[0].possTicks + m.teams[1].possTicks || 1;
  T[0].possession = Math.round(m.teams[0].possTicks / pt * 100);
  T[1].possession = 100 - T[0].possession;
  // ratings
  for (const t of m.teams) {
    const conceded = T[1 - t.idx].goals;
    for (const p of [...t.on, ...t.off, ...t.bench]) {
      if (p.entered == null) continue;
      const s = ps(p.id);
      let r = 6.0 + s.goals * 1.0 + s.assists * 0.6 + s.keyPasses * 0.15 + s.tackles * 0.07 + s.interceptions * 0.08 + s.saves * 0.25 + s.blocks * 0.1
        - s.owngoals * 0.8 - s.red * 1.5 - s.yellow * 0.2 - s.miscontrols * 0.04 + (s.passes > 5 ? (s.passOk / s.passes - 0.75) * 1.5 : 0)
        - ((p.pos === 'GK' || ['CB', 'LB', 'RB', 'LWB', 'RWB'].includes(p.pos)) ? conceded * 0.15 : 0)
        + (T[t.idx].goals > conceded ? 0.3 : T[t.idx].goals < conceded ? -0.2 : 0);
      if (s.shots > 2 && s.goals === 0) r -= 0.2;
      s.rating = Math.round(Math.max(3, Math.min(10, r)) * 10) / 10;
      s.team = t.idx; s.name = p.name; s.pos = p.pos; s.mins = Math.round(p.mins);
    }
  }
  // player of the match: highest rating, winning team preferred within 0.3
  const all = [...P.values()].filter((s) => s.team != null);
  const winner = T[0].goals > T[1].goals ? 0 : T[1].goals > T[0].goals ? 1 : -1;
  all.sort((a, b) => (b.rating + (b.team === winner ? 0.3 : 0)) - (a.rating + (a.team === winner ? 0.3 : 0)));
  return { teams: T, players: P, shots, potm: all[0]?.id ?? null, scorers: ev.filter((e) => e.type === 'goal').map((e) => ({ team: e.team, pid: e.pid, own: e.own, min: Math.ceil(e.t / 60), pen: e.setPiece === 'penalty' })) };
}
</script>
<script type="text/plain" data-mod="render/view.js">// Broadcast projection and camera. The camera sits high on the halfway line: x along the pitch maps
// to screen x (scaled by a perspective factor that narrows the far touchline), y across the pitch is
// compressed, z (height) moves things up. The projection is fixed relative to the pitch, so the pitch
// can be pre-rendered once and panned.
import { PITCH } from '@@engine/pitch.js@@';

export const W = 640, H = 360;
export const Y_SQUASH = 0.42;
export const FAR_K = 0.84;              // far touchline drawn at 84% of the near one

export const CAMERAS = {
  broadcast: { s: 12, label: 'Broadcast' },
  tele: { s: 15, label: 'Tele' },
  wide: { s: 9, label: 'Wide' },
  coop: { s: 10, label: 'Co-op' },
  pro: { s: 14, label: 'Pro' },
};

export class View {
  constructor() {
    this.s = 12;
    this.cx = 0; this.cy = 0;     // camera center in projected pixels (relative to world origin)
    this.shake = 0;
  }

  k(y) { return FAR_K + (1 - FAR_K) * (y + PITCH.HALF_W) / PITCH.W; }

  /** World -> projected pixel coordinates relative to the world origin (no camera). */
  proj(x, y, z = 0) {
    const k = this.k(y);
    return { x: x * this.s * k, y: y * this.s * Y_SQUASH - z * this.s * k, k };
  }

  /** World -> screen. */
  screen(x, y, z = 0) {
    const p = this.proj(x, y, z);
    return { x: Math.round(p.x - this.cx + W / 2), y: Math.round(p.y - this.cy + H / 2), k: p.k };
  }

  /** Follow a world point with smoothing; clamp to the stadium. */
  follow(x, y, lead = 0, snap = false) {
    const p = this.proj(x + lead, y);
    const tx = p.x, ty = p.y + 10;
    const maxX = PITCH.HALF_L * this.s + 40 - W / 2;
    const minY = -PITCH.HALF_W * this.s * Y_SQUASH - 70 + H / 2;
    const maxY = PITCH.HALF_W * this.s * Y_SQUASH + 40 - H / 2;
    const cx = Math.max(-maxX, Math.min(maxX, tx));
    const cy = Math.max(minY, Math.min(maxY, ty));
    if (snap) { this.cx = cx; this.cy = cy; return; }
    this.cx += (cx - this.cx) * 0.08;
    this.cy += (cy - this.cy) * 0.07;
  }
}
</script>

/**
 * Draw text. align: 'left' | 'center' | 'right'. Returns the width in pixels.
 * opts: { font: 'big'|'tiny', color, scale, align, shadow: css colour or null }
 */
export function text(ctx, str, x, y, { font = 'big', color = '#fff', scale = 1, align = 'left', shadow = null } = {}) {
  if (str == null || str === '') return 0;
  const key = `${font}|${color}|${scale}|${shadow}|${str}`;
  let b = cache.get(key);

    if (cache.size > 600) cache.clear();

}

<script type="text/plain" data-mod="render/stadium.js">// Pre-rendered pitch and stands for one camera scale. Drawn once (per scale / home club / time of
// day) into an offscreen canvas, then panned by the camera.
import { PITCH } from '@@engine/pitch.js@@';
import { Y_SQUASH, FAR_K } from '@@render/view.js@@';
import { text } from '@@render/font.js@@';

const mk = (w, h) => (typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h }));

function lcg(seed) { let s = seed >>> 0 || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); }

export function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/**
 * opts: { s, home: {primary, secondary}, away: {primary}, pattern: 'straight'|'checker'|'wide', night, code, stadium }
 * Returns { canvas, ox, oy }: world origin at (ox, oy) in the canvas.
 */
export function buildStadium(opts) {
  const s = opts.s;
  const k = (y) => FAR_K + (1 - FAR_K) * (y + PITCH.HALF_W) / PITCH.W;
  const halfX = Math.ceil((PITCH.HALF_L + 9) * s);
  const topStand = 92, botMargin = 54;
  const pitchTop = Math.round((-PITCH.HALF_W - 4) * s * Y_SQUASH);
  const pitchBot = Math.round((PITCH.HALF_W + 5) * s * Y_SQUASH);
  const ox = halfX, oy = -pitchTop + topStand;
  const w = halfX * 2, h = oy + pitchBot + botMargin;
  const c = mk(w, h), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const rnd = lcg(opts.seed ?? 7);
  const night = !!opts.night;
  // sky / roof
  g.fillStyle = night ? '#05070d' : '#1b2230';
  g.fillRect(0, 0, w, h);
  // ---- far stand: tiers of crowd
  const standY0 = 10, standY1 = oy + pitchTop - 8;
  const crowdCols = [opts.home.primary, opts.home.primary, opts.home.secondary, '#d8d8d8', '#2a2a2a', '#5a4a3a', '#8a6a4a', '#c79a6a', opts.home.primary];
  const awayCols = [opts.away.primary, opts.away.secondary ?? '#fff', '#d8d8d8'];
  g.fillStyle = '#2b3446'; g.fillRect(0, standY0, w, standY1 - standY0);
  for (let y = standY0 + 4; y < standY1 - 2; y += 4) {
    // concrete step
    g.fillStyle = (y >> 2) % 2 ? '#313b4f' : '#293244';
    g.fillRect(0, y + 3, w, 1);
    for (let x = 0; x < w; x += 3) {
      if (rnd() < 0.08) continue;
      const awayEnd = x > w * 0.82;
      const col = awayEnd ? awayCols[(rnd() * awayCols.length) | 0] : crowdCols[(rnd() * crowdCols.length) | 0];
      g.fillStyle = shade(col, night ? -0.35 : -0.1 + rnd() * 0.15);
      g.fillRect(x, y, 2, 2);
      g.fillStyle = night ? '#6a5040' : '#c8a080';
      if (rnd() < 0.7) g.fillRect(x, y - 1, 2, 1);
    }
  }
  // roof edge and floodlights
  g.fillStyle = '#0d1018'; g.fillRect(0, 0, w, standY0);
  g.fillStyle = '#5b6578'; g.fillRect(0, standY0 - 2, w, 2);
  for (let x = 40; x < w; x += 220) { g.fillStyle = night ? '#fff6cc' : '#9aa4b5'; g.fillRect(x, 2, 18, 4); g.fillStyle = '#3a4252'; g.fillRect(x + 8, 6, 2, standY0 - 6); }
  // ---- advertising boards (far side)
  const boardY = standY1 - 2;
  g.fillStyle = '#0c0f16'; g.fillRect(0, boardY - 1, w, 10);
  const words = ['MINISOCCER', opts.code ?? 'HOME', 'MATCHDAY', opts.stadium ?? 'STADIUM'];
  let bx = 4, wi = 0;
  while (bx < w) {
    const word = words[wi++ % words.length];
    const col = ['#ffd84a', '#ffffff', '#66e0ff', '#ff8a5a'][wi % 4];
    g.fillStyle = ['#13306b', '#5b1414', '#14502a', '#3a2a6b'][wi % 4];
    const ww = word.length * 6 + 16;
    g.fillRect(bx, boardY, ww, 8);
    text(g, word, bx + 8, boardY + 1, { color: col, font: 'tiny' });
    bx += ww + 2;
  }
  // ---- grass: mown stripes, row by row (exact perspective)
  const stripeW = PITCH.L / 18;
  const g1 = night ? '#1f6b2e' : '#2f8a3c', g2 = night ? '#1a5e28' : '#287a34';
  const pattern = opts.pattern ?? 'straight';
  for (let Y = pitchTop; Y <= pitchBot; Y++) {
    const y = Y / (s * Y_SQUASH);
    const kk = k(y);
    const yy = oy + Y;
    const xMax = (PITCH.HALF_L + 6) * s * kk;
    for (let i = -10; i < 10; i++) {
      const x0 = Math.max(-(PITCH.HALF_L + 6), i * stripeW), x1 = Math.min(PITCH.HALF_L + 6, (i + 1) * stripeW);
      if (x1 <= x0) continue;
      let alt = i & 1;
      if (pattern === 'checker') alt ^= (Math.floor((y + 40) / 8.5) & 1);
      g.fillStyle = alt ? g1 : g2;
      const X0 = Math.round(ox + x0 * s * kk), X1 = Math.round(ox + x1 * s * kk);
      g.fillRect(X0, yy, X1 - X0, 1);
    }
    // outside the stripes (beyond goal lines + run-off)
    g.fillStyle = g2;
    g.fillRect(0, yy, Math.round(ox - xMax), 1);
    g.fillRect(Math.round(ox + xMax), yy, w, 1);
  }
  // goalmouth wear
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 260; i++) {
      const x = sx * (PITCH.HALF_L - rnd() * 7), y = (rnd() - 0.5) * 9;
      const kk = k(y);
      g.fillStyle = rnd() < 0.5 ? '#5d7a3a' : '#6f8a45';
      g.fillRect(Math.round(ox + x * s * kk), Math.round(oy + y * s * Y_SQUASH), 1, 1);
    }
  }
  // ---- lines
  g.fillStyle = 'rgba(245,250,245,0.92)';
  const dot = (x, y) => { const kk = k(y); g.fillRect(Math.round(ox + x * s * kk), Math.round(oy + y * s * Y_SQUASH), 1, 1); };
  const seg = (x0, y0, x1, y1) => { const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * s * 1.6); for (let i = 0; i <= n; i++) dot(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); };
  const arc = (cx, cy, r, a0, a1) => { const n = Math.ceil(r * s * 7); for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; dot(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } };
  const L = PITCH.HALF_L, Wd = PITCH.HALF_W;
  seg(-L, -Wd, L, -Wd); seg(-L, Wd, L, Wd); seg(-L, -Wd, -L, Wd); seg(L, -Wd, L, Wd); seg(0, -Wd, 0, Wd);
  // second pixel row for the near touchline (thicker, closer)
  seg(-L, Wd + 0.1, L, Wd + 0.1);
  arc(0, 0, PITCH.CIRCLE_R, 0, Math.PI * 2);
  for (const sx of [-1, 1]) {
    const gx = sx * L;
    seg(gx, -PITCH.BOX_HALF_W, gx - sx * PITCH.BOX_DEPTH, -PITCH.BOX_HALF_W);
    seg(gx, PITCH.BOX_HALF_W, gx - sx * PITCH.BOX_DEPTH, PITCH.BOX_HALF_W);
    seg(gx - sx * PITCH.BOX_DEPTH, -PITCH.BOX_HALF_W, gx - sx * PITCH.BOX_DEPTH, PITCH.BOX_HALF_W);
    seg(gx, -PITCH.SIX_HALF_W, gx - sx * PITCH.SIX_DEPTH, -PITCH.SIX_HALF_W);
    seg(gx, PITCH.SIX_HALF_W, gx - sx * PITCH.SIX_DEPTH, PITCH.SIX_HALF_W);
    seg(gx - sx * PITCH.SIX_DEPTH, -PITCH.SIX_HALF_W, gx - sx * PITCH.SIX_DEPTH, PITCH.SIX_HALF_W);
    const px = gx - sx * PITCH.PEN_SPOT;
    dot(px, 0); dot(px + 0.08, 0);
    // penalty arc: the part of the circle outside the box
    const a = Math.acos((PITCH.BOX_DEPTH - PITCH.PEN_SPOT) / PITCH.ARC_R);
    if (sx > 0) arc(px, 0, PITCH.ARC_R, Math.PI - a, Math.PI + a); else arc(px, 0, PITCH.ARC_R, -a, a);
    for (const sy of [-1, 1]) {
      const cy = sy * Wd;
      if (sx > 0 && sy > 0) arc(gx, cy, 1, Math.PI, Math.PI * 1.5);
      if (sx > 0 && sy < 0) arc(gx, cy, 1, Math.PI / 2, Math.PI);
      if (sx < 0 && sy > 0) arc(gx, cy, 1, Math.PI * 1.5, Math.PI * 2);
      if (sx < 0 && sy < 0) arc(gx, cy, 1, 0, Math.PI / 2);
    }
  }
  dot(0, 0); dot(0.08, 0);
  // ---- near side boards and a strip of the near stand
  const nearY = Math.round(oy + (PITCH.HALF_W + 3.2) * s * Y_SQUASH);
  g.fillStyle = '#0c0f16'; g.fillRect(0, nearY, w, 14);
  bx = 10; wi = 1;
  while (bx < w) {
    const word = words[wi++ % words.length];
    g.fillStyle = ['#13306b', '#5b1414', '#14502a', '#3a2a6b'][wi % 4];
    const ww = word.length * 12 + 24;
    g.fillRect(bx, nearY + 1, ww, 12);
    text(g, word, bx + 12, nearY + 3, { color: ['#ffd84a', '#ffffff', '#66e0ff', '#ff8a5a'][wi % 4], font: 'big' });
    bx += ww + 3;
  }
  g.fillStyle = '#20283a'; g.fillRect(0, nearY + 14, w, h - nearY - 14);
  for (let y = nearY + 18; y < h; y += 5) for (let x = 0; x < w; x += 4) {
    if (rnd() < 0.15) continue;
    g.fillStyle = shade(crowdCols[(rnd() * crowdCols.length) | 0], night ? -0.4 : -0.2);
    g.fillRect(x, y, 3, 3);
    g.fillStyle = night ? '#5a4436' : '#b89070'; g.fillRect(x, y - 1, 3, 1);
  }
  // dugouts on the near side
  for (const sx of [-1, 1]) {
    const x0 = Math.round(ox + sx * 9 * s) - (sx < 0 ? 60 : 0);
    g.fillStyle = '#2c3442'; g.fillRect(x0, nearY - 8, 60, 8);
    g.fillStyle = '#7f8da6'; g.fillRect(x0, nearY - 8, 60, 1);
  }
  return { canvas: c, ox, oy };
}

<script type="text/plain" data-mod="render/sprites.js">// Procedural pixel players. A small stick rig (thigh, shin, torso, arms, head) posed per animation
// and rasterized with square "pixels", so it works at any angle (runs, kicks, slides, dives, falls).
// Heights are to scale: sprite height = real height x camera scale.

const TAU = Math.PI * 2;

export const SKINS = ['#f1c9a5', '#e0ac85', '#c68a62', '#a86d48', '#8a5636', '#6a3f26', '#4e2e1c'];
export const HAIRS = ['#1b1410', '#2e1f14', '#4a2f1a', '#7a4b22', '#b07a3a', '#d8b46a', '#e9e2d0', '#8a1e12'];

function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

export function lookFor(p, appearance) {
  const a = appearance?.[p.id];
  const h = hash(p.id);
  return {
    skin: a?.skin ?? SKINS[h % SKINS.length],
    hair: a?.hair ?? HAIRS[(h >> 4) % 5],
    style: a?.style ?? ['short', 'short', 'buzz', 'long', 'curly', 'bald', 'bun'][(h >> 8) % 7],
    boots: a?.boots ?? ['#111', '#f2f2f2', '#ff5a3c', '#3ad1ff', '#ffe14a', '#ff3ca0'][(h >> 12) % 6],
    beard: a?.beard ?? ((h >> 16) % 4 === 0),
  };
}

/** Raster helper: thick line of square pixels. */
function line(g, x0, y0, x1, y1, t, col) {
  g.fillStyle = col;
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
  const h = t / 2;
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    g.fillRect(Math.round(x - h), Math.round(y - h), t, t);
  }
}

/**
 * Pose for a player: returns joint positions in local px (feet at 0,0; y up; +x = facing side).
 * kind: 'stand'|'run'|'kick'|'slide'|'dive'|'down'|'celebrate'|'header'|'throw'|'jockey'|'tackle'|'gk_ready'|'hold'
 */
function pose(kind, ph, H, extra = {}) {
  const leg = H * 0.44, thigh = leg * 0.52, shin = leg * 0.48;
  const torso = H * 0.29, neck = H * 0.04;
  let hip = leg, lean = 0, armA = 0.15, armB = -0.15, thA = 0, thB = 0, knA = 0, knB = 0, rot = 0, lift = 0, elbowA = 0.3, elbowB = 0.3;
  switch (kind) {
    case 'run': {
      const s = Math.sin(ph), c = Math.cos(ph);
      const amp = extra.amp ?? 0.7;
      thA = s * amp; thB = -s * amp;
      knA = Math.max(0, -c) * 1.1 * amp + 0.15; knB = Math.max(0, c) * 1.1 * amp + 0.15;
      armA = -s * amp * 0.9; armB = s * amp * 0.9; elbowA = 0.9; elbowB = 0.9;
      lean = 0.12 * amp; hip = leg * (0.96 + 0.04 * Math.abs(c));
      break;
    }
    case 'jockey': thA = 0.35; thB = -0.35; knA = 0.4; knB = 0.4; hip = leg * 0.9; armA = 0.5; armB = -0.5; lean = 0.05; break;
    case 'kick': {
      // ph 0..1: back-swing then strike
      const k = ph < 0.6 ? -ph / 0.6 : -1 + (ph - 0.6) / 0.4 * 2.4;
      thA = k * 0.9; knA = ph < 0.6 ? 1.2 * ph / 0.6 : Math.max(0, 1.2 - (ph - 0.6) * 4);
      thB = -0.1; knB = 0.1; armA = -0.8; armB = 0.9; elbowA = 0.4; lean = -0.1;
      break;
    }
    case 'header': hip = leg + (extra.jump ?? 0); thA = -0.2; thB = 0.25; knA = 0.6; knB = 0.5; armA = 1.2; armB = 1.0; lean = 0.25; break;
    case 'throw': armA = Math.PI - 0.2 - ph * 0.8; armB = Math.PI - 0.2 - ph * 0.8; elbowA = -0.5 * (1 - ph); elbowB = elbowA; lean = -0.2 + ph * 0.4; thA = 0.2; thB = -0.2; break;
    case 'celebrate': armA = Math.PI - 0.5; armB = Math.PI - 0.5 + (extra.style === 2 ? 0 : 0.2); elbowA = 0.1; elbowB = 0.1; thA = Math.sin(ph) * 0.4; thB = -Math.sin(ph) * 0.4; knA = 0.3; knB = 0.3; break;
    case 'gk_ready': thA = 0.3; thB = -0.3; knA = 0.6; knB = 0.6; hip = leg * 0.86; armA = 0.9; armB = -0.9; elbowA = 0.6; elbowB = -0.6; lean = 0.15; break;
    case 'hold': armA = 0.9; armB = 0.9; elbowA = 1.2; elbowB = 1.2; break;
    case 'tackle': thA = 1.0; knA = 0.1; thB = -0.3; knB = 0.6; hip = leg * 0.85; lean = -0.2; armA = -0.6; armB = 0.8; break;
    case 'slide': rot = -1.25; thA = 1.3; knA = 0.1; thB = 0.6; knB = 1.2; armA = 0.6; armB = 1.8; lift = 0; break;
    case 'dive': rot = extra.dir * 1.35; thA = 0.2; thB = -0.2; knA = 0.3; knB = 0.4; armA = Math.PI - 0.15; armB = Math.PI - 0.35; elbowA = 0; elbowB = 0; lift = extra.lift ?? 4; break;
    case 'down': rot = 1.5 * (extra.dir ?? 1); thA = 0.15; thB = -0.1; knA = 0.4; knB = 0.2; armA = 0.4; armB = -0.3; lift = 0; break;
    case 'stand': default: thA = 0.06; thB = -0.06; knA = 0.05; knB = 0.05; break;
  }
  const P = {};
  P.hip = [0, hip];
  const legJ = (th, kn) => { const kx = Math.sin(th) * thigh, ky = hip - Math.cos(th) * thigh; const a2 = th - kn; return { knee: [kx, ky], foot: [kx + Math.sin(a2) * shin, ky - Math.cos(a2) * shin] }; };
  P.A = legJ(thA, knA); P.B = legJ(thB, knB);
  const sh = [Math.sin(lean) * torso, hip + Math.cos(lean) * torso];
  P.sh = sh;
  P.head = [sh[0] + Math.sin(lean) * (neck + H * 0.08), sh[1] + neck + H * 0.07];
  const arm = H * 0.17, fore = H * 0.15;
  const armJ = (a, e) => { const ex = sh[0] + Math.sin(a) * arm, ey = sh[1] - Math.cos(a) * arm; const a2 = a + e; return { elbow: [ex, ey], hand: [ex + Math.sin(a2) * fore, ey - Math.cos(a2) * fore] }; };
  P.armA = armJ(armA, elbowA); P.armB = armJ(armB, elbowB);
  P.rot = rot; P.lift = lift;
  return P;
}

/**
 * Draw one player. x, y = screen position of the feet; s = scale (px per meter at this depth).
 * view: 'side' | 'front' | 'back'; flip = facing left.
 */
export function drawPlayer(g, x, y, s, st) {
  const H = Math.max(14, Math.round(st.h * s * 0.98));
  const P = pose(st.kind, st.ph ?? 0, H, st.extra ?? {});
  const kit = st.kit, look = st.look;
  const flip = st.flip ? -1 : 1;
  const view = st.view;
  const torsoW = Math.max(4, Math.round(H * 0.3));
  const limb = H >= 20 ? 2 : 2;
  const cr = Math.cos(P.rot), sr = Math.sin(P.rot);
  // local (lx right, ly up) -> screen
  const T = (pt, sideOff = 0) => {
    let lx = pt[0] * (view === 'side' ? 1 : 0.35) + sideOff, ly = pt[1];
    const rx = lx * cr - ly * sr, ry = lx * sr + ly * cr;
    return [x + rx * flip, y - ry - P.lift];
  };
  const sideA = view === 'side' ? 0 : -torsoW * 0.22, sideB = view === 'side' ? 0 : torsoW * 0.22;
  const skin = look.skin, shirt = kit.shirt, shorts = kit.shorts, socks = kit.socks;
  const back = (view === 'side');
  // far limbs first (B side in side view)
  const leg = (L, off, shade) => {
    const hip = T(P.hip, off), knee = T(L.knee, off), foot = T(L.foot, off);
    line(g, hip[0], hip[1], knee[0], knee[1], limb + 1, shade ? kit.shortsD : shorts);
    line(g, knee[0], knee[1] - 0, foot[0], foot[1], limb, shade ? kit.socksD : socks);
    g.fillStyle = look.boots; g.fillRect(Math.round(foot[0] - 1 + (view === 'side' ? flip : 0)), Math.round(foot[1] - 1), view === 'side' ? 3 : 2, 2);
  };
  const arm = (A, off, shade) => {
    const shp = T(P.sh, off), el = T(A.elbow, off), hd = T(A.hand, off);
    line(g, shp[0], shp[1] + 1, el[0], el[1], limb, shade ? kit.shirtD : (kit.sleeve ?? shirt));
    line(g, el[0], el[1], hd[0], hd[1], limb, st.gk ? kit.gloves ?? '#ffd84a' : skin);
  };
  if (back) { leg(P.B, 0, true); arm(P.armB, 0, true); }
  else { leg(P.B, sideB, false); leg(P.A, sideA, false); }
  // torso: thick line hip -> shoulder
  const hp = T(P.hip, 0), sp = T(P.sh, 0);
  const tw = view === 'side' ? Math.max(4, torsoW - 2) : torsoW;
  // shorts block
  line(g, hp[0], hp[1] - 1, hp[0] + (sp[0] - hp[0]) * 0.18, hp[1] + (sp[1] - hp[1]) * 0.18, tw, shorts);
  // shirt
  const n = Math.max(1, Math.ceil(Math.hypot(sp[0] - hp[0], sp[1] - hp[1])));
  for (let i = 3; i <= n; i++) {
    const fx = hp[0] + (sp[0] - hp[0]) * i / n, fy = hp[1] + (sp[1] - hp[1]) * i / n;
    for (let j = 0; j < tw; j++) {
      let col = shirt;
      const ox = j - tw / 2;
      if (kit.pattern === 'stripes' && ((j >> 1) & 1)) col = kit.shirt2;
      else if (kit.pattern === 'hoops' && ((i >> 1) & 1)) col = kit.shirt2;
      else if (kit.pattern === 'halves' && j >= tw / 2) col = kit.shirt2;
      else if (kit.pattern === 'sash' && Math.abs(j - i * tw / n) < 1.5) col = kit.shirt2;
      else if (kit.pattern === 'pinstripe' && j % 3 === 1) col = kit.shirt2;
      else if (kit.pattern === 'sleeves' && (j === 0 || j === tw - 1)) col = kit.shirt2;
      g.fillStyle = col;
      // offset across the torso perpendicular to its axis
      const ax = (sp[0] - hp[0]) / n, ay = (sp[1] - hp[1]) / n, al = Math.hypot(ax, ay) || 1;
      g.fillRect(Math.round(fx + (-ay / al) * ox), Math.round(fy + (ax / al) * ox), 1, 1);
    }
  }
  // shirt number on the back
  if (view === 'back' && st.num != null && H >= 18 && P.rot === 0) {
    g.fillStyle = kit.num ?? '#fff';
    const nx = Math.round(sp[0]) - 1, ny = Math.round(sp[1]) + 2;
    g.fillRect(nx, ny, 2, 3);
  }
  if (back) { leg(P.A, 0, false); }
  else { arm(P.armB, sideB + (view === 'side' ? 0 : tw * 0.35), false); arm(P.armA, sideA - (view === 'side' ? 0 : tw * 0.35), false); }
  // head
  const hc = T(P.head, 0);
  const hw = Math.max(3, Math.round(H * 0.19)), hh = Math.max(3, Math.round(H * 0.2));
  const hx = Math.round(hc[0] - hw / 2), hy = Math.round(hc[1] - hh / 2);
  g.fillStyle = skin; g.fillRect(hx, hy, hw, hh);
  // hair
  g.fillStyle = look.hair;
  if (look.style !== 'bald') {
    g.fillRect(hx, hy, hw, 1);
    if (look.style === 'long' || look.style === 'curly') { g.fillRect(hx - (look.style === 'curly' ? 1 : 0), hy - 1, hw + (look.style === 'curly' ? 2 : 0), 2); if (view !== 'front') g.fillRect(hx, hy, hw, Math.ceil(hh * 0.7)); }
    if (look.style === 'bun') g.fillRect(hx + (flip > 0 ? 0 : hw - 2), hy - 2, 2, 2);
    if (view === 'back') g.fillRect(hx, hy, hw, hh - 1);
    else if (view === 'side') g.fillRect(flip > 0 ? hx : hx + hw - 2, hy, 2, hh - 1);
  }
  if (look.beard && view !== 'back') { g.fillStyle = look.hair; g.fillRect(hx, hy + hh - 1, hw, 1); }
  // eyes (front / side)
  if (view === 'front' && hh >= 4) { g.fillStyle = '#1a1a1a'; g.fillRect(hx + 1, hy + 2, 1, 1); g.fillRect(hx + hw - 2, hy + 2, 1, 1); }
  else if (view === 'side' && hh >= 4) { g.fillStyle = '#1a1a1a'; g.fillRect(flip > 0 ? hx + hw - 1 : hx, hy + 2, 1, 1); }
  // near arm in side view last
  if (back) arm(P.armA, 0, false);
  // captain armband
  if (st.captain && P.rot === 0) { const sp2 = T(P.armB.elbow, 0); g.fillStyle = '#ffd84a'; g.fillRect(Math.round(sp2[0]) - 1, Math.round(sp2[1]) - 1, 2, 1); }
  return H;
}

export const darken = (hex, f = 0.25) => {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = ((n >> 16) & 255) * (1 - f), gg = ((n >> 8) & 255) * (1 - f), b = (n & 255) * (1 - f);
  return `rgb(${r | 0},${gg | 0},${b | 0})`;
};

/** Fill derived shades for a kit {shirt, shirt2, shorts, socks, pattern, num}. */
export function prepKit(k) {
  return { ...k, shirtD: darken(k.shirt, 0.3), shortsD: darken(k.shorts, 0.3), socksD: darken(k.socks, 0.3), sleeve: k.sleeve ?? k.shirt };
}

void TAU;
</script>
<script type="text/plain" data-mod="render/broadcast.js">// Draws a match: stadium, goals, players (depth sorted), ball, overlays and the HUD, on a 640x360
// pixel canvas that the page scales up with nearest-neighbor filtering.
import { PITCH, STEP } from '@@engine/pitch.js@@';
import { View, W, H, Y_SQUASH, CAMERAS } from '@@render/view.js@@';
import { buildStadium, shade } from '@@render/stadium.js@@';
import { drawPlayer, lookFor, prepKit } from '@@render/sprites.js@@';
import { text, textWidth } from '@@render/font.js@@';
import { B } from '@@engine/input.js@@';

export const CTL_COLORS = ['#4aa8ff', '#ff5a5a', '#ffd84a', '#5ae07a', '#c27aff', '#ff9a3c'];

const fmtClock = (secs) => { const m = Math.floor(secs / 60), s = Math.floor(secs % 60); return `${m}:${String(s).padStart(2, '0')}`; };

export class Broadcast {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.g = canvas.getContext('2d');
    this.g.imageSmoothingEnabled = false;
    this.view = new View();
    this.opts = opts;
    this.stadium = null;
    this.banners = [];
    this.ph = new Map();       // run cycle phase per player
    this.flash = 0;
    this.netBulge = { side: 0, t: 0 };
    this.appearance = opts.appearance ?? {};
    this.weatherParts = [];
    this.ticker = [];
  }

  setup(m, settings) {
    this.m = m;
    this.settings = settings;
    const cam = CAMERAS[settings.camera] ?? CAMERAS.broadcast;
    this.view.s = cam.s;
    const home = m.teams[0].club, away = m.teams[1].club;
    this.kits = [prepKit(m.teams[0].kit), prepKit(m.teams[1].kit)];
    this.gkKits = [prepKit(m.teams[0].gkKit), prepKit(m.teams[1].gkKit)];
    this.looks = new Map();
    for (const t of m.teams) for (const p of [...t.on, ...t.bench]) this.looks.set(p.id, lookFor(p, this.appearance));
    this.stadium = buildStadium({
      s: this.view.s, home: { primary: home.colors?.[0] ?? '#c00', secondary: home.colors?.[1] ?? '#fff' }, away: { primary: away.colors?.[0] ?? '#00c', secondary: away.colors?.[1] ?? '#fff' },
      night: settings.time === 'night', code: home.code, stadium: (home.stadium ?? 'STADIUM').toUpperCase().slice(0, 14), seed: [...home.code].reduce((a, c) => a * 31 + c.charCodeAt(0), 7), pattern: home.stripes ?? 'straight',
    });
    this.view.follow(0, 0, 0, true);
  }

  // ---------------------------------------------------------------- frame
  render(dt, local = {}) {
    const m = this.m, g = this.g, v = this.view;
    this.consumeFx();
    // camera
    const b = m.ball;
    let fx = b.x, fy = b.y, lead = 0;
    if (m.owner) { lead = m.teams[m.owner.team].dir * 6 * Math.min(1, (m.owner.speed ?? 0) / 6); }
    else if (m.phase === 'live') { lead = b.vx * 0.25; }
    if (m.phase === 'restart' && m.restart?.type === 'corner') { fx = b.x * 0.85; fy = b.y * 0.6; }
    if (m.phase === 'restart' && m.restart?.type === 'penalty') { fx = b.x + Math.sign(b.x) * 5; fy = 0; }
    if (m.phase === 'goal') { const sp = m.byId.get(m.celebrator); if (sp) { fx = sp.x; fy = sp.y; } }
    v.follow(fx, fy, lead);
    const shake = this.flash > 0 ? 0 : 0;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#0b0e14'; g.fillRect(0, 0, W, H);
    const st = this.stadium;
    g.drawImage(st.canvas, Math.round(-st.ox - v.cx + W / 2 + shake), Math.round(-st.oy - v.cy + H / 2));
    // goals (back nets) first
    for (const sx of [-1, 1]) this.drawGoal(sx, 'back');
    // shadows
    const ents = [];
    for (const p of m.players) if (p.onPitch || p.act?.type === 'down') ents.push({ y: p.y, p });
    ents.push({ y: b.y + 0.01, ball: true });
    for (const e of ents) {
      const x = e.ball ? b.x : e.p.x, y = e.ball ? b.y : e.p.y;
      const s = v.screen(x, y, 0);
      g.fillStyle = 'rgba(0,0,0,0.28)';
      if (e.ball) { const r = Math.max(1, 2 - b.z * 0.08); g.fillRect(s.x - r, s.y - 1, r * 2, 2); }
      else g.fillRect(s.x - 4, s.y - 1, 9, 2);
    }
    ents.sort((a, c) => a.y - c.y);
    for (const e of ents) { if (e.ball) this.drawBall(); else this.drawPlayerEnt(e.p, dt); }
    for (const sx of [-1, 1]) this.drawGoal(sx, 'front');
    this.drawOfficials();
    this.drawWeather(dt);
    if (this.replayTag) {
      // replay: letterbox bars and a blinking tag instead of the live overlays
      g.fillStyle = '#000'; g.fillRect(0, 0, W, 16); g.fillRect(0, H - 16, W, 16);
      if ((this.m.tick + Math.floor(performance.now() / 400)) % 2) text(g, 'REPLAY', W - 10, 4, { color: '#ffd84a', align: 'right' });
      text(g, 'SPACE TO SKIP', 10, H - 12, { font: 'tiny', color: '#9aa8bc' });
      return;
    }
    this.drawOverlays(local);
    this.drawHud(local);
    if (this.flash > 0) { g.fillStyle = `rgba(255,255,255,${this.flash * 0.5})`; g.fillRect(0, 0, W, H); this.flash = Math.max(0, this.flash - dt * 3); }
  }

  drawGoal(sx, part) {
    const g = this.g, v = this.view;
    const gx = sx * PITCH.HALF_L, gy = PITCH.GOAL_HALF_W, gh = PITCH.GOAL_H, gd = sx * PITCH.GOAL_DEPTH;
    const P = (x, y, z) => v.screen(x, y, z);
    const seg = (a, c, col, t = 1) => {
      g.fillStyle = col;
      const n = Math.max(1, Math.ceil(Math.hypot(c.x - a.x, c.y - a.y)));
      for (let i = 0; i <= n; i++) g.fillRect(Math.round(a.x + (c.x - a.x) * i / n), Math.round(a.y + (c.y - a.y) * i / n), t, t);
    };
    const bul = this.netBulge.side === sx && this.netBulge.t > 0 ? this.netBulge.t : 0;
    if (part === 'back') {
      const netCol = 'rgba(235,240,245,0.45)';
      // back plane
      for (let i = 0; i <= 12; i++) {
        const y = -gy + (2 * gy) * i / 12;
        const bz = (Math.abs(y - (this.m.ball.y)) < 1.2 && bul) ? 0.4 * bul : 0;
        seg(P(gx + gd + sx * bz, y, 0), P(gx + gd + sx * bz, y, gh * 0.85), netCol);
      }
      for (let j = 0; j <= 5; j++) { const z = gh * 0.85 * j / 5; seg(P(gx + gd, -gy, z), P(gx + gd, gy, z), netCol); }
      // roof and sides
      for (let i = 0; i <= 4; i++) { const x = gx + gd * i / 4; seg(P(x, -gy, gh - (gh * 0.15) * i / 4), P(x, gy, gh - (gh * 0.15) * i / 4), netCol); seg(P(x, -gy, 0), P(x, -gy, gh - 0.15 * gh * i / 4), netCol); }
      seg(P(gx, -gy, gh), P(gx + gd, -gy, gh * 0.85), '#cfd6dc');
      seg(P(gx, -gy, 0), P(gx + gd, -gy, 0), '#cfd6dc');
      seg(P(gx + gd, -gy, 0), P(gx + gd, -gy, gh * 0.85), '#cfd6dc');
      // far post (behind players on the near side)
      seg(P(gx, -gy, 0), P(gx, -gy, gh), '#ffffff', 2);
    } else {
      const netCol = 'rgba(235,240,245,0.35)';
      for (let i = 0; i <= 4; i++) { const x = gx + gd * i / 4; seg(P(x, gy, 0), P(x, gy, gh - 0.15 * gh * i / 4), netCol); }
      seg(P(gx, gy, gh), P(gx + gd, gy, gh * 0.85), '#cfd6dc');
      seg(P(gx, gy, 0), P(gx + gd, gy, 0), '#cfd6dc');
      seg(P(gx + gd, gy, 0), P(gx + gd, gy, gh * 0.85), '#cfd6dc');
      seg(P(gx, gy, 0), P(gx, gy, gh), '#ffffff', 2);
      seg(P(gx, -gy, gh), P(gx, gy, gh), '#ffffff', 2);
      // corner flags
      for (const sy of [-1, 1]) { const a = P(gx, sy * PITCH.HALF_W, 0), c = P(gx, sy * PITCH.HALF_W, 1.5); seg(a, c, '#e8e8e8'); g.fillStyle = '#ffd84a'; g.fillRect(c.x + (sx > 0 ? -4 : 0), c.y, 4, 3); }
    }
  }

  drawBall() {
    const g = this.g, b = this.m.ball;
    const s = this.view.screen(b.x, b.y, b.z + 0.11);
    const r = this.view.s >= 12 ? 2 : 1;
    g.fillStyle = this.settings.weather === 'snow' ? '#ff8a2a' : '#ffffff';
    g.fillRect(s.x - r, s.y - r, r * 2, r * 2);
    g.fillStyle = '#20242c';
    const spin = (this.m.tick >> 2) & 3;
    g.fillRect(s.x - r + (spin & 1), s.y - r + (spin >> 1), 1, 1);
    if (r > 1) { g.fillStyle = '#c8ccd4'; g.fillRect(s.x - r, s.y + r - 1, r * 2, 1); }
  }

  drawPlayerEnt(p, dt) {
    const m = this.m, g = this.g, v = this.view;
    const s = v.screen(p.x, p.y, 0);
    if (s.x < -30 || s.x > W + 30 || s.y < -40 || s.y > H + 40) return;
    const scale = v.s * s.k;
    const t = m.teams[p.team];
    let ph = this.ph.get(p.id) ?? 0;
    const spd = p.speed ?? Math.hypot(p.vx, p.vy);
    ph += spd * dt * 2.3;
    this.ph.set(p.id, ph);
    let kind = 'stand', extra = {}, phase = ph;
    const act = p.act;
    let face = p.face;
    if (act) {
      if (act.type === 'kick') { kind = 'kick'; phase = Math.min(0.6, act.t / Math.max(1, act.wind) * 0.6); }
      else if (act.type === 'follow') { kind = 'kick'; phase = 0.6 + act.t / act.dur * 0.4; }
      else if (act.type === 'slide') { kind = 'slide'; face = act.ang; }
      else if (act.type === 'dive') { kind = 'dive'; const sideScreen = Math.sign(act.y - p.y) || 1; face = 0; extra = { dir: -sideScreen, lift: Math.min(8, act.t * 0.8) * (act.z > 1 ? 1.6 : 0.6) }; }
      else if (act.type === 'down') { kind = 'down'; extra = { dir: Math.cos(p.face) > 0 ? -1 : 1 }; }
      else if (act.type === 'celebrate') { kind = spd > 1.5 ? 'run' : 'celebrate'; extra = { style: act.style, amp: 0.8 }; phase = spd > 1.5 ? ph : m.tick * 0.2; }
      else if (act.type === 'header') { kind = 'header'; extra = { jump: Math.sin(Math.min(1, act.t / act.dur) * Math.PI) * 6 }; }
      else if (act.type === 'tackle') kind = 'tackle';
      else if (act.type === 'stumble') { kind = 'run'; extra = { amp: 0.3 }; }
    } else if (p.skill) { kind = 'kick'; phase = 0.2 + 0.25 * Math.abs(Math.sin(p.skill.t * 0.35)); }
    else if (m.owner === p && p.pos === 'GK' && p.holding) kind = 'hold';
    else if (m.phase === 'restart' && m.restart?.type === 'throw' && m.restart.taker === p.id && m.restart.ready) { kind = 'throw'; phase = 0; }
    else if (p.jockey) kind = 'jockey';
    else if (spd > 0.4) { kind = 'run'; extra = { amp: Math.min(1, 0.35 + spd / 9) }; }
    else if (p.pos === 'GK' && m.phase === 'live' && Math.abs(m.ball.x - p.x) < 30) kind = 'gk_ready';
    const cf = Math.cos(face), sf = Math.sin(face);
    const view = kind === 'dive' || kind === 'down' || kind === 'slide' ? 'side' : Math.abs(cf) >= 0.42 ? 'side' : sf > 0 ? 'front' : 'back';
    const flip = kind === 'dive' ? false : cf < 0;
    const gk = p.pos === 'GK';
    const kit = gk ? this.gkKits[p.team] : this.kits[p.team];
    const Hpx = drawPlayer(g, s.x, s.y, scale, { kind, ph: phase, extra, view, flip, kit, look: this.looks.get(p.id), h: p.h, gk, num: p.num, captain: p.id === t.captain });
    p._sx = s.x; p._sy = s.y - Hpx;
  }

  drawOfficials() {
    // the referee trails play; assistants on the touchlines
    const m = this.m, g = this.g, v = this.view;
    const b = m.ball;
    if (!this.ref) this.ref = { x: -8, y: -6, ph: 0 };
    const r = this.ref;
    const tx = b.x - 8 * Math.sign(b.x || 1), ty = b.y * 0.6 - 7;
    r.x += (tx - r.x) * 0.02; r.y += (ty - r.y) * 0.02;
    const sp = Math.hypot(tx - r.x, ty - r.y) * 0.3;
    r.ph += sp * 0.05;
    const kit = { shirt: '#111318', shorts: '#111318', socks: '#111318', shirtD: '#000', shortsD: '#000', socksD: '#000', pattern: 'plain' };
    const draw = (x, y, ph, flagUp) => {
      const s = v.screen(x, y, 0);
      if (s.x < -20 || s.x > W + 20) return;
      drawPlayer(g, s.x, s.y, v.s * s.k, { kind: sp > 0.2 ? 'run' : 'stand', ph, view: 'side', flip: b.x < x, kit, look: { skin: '#e0ac85', hair: '#333', style: 'short', boots: '#111' }, h: 1.78 });
      if (flagUp) { g.fillStyle = '#ffd84a'; g.fillRect(s.x + 2, s.y - 24, 4, 3); g.fillStyle = '#ccc'; g.fillRect(s.x + 2, s.y - 24, 1, 8); }
    };
    draw(r.x, r.y, r.ph);
    // assistants: far side follows the second-last defender of the right half, near side the left half
    const flagT = this.offsideFlag && m.tick - this.offsideFlag < 120;
    const lineR = this.lastLine(0), lineL = this.lastLine(1);
    draw(Math.max(0, lineR), -PITCH.HALF_W - 0.8, m.tick * 0.05, flagT && this.offsideSide > 0);
    draw(Math.min(0, lineL), PITCH.HALF_W + 0.8, m.tick * 0.05, flagT && this.offsideSide < 0);
  }

  lastLine(which) {
    const m = this.m;
    const side = which === 0 ? 1 : -1;
    const t = m.teams.find((tt) => tt.dir === -side) ?? m.teams[0];
    const xs = t.on.filter((p) => p.onPitch).map((p) => p.x * side).sort((a, b) => b - a);
    return (xs[1] ?? 0) * side;
  }

  drawWeather(dt) {
    const g = this.g, w = this.settings.weather;
    if (this.settings.time === 'night') { g.fillStyle = 'rgba(10,20,50,0.12)'; g.fillRect(0, 0, W, H); }
    else if (this.settings.time === 'evening') { g.fillStyle = 'rgba(255,140,60,0.05)'; g.fillRect(0, 0, W, H); }
    if (w === 'cloudy') { g.fillStyle = 'rgba(40,50,60,0.12)'; g.fillRect(0, 0, W, H); }
    if (w !== 'rain' && w !== 'snow') return;
    if (!this.weatherParts.length) for (let i = 0; i < 160; i++) this.weatherParts.push({ x: (i * 97) % W, y: (i * 53) % H, s: 0.6 + ((i * 7) % 10) / 10 });
    g.fillStyle = w === 'rain' ? 'rgba(200,220,255,0.55)' : 'rgba(255,255,255,0.85)';
    for (const p of this.weatherParts) {
      p.y += (w === 'rain' ? 420 : 40) * p.s * dt; p.x += (w === 'rain' ? -60 : Math.sin(p.y * 0.05) * 20) * dt;
      if (p.y > H) { p.y -= H; p.x = (p.x + 211) % W; }
      if (p.x < 0) p.x += W;
      if (w === 'rain') g.fillRect(Math.round(p.x), Math.round(p.y), 1, 3); else g.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
    }
    if (w === 'rain') { g.fillStyle = 'rgba(20,30,45,0.14)'; g.fillRect(0, 0, W, H); }
  }

  // ---------------------------------------------------------------- overlays
  drawOverlays(local) {
    const m = this.m, g = this.g, v = this.view;
    const names = this.settings.names ?? 'controlled';
    for (const c of m.ctls) {
      const p = m.ctlPlayer(c);
      if (!p || !p.onPitch || p._sx == null) continue;
      const i = local.colorOf ? local.colorOf(c.key) : m.ctls.indexOf(c);
      const col = CTL_COLORS[i % CTL_COLORS.length];
      const x = p._sx, y = p._sy - 4;
      g.fillStyle = '#000'; g.fillRect(x - 3, y - 4, 7, 4);
      g.fillStyle = col; g.fillRect(x - 2, y - 4, 5, 2); g.fillRect(x - 1, y - 2, 3, 1); g.fillRect(x, y - 1, 1, 1);
      if (names !== 'off' && local.mine?.includes(c.key)) {
        const s = v.screen(p.x, p.y, 0);
        text(g, p.short, s.x, s.y + 3, { font: 'tiny', color: '#fff', align: 'center', shadow: '#000' });
        // stamina bar
        g.fillStyle = '#000'; g.fillRect(s.x - 8, s.y + 10, 16, 2);
        g.fillStyle = p.stamina > 0.6 ? '#5ae07a' : p.stamina > 0.35 ? '#ffd84a' : '#ff5a5a'; g.fillRect(s.x - 8, s.y + 10, Math.round(16 * p.stamina), 2);
      }
      // power bar
      if (c.hold && local.mine?.includes(c.key)) {
        const max = c.hold.btn === B.SHOOT ? 66 : 60;
        const f = Math.min(1, c.hold.t / max);
        const bx = x - 12, by = y - 12;
        g.fillStyle = '#000'; g.fillRect(bx - 1, by - 1, 26, 5);
        g.fillStyle = '#2a2f3a'; g.fillRect(bx, by, 24, 3);
        g.fillStyle = c.hold.btn === B.SHOOT ? (f > 0.85 ? '#ff5a3c' : '#ffd84a') : '#5ad1ff';
        g.fillRect(bx, by, Math.round(24 * f), 3);
      }
      // timed finish ring around the ball
      if (c.timed && !c.timed.done && local.mine?.includes(c.key)) {
        const tt = m.tick - c.timed.start, w = c.timed.wind;
        const rr = Math.max(2, 3 + (w - tt) * 0.7);
        const bs = v.screen(m.ball.x, m.ball.y, m.ball.z + 0.11);
        const gw = m.greenWindow(c, p);
        const col = Math.abs(tt - w) <= gw ? '#5ae07a' : '#ffffff';
        ring(g, bs.x, bs.y, rr, col);
      }
    }
    // next-switch hint for the local defender
    // aim marker for set pieces
    const r = m.restart;
    if (m.phase === 'restart' && r && r.type === 'penalty' && r.ready) {
      const att = m.teams[r.team];
      if (local.mine?.some((k) => m.ctlByKey[k]?.team === r.team)) {
        const s = v.screen(att.dir * PITCH.HALF_L, r.aimY ?? 0, r.aimZ ?? 0.5);
        g.fillStyle = '#ffd84a'; g.fillRect(s.x - 2, s.y, 5, 1); g.fillRect(s.x, s.y - 2, 1, 5);
      }
    }
    if (m.phase === 'restart' && r && r.type === 'freekick' && r.ready && r.curl) {
      const s = v.screen(r.x, r.y, 0);
      text(g, `CURL ${r.curl > 0 ? '>' : '<'} ${Math.abs(r.curl).toFixed(1)}`, s.x, s.y + 6, { font: 'tiny', color: '#ffd84a', align: 'center', shadow: '#000' });
    }
  }

  // ---------------------------------------------------------------- HUD
  drawHud(local) {
    const m = this.m, g = this.g;
    const [h, a] = m.teams;
    // score bug
    const x0 = 8, y0 = 8;
    g.fillStyle = 'rgba(8,10,16,0.88)'; g.fillRect(x0, y0, 150, 15);
    const tab = (x, t) => { g.fillStyle = t.kit.shirt; g.fillRect(x, y0 + 2, 3, 11); text(g, t.club.code, x + 6, y0 + 4, { color: '#fff' }); };
    tab(x0 + 3, h);
    text(g, `${h.score} - ${a.score}`, x0 + 52, y0 + 4, { color: '#ffd84a' });
    tab(x0 + 76, a);
    g.fillStyle = '#e8ecf1'; g.fillRect(x0 + 110, y0, 40, 15);
    let clock = Math.min(m.clock(), [0, 2700, 5400, 6300, 7200][m.period]);
    text(g, fmtClock(clock), x0 + 130, y0 + 4, { color: '#111', align: 'center' });
    const over = m.time - m.periodLen();
    if (m.added && m.time >= m.periodLen() - 1) {
      g.fillStyle = '#5ae07a'; g.fillRect(x0 + 150, y0, 22, 15);
      text(g, `+${Math.round(m.added / 60)}`, x0 + 161, y0 + 4, { color: '#111', align: 'center' });
      void over;
    }
    // red cards
    for (const [i, t] of m.teams.entries()) { let k = 0; for (const p of t.off) if (p.red) { g.fillStyle = '#ff3a3a'; g.fillRect(x0 + (i ? 104 : 36) + k * 4, y0 + 2, 3, 4); k++; } }
    if (m.shootout) {
      const so = m.shootout;
      g.fillStyle = 'rgba(8,10,16,0.88)'; g.fillRect(x0, y0 + 17, 150, 22);
      for (const ti of [0, 1]) {
        text(g, m.teams[ti].club.code, x0 + 4, y0 + 20 + ti * 9, { font: 'tiny', color: '#fff' });
        for (let i = 0; i < Math.max(5, so.kicks[ti].length); i++) {
          const k = so.kicks[ti][i];
          g.fillStyle = k === 1 ? '#5ae07a' : k === 0 ? '#ff5a5a' : '#3a4252';
          g.fillRect(x0 + 24 + i * 7, y0 + 20 + ti * 9, 5, 5);
        }
      }
    }
    // mentality
    if (local.team != null) {
      const t = m.teams[local.team];
      const label = ['ULTRA DEF', 'DEFENSIVE', 'BALANCED', 'ATTACKING', 'ULTRA ATT'][t.mentality];
      if (this.mentalityShow && m.tick - this.mentalityShow < 120) text(g, label, W - 8, 10, { color: '#ffd84a', align: 'right', shadow: '#000' });
      const q = Object.entries(t.quick).filter(([, v2]) => v2).map(([k]) => k.toUpperCase());
      if (q.length) text(g, q.join(' '), W - 8, 20, { font: 'tiny', color: '#9fe8ff', align: 'right', shadow: '#000' });
    }
    // radar
    if ((this.settings.radar ?? 'on') !== 'off') this.drawRadar();
    // commentary ticker
    const tk = this.ticker.at(-1);
    if (tk && m.tick - tk.tick < 300 && (this.settings.commentary ?? true)) {
      const w = Math.min(W - 20, textWidth(tk.text, 'tiny') + 12);
      g.fillStyle = 'rgba(8,10,16,0.75)'; g.fillRect(x0, y0 + 17 + (m.shootout ? 24 : 0), w, 9);
      text(g, tk.text, x0 + 6, y0 + 19 + (m.shootout ? 24 : 0), { font: 'tiny', color: '#dfe6ee' });
    }
    // banners
    this.banners = this.banners.filter((bn) => bn.t > 0);
    for (const bn of this.banners) {
      bn.t -= 1 / 60;
      const yy = bn.y ?? 250;
      const w = Math.max(textWidth(bn.title, 'big', 2), textWidth(bn.sub ?? '', 'big')) + 30;
      const slide = Math.min(1, (bn.max - bn.t) * 5);
      const xx = Math.round(W / 2 - w / 2 - (1 - slide) * 40);
      g.fillStyle = 'rgba(8,10,16,0.9)'; g.fillRect(xx, yy, w, bn.sub ? 34 : 22);
      g.fillStyle = bn.color ?? '#ffd84a'; g.fillRect(xx, yy, 4, bn.sub ? 34 : 22);
      text(g, bn.title, W / 2, yy + 4, { scale: 2, color: bn.color ?? '#ffd84a', align: 'center' });
      if (bn.sub) text(g, bn.sub, W / 2, yy + 23, { color: '#fff', align: 'center' });
    }
    // phase cards
    if (m.phase === 'restart' && m.restart && m.restart.ready && m.restart.type !== 'kickoff') {
      const label = { freekick: m.restart.indirect ? 'INDIRECT FREE KICK' : 'FREE KICK', corner: 'CORNER', throw: 'THROW-IN', goalkick: 'GOAL KICK', penalty: m.restart.shootout ? 'PENALTY SHOOTOUT' : 'PENALTY' }[m.restart.type];
      if (label) { const w = textWidth(label, 'tiny') + 10; g.fillStyle = 'rgba(8,10,16,0.8)'; g.fillRect(W - w - 8, H - 18, w, 10); text(g, label, W - 13, H - 16, { font: 'tiny', color: '#ffd84a', align: 'right' }); }
    }
  }

  drawRadar() {
    const m = this.m, g = this.g;
    const rw = 104, rh = 66, x0 = Math.round(W / 2 - rw / 2), y0 = H - rh - 6;
    g.fillStyle = this.settings.radar === 'transparent' ? 'rgba(20,60,30,0.35)' : 'rgba(14,40,22,0.8)';
    g.fillRect(x0, y0, rw, rh);
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(x0, y0, rw, 1); g.fillRect(x0, y0 + rh - 1, rw, 1); g.fillRect(x0, y0, 1, rh); g.fillRect(x0 + rw - 1, y0, 1, rh); g.fillRect(x0 + rw / 2, y0, 1, rh);
    g.fillRect(x0, y0 + rh / 2 - 10, 16, 1); g.fillRect(x0, y0 + rh / 2 + 10, 16, 1); g.fillRect(x0 + 16, y0 + rh / 2 - 10, 1, 21);
    g.fillRect(x0 + rw - 17, y0 + rh / 2 - 10, 16, 1); g.fillRect(x0 + rw - 17, y0 + rh / 2 + 10, 16, 1); g.fillRect(x0 + rw - 17, y0 + rh / 2 - 10, 1, 21);
    const P = (x, y) => [Math.round(x0 + (x / PITCH.L + 0.5) * (rw - 2) + 1), Math.round(y0 + (y / PITCH.W + 0.5) * (rh - 2) + 1)];
    for (const p of m.players) {
      if (!p.onPitch) continue;
      const [x, y] = P(p.x, p.y);
      g.fillStyle = '#000'; g.fillRect(x - 1, y - 1, 3, 3);
      g.fillStyle = p.ctl ? CTL_COLORS[m.ctls.findIndex((c) => c.key === p.ctl) % 6] : m.teams[p.team].kit.radar ?? m.teams[p.team].kit.shirt;
      g.fillRect(x - 1, y - 1, p.ctl ? 3 : 2, p.ctl ? 3 : 2);
    }
    const [bx, by] = P(m.ball.x, m.ball.y);
    g.fillStyle = '#fff'; g.fillRect(bx, by, 2, 2);
  }

  // ---------------------------------------------------------------- presentation cues
  consumeFx() {
    const m = this.m;
    for (const f of m.fx.splice(0)) {
      this.onCue?.(f);
      switch (f.type) {
        case 'goal': {
          const p = m.byId.get(f.pid);
          const t = m.teams[f.team];
          this.banners.push({ title: 'GOAL!', sub: `${p ? p.name.toUpperCase() : ''}${f.own ? ' (OG)' : ''} ${Math.ceil(m.clock() / 60)}'`, t: 3.5, max: 3.5, color: t.kit.shirt === '#ffffff' ? '#ffd84a' : shade(t.kit.shirt, 0.3), y: 120 });
          this.flash = 0.6;
          this.netBulge = { side: Math.sign(m.ball.x), t: 1 };
          break;
        }
        case 'card': { const p = m.byId.get(f.pid); this.banners.push({ title: f.red ? 'RED CARD' : 'YELLOW CARD', sub: p?.name.toUpperCase(), t: 2.5, max: 2.5, color: f.red ? '#ff3a3a' : '#ffd84a' }); break; }
        case 'offside': { this.banners.push({ title: 'OFFSIDE', t: 1.8, max: 1.8, color: '#ffd84a' }); this.offsideFlag = m.tick; const p = m.byId.get(f.pid); this.offsideSide = p ? Math.sign(p.x) : 1; break; }
        case 'sub': { const off = m.byId.get(f.off), on = m.byId.get(f.on); this.banners.push({ title: 'SUBSTITUTION', sub: `${on?.short.toUpperCase()} ON  ${off?.short.toUpperCase()} OFF`, t: 2.2, max: 2.2, color: '#5ae07a', y: 290 }); break; }
        case 'added': this.banners.push({ title: `+${f.mins}`, sub: 'ADDED TIME', t: 2.2, max: 2.2, color: '#5ae07a', y: 60 }); break;
        case 'injury': { const p = m.byId.get(f.pid); if (f.sev !== 'minor') this.banners.push({ title: 'INJURY', sub: p?.name.toUpperCase(), t: 2, max: 2, color: '#ff9a3c' }); break; }
        case 'advantage': this.banners.push({ title: 'ADVANTAGE', t: 1.4, max: 1.4, color: '#9fe8ff', y: 60 }); break;
        case 'timed': this.banners.push({ title: { perfect: 'PERFECT', good: 'GOOD', poor: 'EARLY/LATE', bad: 'MISTIMED' }[f.grade], t: 1, max: 1, color: { perfect: '#5ae07a', good: '#ffd84a', poor: '#ff9a3c', bad: '#ff5a5a' }[f.grade], y: 70 }); break;
        case 'skill': { const p = m.byId.get(f.pid); if (p?.ctl) this.banners.push({ title: f.label.toUpperCase(), t: 0.9, max: 0.9, color: '#9fe8ff', y: 300 }); break; }
        case 'commentary': this.ticker.push({ text: f.text, tick: m.tick }); if (this.ticker.length > 30) this.ticker.shift(); break;
      }
    }
    if (this.netBulge.t > 0) this.netBulge.t = Math.max(0, this.netBulge.t - STEP * 1.5);
  }
}

function ring(g, cx, cy, r, col) {
  g.fillStyle = col;
  const n = Math.max(8, Math.round(r * 6));
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; g.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r * 0.6), 1, 1); }
}

void Y_SQUASH;
</script>
<script type="text/plain" data-mod="render/audio.js">// Procedural sound (Web Audio, no files): kicks, touches, post, net, keeper catch, whistles,
// a crowd bed that swells with danger, roars on goals, groans on misses, and simple home chants.
export class Sound {
  constructor(settings) {
    this.settings = settings; this.ctx = null; this.last = {};
    const arm = () => this.init();
    window.addEventListener('keydown', arm, { once: true });
    window.addEventListener('pointerdown', arm, { once: true });
  }

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.connect(c.destination);
      const buf = this.noise = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
      let b0 = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b0 = 0.985 * b0 + 0.15 * w; d[i] = b0 * 2.2 + w * 0.08; }
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 0.45;
      this.crowdGain = c.createGain(); this.crowdGain.gain.value = 0;
      src.connect(bp); bp.connect(this.crowdGain); this.crowdGain.connect(this.master); src.start();
      this.apply();
    } catch { this.ctx = null; }
  }

  apply() { if (this.ctx) this.master.gain.value = this.settings.audio ? this.settings.volume : 0; }

  crowd(level, active) {
    if (!this.ctx) return;
    const g = active && this.settings.crowd ? 0.06 + 0.32 * level : 0;
    this.crowdGain.gain.setTargetAtTime(g, this.ctx.currentTime, 0.35);
  }

  tone(type, f0, f1, dur, gain, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  }

  burst(filter, freq, q, dur, gain, delay = 0, attack = 0.015) {
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const f = c.createBiquadFilter(); f.type = filter; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  whistle(n = 1, long = false) {
    for (let i = 0; i < n; i++) {
      const d = long ? 0.7 : 0.28, at = i * (long ? 0.85 : 0.35);
      this.tone('square', 2350, 2300, d, 0.07, at); this.tone('square', 2110, 2090, d, 0.05, at);
    }
  }

  chant() {
    // clap-clap-clap rhythm under a low "oh" vowel
    for (let i = 0; i < 3; i++) this.burst('bandpass', 1800, 1.5, 0.08, 0.25, i * 0.25);
    this.tone('sawtooth', 196, 196, 0.9, 0.04, 0.8); this.tone('sawtooth', 247, 247, 0.9, 0.03, 0.8);
  }

  play(type, data = {}) {
    if (!this.ctx || !this.settings.audio) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const now = this.ctx.currentTime, min = { touch: 0.12, bounce: 0.09, whistle: 0.3 }[type] ?? 0.04;
    if (now - (this.last[type] ?? -9) < min) return;
    this.last[type] = now;
    switch (type) {
      case 'kick': { const p = Math.min(1, data.power ?? 0.5); this.tone('sine', 140 + p * 60, 50, 0.08, 0.35 + p * 0.4); this.burst('lowpass', 900 + p * 900, 0.8, 0.05, 0.2 + p * 0.3); break; }
      case 'touch': this.tone('sine', 120, 70, 0.05, 0.12); break;
      case 'bounce': this.tone('sine', 100, 50, 0.07, 0.18); break;
      case 'header': this.tone('sine', 220, 90, 0.07, 0.3); break;
      case 'post': this.tone('triangle', 620, 560, 0.5, 0.35); this.tone('square', 930, 900, 0.25, 0.08); break;
      case 'net': this.burst('highpass', 2600, 0.6, 0.35, 0.35); break;
      case 'catch': this.tone('sine', 170, 90, 0.07, 0.35); this.burst('lowpass', 500, 0.8, 0.06, 0.25); break;
      case 'save': this.burst('lowpass', 700, 0.8, 0.1, 0.4); break;
      case 'tackle': this.burst('lowpass', 420, 0.8, 0.12, 0.45); break;
      case 'slide': this.burst('bandpass', 900, 0.5, 0.35, 0.25); break;
      case 'block': this.burst('lowpass', 500, 0.8, 0.12, 0.5); break;
      case 'whistle': this.whistle(data.triple ? 3 : 1, data.long); break;
      case 'goal': this.burst('bandpass', 900, 0.35, 3.5, 0.9, 0, 0.2); this.burst('highpass', 2400, 0.4, 2.5, 0.3, 0.1, 0.3); break;
      case 'groan': this.burst('bandpass', 380, 0.6, 1.4, 0.45, 0, 0.1); break;
      case 'boo': this.tone('sawtooth', 160, 120, 1.2, 0.07); this.burst('bandpass', 300, 0.7, 1.2, 0.3); break;
      case 'cheer': this.burst('bandpass', 1100, 0.4, 1.4, 0.5, 0, 0.1); break;
      case 'chant': this.chant(); break;
      case 'green': this.tone('sine', 880, 1760, 0.12, 0.35); this.tone('triangle', 1320, 2640, 0.08, 0.2, 0.03); break;
      case 'menu': this.tone('square', 660, 660, 0.05, 0.05); break;
      case 'sub': this.tone('sine', 660, 880, 0.12, 0.12); break;
    }
  }
}
</script>
<script type="text/plain" data-mod="input/keys.js">// Keyboard and gamepad -> abstract input frames { mx, my, b, sx, sy } (see engine/input.js).
// Presets: Classic (genre-standard), Mini2K-style, and split keyboard for two local players.
import { B } from '@@engine/input.js@@';

export const PRESETS = {
  classic: {
    label: 'Classic',
    move: { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'] },
    stick: { up: ['KeyI', 'Numpad8'], down: ['KeyK', 'Numpad2'], left: ['KeyJ', 'Numpad4'], right: ['KeyL', 'Numpad6'] },
    bits: {
      [B.PASS]: ['KeyS'], [B.LOB]: ['KeyA'], [B.THRU]: ['KeyW'], [B.SHOOT]: ['KeyD'],
      [B.SPRINT]: ['KeyE'], [B.FIN]: ['ShiftLeft', 'ShiftRight'], [B.MOD]: ['KeyQ'], [B.PWR]: ['KeyX'],
      [B.JOCK]: ['KeyC'], [B.KEEPER]: ['KeyG'], [B.CALL]: ['KeyF'], [B.QUICK]: ['KeyZ'],
    },
    rows: [
      ['Move', 'Arrows'], ['Sprint', 'E'], ['Short pass / contain', 'S'], ['Lob, cross / slide tackle', 'A'], ['Through ball / keeper rush', 'W'],

  frame(presetName) {

    const mx = (this.any(P.move.right) ? 1 : 0) - (this.any(P.move.left) ? 1 : 0);
    const my = (this.any(P.move.down) ? 1 : 0) - (this.any(P.move.up) ? 1 : 0);
    const sx = (this.any(P.stick.right) ? 1 : 0) - (this.any(P.stick.left) ? 1 : 0);
    const sy = (this.any(P.stick.down) ? 1 : 0) - (this.any(P.stick.up) ? 1 : 0);

  takeTaps() { const t = this.taps; this.taps = []; return t; }
}

/** Standard Gamepad API mapping. */
export function padFrame(pad) {
  if (!pad) return null;
  const ax = (i) => (Math.abs(pad.axes[i] ?? 0) > 0.35 ? Math.sign(pad.axes[i]) : 0);
  const bt = (i) => !!pad.buttons[i]?.pressed;
  let mx = ax(0), my = ax(1);

}

export function pads() {
  if (typeof navigator === 'undefined' || !navigator.getGamepads) return [];
  return [...navigator.getGamepads()].filter(Boolean);
}

<script type="text/plain" data-mod="ui/pixelfont.js">// Turns the game's bitmap fonts (src/render/font.js) into real web fonts at load time, so the HTML
