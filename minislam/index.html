    s.swing = { kind: 'serve', phase: 'forward', t: 0, dur: TUNE.forwardSwing, band, grade, stroke: 'serve', fh: true, fill: meterFill(hold, this.chargeFull) };
    this.pendingServe = { hold, grade, err, lr, band, at: this.t + TUNE.forwardSwing, underarm: this.toss.underarm };
    this.phase = 'rally';
    this.phaseT = 0;
    this.point.serving = true;
  }

  doServeContact() {
    const ps = this.pendingServe;
    this.pendingServe = null;
    const s = this.players[this.server];
    const contact = { x: this.ball.x, y: this.ball.y, z: clamp(this.ball.z, 2.0, 3.1) * (s.data.look.height / 1.85) };
    if (ps.underarm) contact.z = 0.8;
    this.ball.held = false;
    this.ball.x = contact.x; this.ball.y = contact.y; this.ball.z = contact.z;
    if (ps.grade === 'miss') {
      // mis-hit: frame the ball
      this.ball.vx = (this.rng.next() - 0.5) * 6; this.ball.vy = -s.end * 6; this.ball.vz = 2;
      this.ball.spin = 0; this.ball.live = false;
      this.logEv({ type: 'serve', p: s.idx, no: this.serveNo, band: ps.band, grade: 'miss', kmh: 0, lr: ps.lr });
      this.emit({ type: 'hit', p: s.idx, band: ps.band, grade: 'miss', serve: true, frame: true });
      this.serveFault(s, 'MIS-HIT');
      return;
    }
    const res = resolveServe({ hold: ps.hold, chargeFull: this.chargeFull, timingErr: ps.err, grade: ps.grade, lr: ps.lr,
      contact, serverEnd: s.end, courtSide: this.courtSide, ratings: s.r, rng: this.rng, underarm: ps.underarm });
    const b = this.ball;
    b.vx = res.vx; b.vy = res.vy; b.vz = res.vz; b.spin = res.spin;
    b.bounces = 0; b.lastHitter = s.idx; b.live = true; b.inNet = false; b.t = 0;
    this.lastServeKmh = res.speedKmh;
    this.point.serveRes = res;
    this.point.serveInPlay = false;
    this.point.netCordThisFlight = false;
    this.point.shots = 1;
    this.point.lastHit = { p: s.idx, t: this.t, band: res.band, grade: ps.grade, serve: true, forced: false };
    this.point.serveLabel = res.aim.label;
    this.path = predictPath(b, this.surface, 4, 2); this.pathT0 = this.t;
    this.logEv({ type: 'serve', p: s.idx, no: this.serveNo, band: res.band, grade: ps.grade, kmh: Math.round(res.speedKmh), lr: ps.lr, label: res.aim.label });
    this.emit({ type: 'hit', p: s.idx, band: res.band, grade: ps.grade, serve: true, kmh: res.speedKmh });
    if (this.practice === 'serve') this.practiceStats.serves++;
    s.planted = TUNE.followThrough[res.band] + 0.05;
  }

  serveFault(s, why) {
    this.logEv({ type: 'fault', p: s.idx, no: this.serveNo, why });
    if (this.practice === 'serve') {
      this.emit({ type: 'call', text: why === 'NET' ? 'NET' : 'FAULT' });
      this.endPracticeRep(); return;
    }
    if (this.serveNo === 1) {
      this.serveNo = 2;
      this.emit({ type: 'call', text: 'FAULT', sub: why === 'MIS-HIT' || why === 'TOSS' ? why : '' });
      this.phase = 'pointover'; this.phaseT = 0; this.pointOverDur = 1.4; this.nextIsSecondServe = true;
      s.mood = 'fault'; s.moodT = 0;
    } else {
      this.emit({ type: 'call', text: 'DOUBLE FAULT' });
      this.endPoint(1 - s.idx, 'doublefault', { errorBy: s.idx, unforced: true });
    }
  }

  // ---------- practice feed ----------
  feedBall() {
    const r = this.players[0];
    const b = makeBall();
    b.x = (this.rng.next() - 0.5) * 2; b.y = H - 0.5; b.z = 1.0;
    const tx = clamp(r.x + (this.rng.next() - 0.5) * 5, -3.6, 3.6);
    const ty = -(6.5 + this.rng.next() * 4.5);
    const res = resolveShot({ hold: 0.3 + this.rng.next() * 0.4, chargeFull: 1, timingErr: 0, grade: 'perfect', lr: 0, ud: 0,
      stroke: 'forehand', contact: { x: b.x, y: b.y, z: 1 }, side: 1, player: { x: b.x, y: b.y }, moveFrac: 0, stamina: 1,
      reachPenalty: 0.01, ratings: { power: 70, control: 99, touch: 99 }, incomingSpeed: 0, opp: { x: 0, y: -12 }, specials: false, rng: this.rng });
    // retarget precisely
    b.vx = res.vx; b.vy = res.vy; b.vz = res.vz; b.spin = res.spin;
    b.live = true; b.lastHitter = 1; b.bounces = 0;
    this.ball = b;
    this.point.shots = 1; this.point.serveInPlay = true;
    this.point.lastHit = { p: 1, t: this.t, band: res.band, grade: 'good', serve: false };
    this.path = predictPath(b, this.surface, 4, 2); this.pathT0 = this.t;
    this.phase = 'rally'; this.phaseT = 0;
    this.emit({ type: 'hit', p: 1, band: res.band, grade: 'good', machine: true });
  }

  endPracticeRep() {
    this.phase = 'pointover'; this.phaseT = 0; this.pointOverDur = 1.2; this.nextIsSecondServe = false; this.practiceRep = true;
  }

  // ---------- movement ----------
  moveFree(p, inp, dt, slowOnly = false) {
    let ax = inp.lr, ay = inp.ud; // ud: +1 = up screen = +y world
    const len = Math.hypot(ax, ay);
    if (len > 0) { ax /= len; ay /= len; }
    let vmax = p.speedMax * (0.75 + 0.25 * p.stamina);
    if (p.charging) vmax *= TUNE.shuffleFactor;
    if (inp.sprint && !p.charging && p.stamina > 0.25) { vmax *= 1.18; p.stamina = Math.max(0, p.stamina - 0.10 * dt); }
    if (p.planted > 0 || p.recover > 0 && p.swing && p.swing.phase === 'whiff') vmax = 0;
    if (slowOnly) vmax *= 0.5;
    const tvx = ax * vmax, tvy = ay * vmax;
    const acc = 30 * dt;
    p.vx += clamp(tvx - p.vx, -acc, acc);
    p.vy += clamp(tvy - p.vy, -acc, acc);
    if (p.planted > 0) { p.vx *= 0.6; p.vy *= 0.6; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.x = clamp(p.x, -7.2, 7.2);
    if (p.end < 0) p.y = clamp(p.y, -H - 4.5, -0.7); else p.y = clamp(p.y, 0.7, H + 4.5);
    const sp = Math.hypot(p.vx, p.vy);
    p.moveFrac = sp / p.speedMax;
    if (sp > p.speedMax * 0.7) p.stamina = Math.max(0, p.stamina - 0.012 * dt);
  }

  // ---------- rally ----------
  // Ideal contact for player p against the current path: {t (abs), x,y,z, bounced, idx}
  contactFor(p) {
    if (!this.path || !this.ball.live || this.ball.lastHitter === p.idx || this.ball.held) return null;
    const S = this.path.samples;
    const off = this.t - this.pathT0;
    const i0 = Math.max(0, Math.floor(off / this.path.dt));
    const yc = p.y - p.end * TUNE.contactFront; // in front of the body, toward the net
    const travel = -p.end; // ball must travel toward the player: sign of vy is p.end... (toward the player's end)
    let last = null;
    for (let i = i0; i < S.length - 1; i++) {
      const a = S[i], b = S[i + 1];
      if (b.b >= 2) break;
      // only on this player's half
      if (Math.sign(a.y) !== p.end && Math.sign(b.y) !== p.end) continue;
      last = b;
      // crossing of the contact plane in the travel direction (toward the player's end)
      const da = (a.y - yc) * p.end, db = (b.y - yc) * p.end;
      if (da < 0 && db >= 0) {
        const f = -da / (db - da);
        return { t: this.pathT0 + a.t + (b.t - a.t) * f, x: a.x + (b.x - a.x) * f, y: yc, z: a.z + (b.z - a.z) * f, bounced: a.b >= 1, plane: true };
      }
    }
    void travel;
    if (last) return { t: this.pathT0 + last.t, x: last.x, y: last.y, z: last.z, bounced: last.b >= 1, plane: false };
    return null;
  }

  reachInfo(p, c) {
    const dx = c.x - p.x;
    const adx = Math.abs(dx);
    const dy = Math.abs(c.y - (p.y - p.end * TUNE.contactFront));
    const maxZ = c.bounced ? TUNE.reachHighGround + (p.r.reach - 70) / 120 : TUNE.reachHighAir + (p.r.reach - 70) / 100;
    const ok = adx <= p.reachMax && dy <= 0.9 && c.z <= maxZ && c.z >= 0.04;
    const pen = adx > 0.95 ? 1 + (adx - 0.95) * 1.5 : 1;
    return { ok, dx, adx, pen, maxZ };
  }

  chooseStroke(p, c, ri) {
    const fh = ri.dx * fhSign(p) >= 0;
    const sinceBounce = this.lastBounceT != null ? c.t - this.lastBounceT : 9;
    let stroke = fh ? 'forehand' : 'backhand';
    let variant = '';
    if (!c.bounced) {
      if (c.z > 1.95) stroke = 'smash';
      else stroke = 'volley';
      if (stroke === 'volley' && c.z < 0.5) variant = 'low';
      if (stroke === 'volley' && c.z > 1.5) variant = 'high';
    } else if (c.z > 1.55) { stroke = 'high'; }
    else if (c.z < 0.42 && sinceBounce < 0.16) { stroke = 'halfvolley'; }
    else if (ri.adx > p.reachMax * 0.82 && c.z < 0.75) { stroke = 'slice'; variant = 'lunge'; }
    else if (ri.adx < 0.28) { stroke = 'block'; }
    else if (c.z < 0.45) { stroke = 'low'; }
    else if (p.moveFrac > TUNE.runPenaltyAt) { stroke = 'running'; }
    if (p.data.style === 'slicer' && !fh && stroke === 'backhand' && this.rng.next() < 0) stroke = 'slice';
    return { stroke, fh, variant };
  }

  stepRally(ins, dt) {
    const b = this.ball;
    // players
    for (let i = 0; i < 2; i++) {
      const p = this.players[i], inp = ins[i];
      p.animT += dt;
      if (p.planted > 0) p.planted -= dt;
      if (p.recover > 0) p.recover -= dt;
      if (p.swing) this.advanceSwing(p, dt);
      // auto-move assist
      let mv = inp;
      if (inp.auto && inp.lr === 0 && inp.ud === 0) mv = Object.assign({}, inp, this.autoMoveVector(p));
      this.moveFree(p, mv, dt);
      this.handleHitInput(p, inp, dt);
    }
    // pending serve contact
    if (this.pendingServe && this.t >= this.pendingServe.at - 1e-9) this.doServeContact();
    if (this.phase !== 'rally') return;
    // pending rally contacts
    for (const p of this.players) {
      if (p.pendingContact && this.t >= p.pendingContact.at - 1e-9) this.doContact(p);
      if (this.phase !== 'rally') return;
    }
    if (b.held) { if (this.toss) { b.z = this.tossZ(this.toss.t + this.phaseT); } return; }
    const prevBounces = b.bounces;
    const ev = stepBall(b, dt, this.surface, this.rng);
    if (ev) this.onBallEvent(ev, prevBounces);
    if (this.phase !== 'rally') return;
    // ball hits a player before the bounce
    if (b.live && b.bounces === 0 && b.lastHitter >= 0) {
      const o = this.players[1 - b.lastHitter];
      if (Math.sign(b.y) === o.end && Math.hypot(b.x - o.x, b.y - o.y) < 0.28 && b.z < 1.75 && !o.pendingContact) {
        this.emit({ type: 'call', text: 'BODY' });
        this.endPoint(b.lastHitter, 'body', {});
        return;
      }
    }
    // ball long gone
    if (b.live && (Math.abs(b.y) > H + 9 || Math.abs(b.x) > 12)) {
      // should not happen often: treat as out by the hitter if never bounced
      if (b.bounces === 0) this.endPoint(1 - b.lastHitter, 'out', { errorBy: b.lastHitter });
      else this.endPoint(b.lastHitter, 'winner', {});
    }
    if (this.practice === 'serve' && b.live && this.point.serveInPlay && b.bounces >= 1 && this.phaseT > 0.1) {
      // let it run a moment then reset
      if (b.t > 1.4) this.endPracticeRep();
    }
  }

  autoMoveVector(p) {
    const c = this.contactFor(p);
    let tx, ty;
    if (c) {
      const plan = planContact(this, p, 0);
      if (plan) { tx = plan.x; ty = plan.y; }
    }
    if (tx === undefined) { tx = 0; ty = p.end * (H + 0.8); if (this.ball.lastHitter !== p.idx) return { lr: 0, ud: 0 }; }
    const dx = tx - p.x, dy = ty - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.12) return { lr: 0, ud: 0 };
    const k = Math.min(1, d / 0.6);
    return { lr: dx / d * k, ud: dy / d * k };
  }

  handleHitInput(p, inp, dt) {
    const pressed = inp.hit && !p.prevHit;
    if (p.swing && (p.swing.phase === 'forward' || p.swing.phase === 'follow' || p.swing.phase === 'whiff')) {
      return; // busy
    }
    if (this.point.serving && p.idx === this.server && this.pendingServe) return;
    if (!p.charging) {
      if (pressed && p.recover <= 0) {
        p.charging = true; p.hold = 0;
        p.holdCap = p.rushed ? 0.19 * this.chargeFull : null;
        this.emit({ type: 'charge', p: p.idx });
      }
      return;
    }
    // charging
    p.hold += dt;
    if (p.holdCap !== null) p.hold = Math.min(p.hold, p.holdCap);
    if (inp.lr || inp.ud) p.lastAim = { lr: inp.lr, ud: inp.ud };
    const c = this.contactFor(p);
    if (c) {
      const ri = this.reachInfo(p, c);
      p.pendingStroke = this.chooseStroke(p, c, ri);
      p.pendingStroke.ok = ri.ok;
    } else p.pendingStroke = null;
    let release = !inp.hit;
    let auto = false;
    // held too long: swing automatically, graded late
    if (!release && c && c.plane && this.t + TUNE.forwardSwing > c.t + 0.10) { release = true; auto = true; }
    if (!release && c && !c.plane && this.t + TUNE.forwardSwing > c.t + 0.02) { release = true; auto = true; }
    if (release) this.releaseSwing(p, inp, c, auto);
  }

  releaseSwing(p, inp, c, auto) {
    const hold = p.hold;
    p.charging = false;
    const band = bandOf(hold, this.chargeFull);
    const fill = meterFill(hold, this.chargeFull);
    const aim = auto ? p.lastAim : { lr: inp.lr, ud: inp.ud };
    p.lastAim = aim;
    if (!c) {
      // swing at nothing (shadow swing)
      p.swing = { kind: 'stroke', phase: 'whiff', t: 0, dur: 0.35, band, stroke: p.pendingStroke ? p.pendingStroke.stroke : 'forehand', fh: p.pendingStroke ? p.pendingStroke.fh : true, fill, grade: 'miss' };
      p.recover = TUNE.recoverAfterWhiff;
      this.emit({ type: 'whiff', p: p.idx });
      return;
    }
    const err = (this.t + TUNE.forwardSwing) - c.t;
    let grade = gradeTiming(err);
    const ri = this.reachInfo(p, c);
    const st = this.chooseStroke(p, c, ri);
    if (!ri.ok) grade = 'miss';
    if (grade === 'miss') {
      p.swing = { kind: 'stroke', phase: 'whiff', t: 0, dur: 0.38, band, stroke: st.stroke, fh: st.fh, fill, grade: 'miss' };
      p.recover = TUNE.recoverAfterWhiff;
      if (err < 0 && ri.ok) p.rushed = true;
      p.whiffed = true;
      p.whiffReachable = ri.ok;
      this.emit({ type: 'whiff', p: p.idx });
      this.emit({ type: 'timing', p: p.idx, grade: err < 0 ? 'EARLY' : 'LATE', miss: true });
      return;
    }
    const dur = clamp(c.t - this.t, TUNE.swingMin, TUNE.swingMax);
    p.swing = { kind: 'stroke', phase: 'forward', t: 0, dur, band, stroke: st.stroke, fh: st.fh, variant: st.variant, fill, grade, lr: aim.lr, ud: aim.ud };
    p.pendingContact = { at: this.t + dur, hold, band, grade, err, aim, stroke: st.stroke, fh: st.fh, reachPen: ri.pen, c, moveFrac: p.moveFrac };
    p.planted = dur + TUNE.followThrough[band];
    p.rushed = false;
  }

  doContact(p) {
    const pc = p.pendingContact;
    p.pendingContact = null;
    const b = this.ball;
    if (!b.live || b.lastHitter === p.idx || b.bounces >= 2 || b.inNet) return;
    // the ball must still be near the racket
    const yc = p.y - p.end * TUNE.contactFront;
    const near = Math.abs(b.x - p.x) <= p.reachMax + 0.6 && Math.abs(b.y - yc) < 3.5;
    if (!near) { p.swing.phase = 'whiff'; p.swing.t = 0; p.swing.dur = 0.3; this.emit({ type: 'whiff', p: p.idx }); return; }
    const o = this.players[1 - p.idx];
    const incoming = Math.hypot(b.vx, b.vy, b.vz);
    const contact = { x: b.x, y: b.y, z: clamp(b.z, 0.12, 3.2) };
    const res = resolveShot({ hold: pc.hold, chargeFull: this.chargeFull, timingErr: pc.err, grade: pc.grade,
      lr: pc.aim.lr, ud: pc.aim.ud, stroke: pc.stroke, contact, side: p.end, player: { x: p.x, y: p.y },
      moveFrac: pc.moveFrac, stamina: p.stamina, reachPenalty: pc.reachPen, ratings: p.r, incomingSpeed: incoming,
      opp: { x: o.x, y: o.y }, specials: this.specials, style: p.data.style, fhSide: fhSign(p), rng: this.rng,
      returnOf: this.point.lastHit && this.point.lastHit.serve ? this.point.lastHit.band : null });
    b.vx = res.vx; b.vy = res.vy; b.vz = res.vz; b.spin = res.spin;
    b.bounces = 0; b.lastHitter = p.idx; b.t = 0; b.inNet = false;
    const pt = this.point;
    const prev = pt.lastHit;
    const timeAvail = prev ? this.t - prev.t : 1;
    const forced = pc.reachPen > 1.15 || incoming > 31 || timeAvail < 0.62 || ['slice', 'halfvolley', 'block', 'running'].includes(pc.stroke) || (prev && prev.serve && prev.band !== 'touch' && prev.band !== 'soft');
    pt.shots++;
    // long rallies tire the player (Stamina rating sets how fast)
    p.stamina = Math.max(0.2, p.stamina - 0.02 * (1.45 - p.r.stamina / 100) * Math.min(3, pt.shots / 4));
    if (p.idx === this.receiver && pt.shots === 2) pt.receiverTouched = true;
    pt.serveInPlay = true;
    pt.netCordThisFlight = false;
    pt.lastHit = { p: p.idx, t: this.t, band: res.band, grade: pc.grade, serve: false, forced, stroke: pc.stroke, kind: res.kind };
    p.swing.phase = 'forward';
    p.swing.contactDone = true;
    p.swing.kind2 = res.kind;
    this.lastBounceT = null;
    this.path = predictPath(b, this.surface, 4, 2); this.pathT0 = this.t;
    const volley = pc.stroke === 'volley' || pc.stroke === 'smash';
    this.logEv({ type: 'hit', p: p.idx, band: res.band, grade: pc.grade, stroke: pc.stroke, kind: res.kind, kmh: Math.round(res.speedKmh), forced, volley, lr: pc.aim.lr, ud: pc.aim.ud });
    this.emit({ type: 'hit', p: p.idx, band: res.band, grade: pc.grade, stroke: pc.stroke, kind: res.kind, kmh: res.speedKmh });
    this.emit({ type: 'timing', p: p.idx, grade: pc.grade.toUpperCase() });
    if (this.practice === 'feed') { this.practiceStats.shots++; if (pc.grade === 'perfect') this.practiceStats.perfect++; }
  }

  advanceSwing(p, dt) {
    const s = p.swing;
    s.t += dt;
    if (s.phase === 'forward' && s.t >= s.dur) {
      s.phase = 'follow'; s.t = 0; s.dur = TUNE.followThrough[s.band] || 0.35;
    } else if ((s.phase === 'follow' || s.phase === 'whiff') && s.t >= s.dur) {
      p.swing = null;
    }
  }

  onBallEvent(ev, prevBounces) {
    const b = this.ball;
    const pt = this.point;
    if (ev.type === 'netcord') {
      pt.netCordThisFlight = true;
      this.emit({ type: 'netcord' });
      this.path = predictPath(b, this.surface, 4, 2); this.pathT0 = this.t;
      return;
    }
    if (ev.type === 'net') {
      this.emit({ type: 'net' });
      this.logEv({ type: 'net', p: b.lastHitter });
      if (!pt.serveInPlay && pt.lastHit && pt.lastHit.serve) {
        this.emit({ type: 'call', text: 'NET' });
        // serve into the net is a fault
        b.live = false;
        this.serveFault(this.players[this.server], 'NET');
        return;
      }
      this.emit({ type: 'call', text: 'NET' });
      if (this.practice === 'feed') { this.endPracticeRep(); return; }
      this.endPoint(1 - b.lastHitter, 'net', { errorBy: b.lastHitter });
      return;
    }
    if (ev.type !== 'bounce') return;
    this.lastBounceT = this.t;
    this.emit({ type: 'bounce', x: ev.x, y: ev.y });
    const hitter = b.lastHitter;
    if (b.bounces === 1) {
      // the serve
      if (!pt.serveInPlay && pt.lastHit && pt.lastHit.serve) {
        const box = this.serveBox;
        const call = serveBoxCall(ev.x, ev.y, box.xmin, box.xmax, box.farHalf);
        this.logEv({ type: 'bounce', x: r2(ev.x), y: r2(ev.y), in: call.in, serve: true });
        if (call.in && pt.netCordThisFlight) {
          this.emit({ type: 'call', text: 'LET' });
          this.logEv({ type: 'let', p: hitter });
          b.live = false;
          this.phase = 'pointover'; this.phaseT = 0; this.pointOverDur = 1.2; this.nextIsSecondServe = this.serveNo === 2; this.isLet = true;
          return;
        }
        if (!call.in) {
          this.maybeCloseCall(ev, call);
          b.live = false;
          this.serveFault(this.players[this.server], call.why || 'OUT');
          return;
        }
        pt.serveInPlay = true;
        if (this.practice === 'serve') { this.practiceStats.servesIn++; }
        this.maybeCloseCall(ev, call, true);
        return;
      }
      // a rally ball must land in the opponent's half
      const side = hitter === 0 ? 1 : -1;
      const call = lineCall(ev.x, ev.y, side);
      this.logEv({ type: 'bounce', x: r2(ev.x), y: r2(ev.y), in: call.in });
      if (this.practice === 'feed' && hitter === 1) return;
      if (!call.in) {
        this.maybeCloseCall(ev, call);

function lerpPose(a, b, t) {
  const o = {};
  for (const k in BASE) o[k] = a[k] + (b[k] - a[k]) * t;

}
const ease = (t) => t * t * (3 - 2 * t);

// ---------- stroke pose evaluation ----------
function famOf(p, stroke, fh) {
  if (fh) return 'fh';
  return p.data.bh === 1 ? 'bh1' : 'bh2';
}

function backKey(fam, stroke, band, fh) {
  if (stroke === 'slice') return fh ? 'fhSliceBack' : 'sliceBack';
  if (stroke === 'volley') return fh ? 'volFhBack' : 'volBhBack';
  if (stroke === 'smash') return 'smashPoint';
  if (stroke === 'block') return 'block';
  return BACK_BY_BAND[fam][band];
}
function contactKey(fam, stroke, band, fh, variant, z) {
  if (stroke === 'slice') return fh ? 'fhSliceContact' : 'sliceContact';
  if (stroke === 'volley') return variant === 'low' ? 'volLow' : variant === 'high' ? 'volHigh' : fh ? 'volFhContact' : 'volBhContact';
  if (stroke === 'smash') return 'smashContact';
  if (stroke === 'block') return 'block';
  if (stroke === 'halfvolley') return 'halfVolley';
  if (stroke === 'high') return fh ? 'fhContactHigh' : 'bh2Contact';
  if (stroke === 'low') return fh ? 'fhContactLow' : fam === 'bh1' ? 'bh1Contact' : 'bh2Contact';
  if (!fh) return fam === 'bh1' ? 'bh1Contact' : 'bh2Contact';
  return band === 'hard' || band === 'firm' ? 'fhContactTop' : 'fhContactFlat';
}
function followKey(fam, stroke, band, fh) {
  if (stroke === 'slice') return fh ? 'fhSliceFollow' : 'sliceFollow';
  if (stroke === 'volley' || stroke === 'block') return fh ? 'volFhFollow' : 'volBhFollow';
  if (stroke === 'smash') return 'smashFollow';
  return FOLLOW_BY_BAND[fam][band];
}

// The animation name for a stroke event (used by the coverage test and the debug overlay).
function strokeAnimName(stroke, fh, bh, part, band) {
  const label = fh ? 'forehand' : bh === 1 ? 'backhand1' : 'backhand2';
  if (stroke === 'volley' || stroke === 'block') return `volley.${fh ? 'forehand' : 'backhand'}.${stroke === 'block' ? 'block' : 'punch'}`;
  if (stroke === 'halfvolley') return `volley.${fh ? 'forehand' : 'backhand'}.halfvolley`;
  if (stroke === 'smash') return part === 'back' ? 'smash.point' : 'smash.standing';
  if (stroke === 'slice') return `${label}.slice`;
  if (stroke === 'high') return `${label}.high`;
  if (stroke === 'low') return `${label}.low`;
  if (stroke === 'running') return `${label}.running`;
  if (stroke === 'serve') return part === 'back' ? `serve.charge.${band}` : 'serve.swing.flat';
  if (part === 'back') return `${label}.back.${band}`;
  if (part === 'forward') return `${label}.swing.${band === 'hard' || band === 'firm' ? 'topspin' : 'flat'}`;
  return `${label}.follow.${band}`;
}

function shake(pose, amt, t) {
  pose.ra += Math.sin(t * 60) * 5 * amt; pose.twist += Math.sin(t * 47) * 0.04 * amt; pose.crouch += Math.sin(t * 33) * 0.03 * amt;
  return pose;
}

function locomotion(p, t) {
  const sp = Math.hypot(p.vx, p.vy);
  if (sp < 0.4) return { pose: KEY.ready, name: 'ready' };
  const lateral = Math.abs(p.vx) > Math.abs(p.vy) * 1.2;
  if (p.charging || (lateral && sp < p.speedMax * 0.55)) {
    const cyc = (t * 3.3) % 1;
    const pz = cyc < 0.5 ? lerpPose(KEY.shuffleA, KEY.shuffleB, ease(cyc * 2)) : lerpPose(KEY.shuffleB, KEY.shuffleA, ease((cyc - 0.5) * 2));
    return { pose: pz, name: p.vx < 0 ? 'shuffle.left' : 'shuffle.right' };
  }
  const backward = (p.vy * p.end) > sp * 0.5;
  const rate = sp > p.speedMax * 0.95 ? 4.2 : 3.2;
  const cyc = (t * rate) % 1;
  const a = backward ? KEY.backpedal : KEY.runA, b = backward ? KEY.ready : KEY.runB;
  const pz = cyc < 0.5 ? lerpPose(a, b, ease(cyc * 2)) : lerpPose(b, a, ease((cyc - 0.5) * 2));
  return { pose: pz, name: backward ? 'backpedal' : sp > p.speedMax * 0.95 ? 'sprint' : 'run' };
}

// Pick the pose for a player this frame. pres: presentation RNG values per player (variants).
function animate(p, m, t) {
  const sw = p.swing;
  const stroke = sw ? sw.stroke : p.pendingStroke ? p.pendingStroke.stroke : 'forehand';
  const fh = sw ? sw.fh : p.pendingStroke ? p.pendingStroke.fh : true;
  const fam = famOf(p, stroke, fh);
  // serve states
  if (m.phase === 'preserve' && m.server === p.idx && !m.practice || (m.phase === 'preserve' && m.practice === 'serve' && p.idx === 0)) {
    const n = 2 + (p.idx + m.pointCount) % 3; // 2, 3 or 4 bounces
    const ph = m.phaseT % (0.5 * n + 0.8);
    if (ph < 0.5 * n) {
      const u = (ph % 0.5) / 0.5;
      return { pose: lerpPose(KEY.serveSet, KEY.serveBounce, Math.sin(u * Math.PI)), name: `serve.bounce.${n}`, ballBounce: u, holdBall: true };
    }
    return { pose: KEY.serveSet, name: 'serve.look.opponent', holdBall: true };
  }
  if (m.phase === 'toss' && m.server === p.idx && p.serveAnim) {
    const sa = p.serveAnim;
    const k = m.chargeFull / TUNE.chargeFull;
    const tt = sa.t / k;
    let pose;
    if (tt < 0.25) pose = lerpPose(KEY.tossStart, KEY.tossRelease, ease(tt / 0.25));
    else pose = lerpPose(KEY.tossRelease, KEY.trophy, ease(Math.min(1, (tt - 0.25) / 0.3)));
    if (sa.phase === 'trophy') {
      // knee bend and racket drop deepen with the serve meter
      pose = lerpPose(pose, KEY.trophyDeep, sa.fill || 0);
      if ((sa.fill || 0) >= 0.999 && p.hold > m.chargeFull + TUNE.overGrace) shake(pose, 1, t);
    }
    if (p.lastAim.lr) pose.lean += 0.05 * p.lastAim.lr * (p.end < 0 ? 1 : -1) * fhSign(p);
    if (m.toss && m.toss.underarm) pose = lerpPose(KEY.serveSet, KEY.underarmBack, Math.min(1, tt * 2));
    return { pose, name: sa.phase === 'trophy' ? 'serve.racket.drop' : 'serve.toss' };
  }
  if (sw && sw.kind === 'serve') {
    const band = sw.band;
    const touch = band === 'touch';
    const under = m.toss && m.toss.underarm;

          if (audio) audio.bounce(m.surface.id, e.dead);
          if (courtR && !e.dead) courtR.addMark(e.x, e.y);
          break;
        case 'net': if (audio) audio.net(); break;
        case 'netcord': if (audio) audio.netcord(); this.calls.push({ text: 'NET CORD', t: 0, small: true }); break;
        case 'whiff': if (audio) audio.whiff(); break;
        case 'point':
          if (audio) audio.applause(e.shots >= 10 ? 1.3 : e.ender === 'ace' ? 1.0 : e.ender === 'winner' ? 0.8 : 0.5);
          if (courtR) { courtR.clap = e.shots >= 8 || e.ender === 'ace' ? 2.2 : 0; }
          if (e.rev && e.rev.game) {
            const text = e.rev.match ? 'GAME SET AND MATCH' : e.rev.set ? 'GAME AND SET' : 'GAME';
            this.calls.push({ text, t: -0.6, small: false });
            if (audio) setTimeout(() => audio.umpire(text), 600);
          } else if (e.rev && e.rev.deuce) { this.calls.push({ text: 'DEUCE', t: -0.7, small: true }); }
          else if (e.rev && e.rev.advantage >= 0) { this.calls.push({ text: 'ADVANTAGE', t: -0.7, small: true }); }
          break;
        case 'closecall': if (courtR) courtR.ooh = 1.2; if (audio) audio.ooh(); break;
        case 'charge': if (audio) audio.charge(); break;
        case 'toss': if (audio) audio.hush(); break;
        case 'matchover': if (audio) audio.applause(1.6); break;
        default: break;
      }
    }
    m.fx.length = 0;
  }
  update(dt) {
    for (const arr of [this.calls, this.pops, this.banners, this.flash]) {
      for (const c of arr) c.t += dt;
    }
    this.calls = this.calls.filter((c) => c.t < 1.1);
    this.pops = this.pops.filter((c) => c.t < 0.9);
    this.banners = this.banners.filter((c) => c.t < 2.6);
    this.flash = this.flash.filter((c) => c.t < 0.12);
    if (this.speedText) { this.speedText.t += dt; if (this.speedText.t > 4) this.speedText = null; }
    for (const c of this.confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 30 * dt; c.r += dt * 5; }
    this.confetti = this.confetti.filter((c) => c.y < HGT + 10);
  }
}

// Aim preview without error: the same target rules as the shot model.
function previewTarget(m, p, lr, ud, band) {
  const T = MODEL.targets;
  const dir = -p.end;
  const o = m.players[1 - p.idx];
  let tx = lr * T.wideX, depth = T.mid;
  if (ud > 0) depth = T.deep; else if (ud < 0) { depth = T.short; if (lr) tx = lr * T.shortWideX; }
  if (!lr) tx = clamp(p.x * 0.15, -0.8, 0.8);
  if (m.specials) {
    if (ud > 0 && (band === 'touch' || band === 'soft') && Math.abs(o.y) < COURT.SERVICE_LINE + 0.6) depth = T.lobDepth;
    else if (ud < 0 && band === 'touch' && Math.abs(o.y) > 8.6) depth = T.dropDepth;
  }
  if (band === 'touch' && ud === 0) depth -= 1.2;
  if ((band === 'hard' || band === 'over') && ud === 0) depth += 0.8;
  return { x: tx, y: dir * depth };
}

function drawMatch(ctx, m, cam, courtR, fx, settings, userSet, t, opts = {}) {
  const b = m.ball;
  // camera
  const targetCx = settings.reducedMotion ? 0 : clamp((b.held ? m.players[m.server].x : b.x) * 0.22, -0.82, 0.82);
  cam.cx += (targetCx - cam.cx) * 0.06;
  const zoomT = !settings.reducedMotion && m.phase === 'preserve' && !opts.demo ? 1.03 : 1;
  cam.zoom += (zoomT - cam.zoom) * 0.03;
  cam.update();

  courtR.drawBackground(ctx, cam, t, b.x, { final: opts.final });
  courtR.drawCourt(ctx, cam);
  // serve box highlight for the server in pre-serve
  const srv = m.players[m.server];
  if ((m.phase === 'preserve' || m.phase === 'toss') && m.serveBox && userSet.has(m.server) && !m.practice || (m.practice === 'serve' && (m.phase === 'preserve' || m.phase === 'toss'))) {
    const bx = m.serveBox; const ys = bx.farHalf ? 1 : -1;
    courtR.quad(ctx, cam, [[bx.xmin, 0], [bx.xmax, 0], [bx.xmax, ys * COURT.SERVICE_LINE], [bx.xmin, ys * COURT.SERVICE_LINE]], 'rgba(255,255,255,0.13)');
    if (srv.lastAim.lr && m.phase === 'toss') {
      const half = srv.lastAim.lr < 0 ? [bx.xmin, (bx.xmin + bx.xmax) / 2] : [(bx.xmin + bx.xmax) / 2, bx.xmax];
      courtR.quad(ctx, cam, [[half[0], 0], [half[1], 0], [half[1], ys * COURT.SERVICE_LINE], [half[0], ys * COURT.SERVICE_LINE]], 'rgba(255,255,140,0.16)');
    }
  }
  // landing marker for an incoming ball
  if (settings.landingMarker && b.live && !b.held && b.bounces === 0 && m.path && m.path.bounces.length && userSet.has(1 - b.lastHitter)) {
    const lb = m.path.bounces[0];
    const p = cam.project(lb.x, lb.y, 0);
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(p[0], p[1], Math.max(3, p[2] * 0.25), Math.max(1.5, p[2] * 0.09), 0, 0, 6.28); ctx.stroke();
  }
  // aim guide
  for (const i of userSet) {
    const p = m.players[i];
    if (!settings.aimGuide) continue;
    const charging = p.charging && (m.phase === 'rally' || m.phase === 'toss');
    if (!charging) continue;
    let tg;
    const band = bandOf(p.hold, m.chargeFull);
    const aim = opts.aimInputs && opts.aimInputs[i] ? opts.aimInputs[i] : p.lastAim;
    if (m.phase === 'toss' && m.server === i) tg = serveTarget(m.serveBox, aim.lr);
    else tg = previewTarget(m, p, aim.lr, aim.ud, band);
    const over = p.hold > m.chargeFull + TUNE.overGrace;
    const wob = over ? Math.sin(t * 40) * 0.6 : 0;
    const a = cam.project(p.x, p.y, 0.05), c = cam.project(tg.x + wob, tg.y + wob * 0.5, 0);
    ctx.strokeStyle = over ? 'rgba(255,90,90,0.8)' : 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(c[0], c[1]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.ellipse(c[0], c[1], Math.max(3, c[2] * 0.4), Math.max(1.5, c[2] * 0.15), 0, 0, 6.28); ctx.stroke();
    if (m.phase === 'toss' && m.server === i && tg.label && aim.lr) drawText(ctx, tg.label, c[0], c[1] - 12, { align: 'center', color: '#ffff8c', outline: '#000' });
  }
  // ball shadow (never hidden)
  let ballPos = null;
  const anims = m.players.map((p) => animate(p, m, t + p.idx * 0.37));
  if (!b.held || m.phase === 'toss' || m.phase === 'rally') {
    if (!(b.held && m.phase === 'preserve')) ballPos = { x: b.x, y: b.y, z: b.z };
  }
  if (ballPos && !b.inNet) {
    const sp = cam.project(ballPos.x, ballPos.y, 0);
    const k = sp[2];
    const hfac = clamp(1 - ballPos.z / 8, 0.35, 1);
    ctx.fillStyle = `rgba(0,0,0,${0.35 * hfac})`;
    ctx.beginPath(); ctx.ellipse(sp[0], sp[1], Math.max(1.5, k * 0.075 * (2 - hfac)), Math.max(1, k * 0.03 * (2 - hfac)), 0, 0, 6.28); ctx.fill();
  }
  // entities in depth order
  const ents = [];
  for (const p of m.players) ents.push({ y: p.y, kind: 'player', p });
  ents.push({ y: 0, kind: 'net' });
  ents.push({ y: 0.31, kind: 'umpire' });
  if (ballPos) ents.push({ y: ballPos.y + (b.held ? -0.01 * Math.sign(ballPos.y) : 0), kind: 'ball' });
  for (const [x, y] of [[-6.6, H + 3.2], [6.6, H + 3.2], [-7.4, -H - 1.2], [7.4, -H - 1.2]]) ents.push({ y, kind: 'kid', x });
  ents.sort((a, c) => c.y - a.y);
  const handPos = [null, null];
  for (const e of ents) {
    if (e.kind === 'net') courtR.drawNet(ctx, cam);
    else if (e.kind === 'umpire') courtR.drawUmpire(ctx, cam, t, b.x);
    else if (e.kind === 'kid') courtR.drawBallKid(ctx, cam, e.x, e.y, t, false);
    else if (e.kind === 'player') {
      const p = e.p;
      const sp = cam.project(p.x, p.y, 0);
      const view = p.end < 0 ? 'back' : 'front';
      const dom = (p.end < 0 ? 1 : -1) * (p.lefty ? -1 : 1);
      const a = anims[p.idx];
      const flash = fx.flash.some((f) => f.p === p.idx);
      const pose = Object.assign({}, a.pose, { headShake: a.headShake });
      const r = drawRig(ctx, sp[0], sp[1], sp[2], pose, p.data.look, view, dom, { flash, t, racketColor: p.data.flag.colors[0] === '#ffffff' ? p.data.flag.colors[1] : p.data.flag.colors[0] });
      handPos[p.idx] = r;
      // ball in hand / bouncing before the serve
      if (a.holdBall && m.server === p.idx) {
        const hb = r.freeHand;
        const by = a.ballBounce !== undefined ? hb[1] + Math.sin(a.ballBounce * Math.PI) * (sp[1] - hb[1]) : hb[1];
        ctx.fillStyle = settings.highContrastBall ? '#ffff00' : '#e6f24a';
        const br = Math.max(1.5, sp[2] * 0.06);
        if (settings.highContrastBall) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hb[0], by - br, br + 1, 0, 6.28); ctx.fill(); ctx.fillStyle = '#ffff00'; }
        ctx.beginPath(); ctx.arc(hb[0], by - br, br, 0, 6.28); ctx.fill();
      }
      if (opts.debugAnim) drawText(ctx, a.name, sp[0], sp[1] + 4, { align: 'center', color: '#fff' });
    } else if (e.kind === 'ball') {
      drawBall(ctx, cam, ballPos, b, settings, fx);
    }
  }
  // HUD
  drawHud(ctx, m, cam, fx, settings, userSet, t, opts);
}

function drawBall(ctx, cam, bp, b, settings, fx) {
  const p = cam.project(bp.x, bp.y, bp.z);
  const r = Math.max(1.6, p[2] * 0.075);
  const speed = Math.hypot(b.vx, b.vy, b.vz);
  fx.trail.push([p[0], p[1]]);
  if (fx.trail.length > 6) fx.trail.shift();
  if (speed * 3.6 > 120 && !b.held && !b.inNet) {
    for (let i = 0; i < fx.trail.length - 1; i++) {
      ctx.fillStyle = `rgba(240,255,120,${0.12 + i * 0.06})`;
      ctx.beginPath(); ctx.arc(fx.trail[i][0], fx.trail[i][1], r * (0.5 + i * 0.08), 0, 6.28); ctx.fill();
    }
  }
  if (settings.highContrastBall) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(p[0], p[1], r + 1, 0, 6.28); ctx.fill(); ctx.fillStyle = '#ffff00'; }
  else ctx.fillStyle = '#e6f24a';
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.28); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(Math.round(p[0] - r * 0.4), Math.round(p[1] - r * 0.5), 1, 1);
}

function flagBox(ctx, x, y, flag, w = 9, h = 6) {
  const c = flag.colors;
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = c[i];
    if (flag.vertical) ctx.fillRect(x + i * w / 3, y, Math.ceil(w / 3), h);
    else ctx.fillRect(x, y + i * h / 3, w, Math.ceil(h / 3));
  }
  if (flag.emblem) { ctx.fillStyle = flag.emblem; ctx.fillRect(Math.round(x + w / 2 - 1), Math.round(y + h / 2 - 1), 2, 2); }
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.strokeRect(x - 0.5, y - 0.5, w + 1, h + 1);
}

function meterColors(settings) {
  return settings.colorblind
    ? { touch: '#7fc8f8', soft: '#5390d9', firm: '#ffd166', hard: '#f8f9fa', over: '#ff5d8f', empty: 'rgba(0,0,0,0.5)' }
    : { touch: '#9be564', soft: '#d7f75b', firm: '#ffd23f', hard: '#ff8c42', over: '#ff3b3b', empty: 'rgba(0,0,0,0.5)' };
}

function drawMeter(ctx, m, p, cam, settings, t) {
  const sp = cam.project(p.x, p.y, 0);
  const k = sp[2];
  const cx = sp[0] + (p.end < 0 ? 1 : 1) * Math.max(16, k * 0.75);
  const cy = sp[1] - Math.max(18, k * 1.1);
  const R = 15;
  const col = meterColors(settings);
  const cf = m.chargeFull;
  const fill = meterFill(p.hold, cf);
  const over = p.hold > cf + TUNE.overGrace;
  const edges = TUNE.bandEdges;
  const fe = (f) => 1 - Math.pow(1 - f, 1.7);
  const segs = [['touch', 0, fe(edges.touch)], ['soft', fe(edges.touch), fe(edges.soft)], ['firm', fe(edges.soft), fe(edges.firm)], ['hard', fe(edges.firm), 1]];
  // arc from bottom (-90deg... ) going up the right side
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  const ang = (f) => a0 + (a1 - a0) * f;
  ctx.lineWidth = 5;
  ctx.strokeStyle = col.empty;
  ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
  for (const [bnd, s, e] of segs) {
    ctx.strokeStyle = bnd === 'touch' ? col.touch : bnd === 'soft' ? col.soft : bnd === 'firm' ? col.firm : col.hard;
    ctx.globalAlpha = 0.28;
    ctx.beginPath(); ctx.arc(cx, cy, R, ang(s), ang(e)); ctx.stroke();
    ctx.globalAlpha = 1;
    if (fill > s) { ctx.beginPath(); ctx.arc(cx, cy, R, ang(s), ang(Math.min(e, fill))); ctx.stroke(); }
  }
  if (over) { ctx.strokeStyle = col.over; ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke(); }
  else if (fill >= 0.999) { // grace: pulse
    ctx.strokeStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(t * 30)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R + 4, a0, a1); ctx.stroke();
  }
  // ghost: best release point for this ball
  if (settings.ghost) {
    const c = m.contactFor(p);
    if (c) {
      const tl = c.t - TUNE.forwardSwing - m.t; // time left to hold
      const best = Math.min(cf, p.hold + Math.max(0, tl));
      const g = fe(Math.min(1, best / cf));
      const a = ang(g);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (R - 5), cy + Math.sin(a) * (R - 5)); ctx.lineTo(cx + Math.cos(a) * (R + 5), cy + Math.sin(a) * (R + 5)); ctx.stroke();
    }
  }
  const band = bandOf(p.hold, cf);
  drawText(ctx, BAND_LABEL[band], cx, cy - 3, { align: 'center', color: over ? col.over : '#ffffff', outline: '#000' });
}

function drawScoreboard(ctx, m, settings, opts) {
  const rs = m.rules;
  const pt = pointText(rs);
  const x = 6, y = 6;
  const multiSet = rs.format.setsToWin > 1;
  const w = multiSet ? 176 : 160;
  ctx.fillStyle = 'rgba(10,18,40,0.88)'; ctx.fillRect(x, y, w, 30);
  ctx.fillStyle = '#ffd166'; ctx.fillRect(x, y, 2, 30);
  for (let i = 0; i < 2; i++) {
    const p = m.players[i];
    const ry = y + 4 + i * 13;
    flagBox(ctx, x + 6, ry, p.data.flag);
    drawText(ctx, p.data.short, x + 19, ry, { color: '#ffffff' });
    if (m.server === i && !rs.matchOver) { ctx.fillStyle = '#e6f24a'; ctx.fillRect(x + 82, ry + 2, 3, 3); }
    let cx = x + 92;
    if (multiSet) { for (const sh of rs.setHistory) { drawText(ctx, String(sh[i]), cx, ry, { color: '#9fb3c8' }); cx += 9; } }
    drawText(ctx, String(rs.games[i]), cx + 4, ry, { color: '#ffd166' });
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(cx + 16, ry - 2, 30, 11);
    drawText(ctx, i === 0 ? pt.a : pt.b, cx + 31, ry, { align: 'center', color: '#ffffff' });
  }
  // flags
  const pf = pressureFlags(rs);
  let flag = pt.flag;
  if (pf.matchPoint) flag = 'MATCH POINT'; else if (pf.setPoint) flag = 'SET POINT'; else if (pf.breakPoint) flag = 'BREAK POINT';
  else if (rs.tiebreak) flag = 'TIEBREAK';
  if (m.serveNo === 2 && (m.phase === 'preserve' || m.phase === 'toss')) flag = flag ? flag + ' - 2ND SERVE' : '2ND SERVE';
  if (flag && !rs.matchOver) {
    const fw = textWidth(flag) + 8;
    ctx.fillStyle = pf.matchPoint || pf.breakPoint || pf.setPoint ? '#c1121f' : '#264653';
    ctx.fillRect(x, y + 31, fw, 11);
    drawText(ctx, flag, x + 4, y + 33, { color: '#ffffff' });
  }
}

function drawHud(ctx, m, cam, fx, settings, userSet, t, opts) {
  if (!opts.demo && !m.practice) drawScoreboard(ctx, m, settings, opts);
  if (m.practice) {
    const ps = m.practiceStats;
    ctx.fillStyle = 'rgba(10,18,40,0.85)'; ctx.fillRect(6, 6, 170, 30);
    if (m.practice === 'feed') {
      drawText(ctx, 'FEED MACHINE', 12, 10, { color: '#ffd166' });
      drawText(ctx, `IN ${ps.inCount}/${ps.shots}  PERFECT ${ps.perfect}`, 12, 22, { color: '#fff' });
    } else {
      drawText(ctx, 'SERVE PRACTICE', 12, 10, { color: '#ffd166' });
      drawText(ctx, `IN ${ps.servesIn}/${ps.serves}`, 12, 22, { color: '#fff' });
    }
    drawText(ctx, 'ESC: MENU', W - 6, 6, { align: 'right', color: 'rgba(255,255,255,0.7)' });
  }
  // serve speed
  if (fx.speedText && !opts.demo) {
    const v = settings.mph ? Math.round(fx.speedText.kmh / 1.609) + ' MPH' : Math.round(fx.speedText.kmh) + ' KM/H';
    const yy = m.practice ? 40 : 52;
    ctx.fillStyle = 'rgba(10,18,40,0.8)'; ctx.fillRect(6, yy, textWidth(v) + 10, 11);
    drawText(ctx, v, 11, yy + 2, { color: '#8ecae6' });
  }
  // meters
  if (!opts.demo) for (const i of userSet) {
    const p = m.players[i];
    if (p.charging) drawMeter(ctx, m, p, cam, settings, t);
  }
  // timing pops
  for (const pp of fx.pops) {
    const p = m.players[pp.p];
    if (!userSet.has(pp.p) && !settings.cpuPops) continue;
    const sp = cam.project(p.x, p.y, 2.3);
    const col = pp.text === 'PERFECT' ? '#ffe45e' : pp.text === 'GOOD' ? '#9be564' : '#ff8c42';
    drawText(ctx, pp.text, sp[0], sp[1] - 8 - pp.t * 14, { align: 'center', color: col, outline: '#000' });
  }
  // calls
  const live = fx.calls.filter((c) => c.t >= 0);
  if (live.length) {
    const c = live[live.length - 1];
    const sc = c.small ? 2 : 3;
    const a = c.t < 0.08 ? c.t / 0.08 : 1;
    ctx.globalAlpha = a;
    const y = c.small ? 112 : 104;
    drawText(ctx, c.text, W / 2, y, { align: 'center', scale: sc, color: c.text === 'ACE' ? '#ffe45e' : '#ffffff', outline: '#10213d' });
    if (c.sub) drawText(ctx, c.sub, W / 2, y + 24, { align: 'center', color: '#ffd166', outline: '#10213d' });
    ctx.globalAlpha = 1;
  }
  // banners
  if (fx.banners.length) {
    const bn = fx.banners[0];
    const y = HGT - 34;
    const w = textWidth(bn.text) + 20;
    const slide = Math.min(1, bn.t * 4) * Math.min(1, (2.6 - bn.t) * 4);
    ctx.globalAlpha = slide;
    ctx.fillStyle = 'rgba(193,18,31,0.9)'; ctx.fillRect(W / 2 - w / 2, y, w, 15);
    drawText(ctx, bn.text, W / 2, y + 4, { align: 'center', color: '#fff' });
    ctx.globalAlpha = 1;
  }
  // close call inset
  if (settings.closeCall && m.closeCall && m.t - m.closeCall.t < 2.2 && m.t - m.closeCall.t > 0.15) drawCloseCall(ctx, m.closeCall);
  // change of ends wipe
  if (m.phase === 'changeends') {
    const u = m.phaseT / 2;
    const a = u < 0.3 ? u / 0.3 : u > 0.75 ? (1 - u) / 0.25 : 1;
    ctx.fillStyle = `rgba(8,14,30,${0.85 * a})`;
    const wpx = W * Math.min(1, u / 0.3);
    ctx.fillRect(0, 0, wpx, HGT);
    if (a > 0.5) {
      drawText(ctx, 'CHANGE OF ENDS', W / 2, HGT / 2 - 16, { align: 'center', scale: 2, color: '#ffd166' });
      if (opts.statLine) drawText(ctx, opts.statLine, W / 2, HGT / 2 + 8, { align: 'center', color: '#fff' });
    }
  }
  if (m.phase === 'pointover' && m.phaseT > 0.8 && !m.practice && !opts.demo && !m.rules.matchOver) {
    drawText(ctx, 'SPACE: NEXT POINT', W - 6, HGT - 12, { align: 'right', color: 'rgba(255,255,255,0.55)' });
  }
}

function drawCloseCall(ctx, cc) {
  const bx = W - 132, by = 8, bw = 124, bh = 84;
  ctx.fillStyle = '#10213d'; ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 16);
  ctx.save();
  ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
  ctx.fillStyle = '#3b6e3b'; ctx.fillRect(bx, by, bw, bh);
  const S = 420; // px per meter
  const cx = bx + bw / 2, cy = by + bh / 2;
  const toI = (x, y) => [cx + (x - cc.x) * S, cy - (y - cc.y) * S];
  ctx.fillStyle = '#ffffff';
  const lw = 0.05 * S;
  const SW = COURT.SINGLES_HALF_W, SL = COURT.SERVICE_LINE;

  makeDraw() {
    const user = playerById(this.sel.player);
    const cpus = PLAYERS.filter((p) => p !== user).sort((a, b) => overall(b) - overall(a));
    const rank = 4 + Math.floor(Math.random() * 4); // user unseeded: takes a rank 5-8 slot
    const ranked = cpus.slice();
    ranked.splice(rank, 0, user);
    // standard 8 draw: 1v8, 4v5, 3v6, 7v2 (seed ranks 0-based)
    const order = [0, 7, 3, 4, 2, 5, 6, 1];
    this.tour = { slots: order.map((r) => ranked[r].id), seeds: Object.fromEntries(cpus.map((p, i) => [p.id, i + 1])), rounds: [], round: 0, user: user.id, court: this.sel.court, diff: this.sel.difficulty, out: false, champion: false };
  }
  tourRoundPlayers(r) {
    if (r === 0) return this.tour.slots;
    const prev = this.tour.rounds[r - 1];
    return prev ? prev.map((x) => x.winner) : null;
  }
  prepareTourMatch() {
    const T = this.tour;
    const ids = this.tourRoundPlayers(T.round);
    const idx = ids.indexOf(T.user);
    const opp = ids[idx % 2 === 0 ? idx + 1 : idx - 1];
    const di = DIFF_ORDER.indexOf(T.diff);
    const diff = T.round === 2 ? DIFF_ORDER[Math.min(3, di + 1)] : T.diff;
    const names = ['QUARTERFINAL', 'SEMIFINAL', 'FINAL'];
    const format = T.round === 2 ? FORMATS[this.settings.finalLength] : FORMATS.quick;
    this.pending = { type: 'tournament', p0: playerById(T.user), p1: playerById(opp), mode: '1p', court: T.court, format, diff, roundName: names[T.round], final: T.round === 2 };
  }
  tourRecord(userWon, m) {
    const T = this.tour;
    if (!userWon) { T.out = true; return; }
    // user advanced: simulate the rest of the round
    const ids = this.tourRoundPlayers(T.round);
    const res = [];
    for (let i = 0; i < ids.length; i += 2) {
      const a = ids[i], b = ids[i + 1];
      if (a === T.user || b === T.user) {
        const g = m.rules.setHistory.map((sh) => sh[0] + '-' + sh[1]).join(' ');
        res.push({ a, b, winner: T.user, score: a === T.user ? g : m.rules.setHistory.map((sh) => sh[1] + '-' + sh[0]).join(' ') });
      } else {
        const r = simMatch({ p0: playerById(a), p1: playerById(b), surface: T.court, format: 'quick', seed: (Math.random() * 1e9) | 0, maxSeconds: 3600 });
        const winner = r.winner === 0 ? a : b;
        res.push({ a, b, winner, score: r.rules.setHistory.map((sh) => sh[0] + '-' + sh[1]).join(' ') });
      }
    }
    T.rounds[T.round] = res;
    T.round++;
    if (T.round >= 3) T.champion = true;
  }
  upd_bracket() {
    if (this.backPressed()) { this.audio.menuBack(); this.go('title'); return; }
    if (this.input.pressed('Space', 'Enter')) {
      this.audio.menuSelect();
      if (this.tour.champion) { this.go('champion', { t: 0 }); return; }
      this.prepareTourMatch();
      this.go('vs');
    }
  }
  draw_bracket(ctx) {
    drawBackdrop(ctx, this.t);
    const T = this.tour;
    drawTitle(ctx, 'THE DRAW - ' + COURTS[T.court].name, 10);
    const colX = [20, 230, 430];
    const slotH = 38;
    const drawSlot = (id, x, y, won, lost, sc) => {
      const p = playerById(id);
      const isU = id === T.user;
      ctx.fillStyle = isU ? '#2a4a7f' : '#162c52'; ctx.fillRect(x, y, 170, 16);
      if (isU) { ctx.strokeStyle = COL.gold; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, 169, 15); }
      drawFlag(ctx, x + 4, y + 4, p.flag, 10, 7);
      const seed = T.seeds[id];
      drawText(ctx, (seed ? '[' + seed + '] ' : '') + p.short, x + 18, y + 5, { color: lost ? '#667' : isU ? COL.gold : '#fff' });
      if (sc) drawText(ctx, sc, x + 166, y + 5, { align: 'right', color: won ? COL.green : '#667' });
      if (lost) { ctx.fillStyle = COL.red; ctx.fillRect(x + 16, y + 8, 100, 1); }
    };
    for (let r = 0; r < 3; r++) {
      const ids = this.tourRoundPlayers(r);
      if (!ids) continue;
      const res = T.rounds[r];
      const n = ids.length;
      const gap = slotH * Math.pow(2, r);
      for (let i = 0; i < n; i++) {
        const y = 40 + (i + 0.5) * gap * (8 / n) / Math.pow(2, r) * Math.pow(2, r) / (8 / n) * (8 / n) / 1 - 0;
        const yy = 36 + i * (288 / n) + (288 / n) / 2 - 8;
        void y;
        const m = res ? res[Math.floor(i / 2)] : null;
        const won = m && m.winner === ids[i];
        const lost = m && m.winner !== ids[i];
        drawSlot(ids[i], colX[r], yy, won, lost, m && won ? m.score : '');
        if (i % 2 === 1) { ctx.fillStyle = 'rgba(255,255,255,0.3)'; const y0 = 36 + (i - 1) * (288 / n) + (288 / n) / 2; ctx.fillRect(colX[r] + 172, y0, 2, 288 / n); ctx.fillRect(colX[r] + 172, y0 + 144 / n, 26, 1); }
      }
      drawText(ctx, ['QUARTERFINALS', 'SEMIFINALS', 'FINAL'][r], colX[r] + 85, 28, { align: 'center', color: COL.dim });
    }
    if (T.champion) drawText(ctx, playerById(T.user).short, 620, 180, { align: 'right', color: COL.gold, scale: 2 });
    // trophy icon
    drawTrophy(ctx, 600, 120, 1);
    hint(ctx, T.champion ? 'SPACE: TROPHY CEREMONY' : 'SPACE: PLAY ' + ['QUARTERFINAL', 'SEMIFINAL', 'FINAL'][T.round] + '   ESC: QUIT TOURNAMENT');
  }

  // animation viewer: any stroke at any charge level, both views, both hands
  upd_viewer(dt) {
    const st = this.st;
    if (this.backPressed()) { this.go('practice_menu', { i: 2 }); return; }
    const kinds = VIEWER_KINDS;
    if (this.input.pressed('ArrowUp')) st.kind = (st.kind + kinds.length - 1) % kinds.length;
    if (this.input.pressed('ArrowDown')) st.kind = (st.kind + 1) % kinds.length;
    const hit = this.input.held('Space');
    if (st.phase === 'idle' && hit) { st.phase = 'back'; st.hold = 0; }
    if (st.phase === 'back') { st.hold += dt; if (!hit) { st.phase = 'fwd'; st.pt = 0; } }
    if (st.phase === 'fwd') { st.pt += dt; if (st.pt > 0.12) { st.phase = 'fol'; st.pt = 0; } }
    if (st.phase === 'fol') { st.pt += dt; if (st.pt > 0.6) st.phase = 'idle'; }
  }
  draw_viewer(ctx) {
    drawBackdrop(ctx, this.t);
    const st = this.st;
    const kd = VIEWER_KINDS[st.kind];
    const f = Math.min(1, st.hold / 1.0);
    const fill = 1 - Math.pow(1 - f, 1.7);
    const band = f < 0.2 ? 'touch' : f < 0.5 ? 'soft' : f < 0.85 ? 'firm' : st.hold > 1.25 ? 'over' : 'hard';
    const back = KEY[kd.back[band] || kd.back.firm];
    let pose = KEY.ready, label = 'READY';
    if (kd.clip) { const u = (this.t * 0.8) % 1; pose = u < 0.5 ? lerpPose(KEY[kd.clip[0]], KEY[kd.clip[1]], u * 2) : lerpPose(KEY[kd.clip[1]], KEY[kd.clip[0]], (u - 0.5) * 2); label = kd.name; }
    else if (st.phase === 'back') { pose = lerpPose(KEY[kd.unit || 'ready'], back, fill); label = kd.name + '.BACK.' + band.toUpperCase(); }
    else if (st.phase === 'fwd') { const b0 = lerpPose(KEY[kd.unit || 'ready'], back, fill); pose = lerpPose(b0, KEY[kd.contact], Math.min(1, st.pt / 0.12)); label = kd.name + '.SWING'; }
    else if (st.phase === 'fol') { pose = lerpPose(KEY[kd.contact], KEY[kd.follow[band] || kd.follow.firm], Math.min(1, st.pt / 0.35)); label = kd.name + '.FOLLOW.' + band.toUpperCase(); }
    const pl = playerById(this.sel.player);
    const looks = [[pl.look, 'back', 1, 'NEAR RIGHTY'], [pl.look, 'back', -1, 'NEAR LEFTY'], [pl.look, 'front', -1, 'FAR RIGHTY'], [pl.look, 'front', 1, 'FAR LEFTY']];
    looks.forEach(([lk, view, dom, name], i) => {
      const x = 90 + i * 150;
      ctx.fillStyle = 'rgba(70,140,60,0.5)'; ctx.fillRect(x - 60, 210, 120, 50);
      drawRig(ctx, x, 245, 72, pose, lk, view, dom, { t: this.t });
      drawText(ctx, name, x, 266, { align: 'center', color: COL.dim });
    });
    drawTitle(ctx, 'ANIMATION VIEWER', 10);
    drawText(ctx, label, W / 2, 34, { align: 'center', color: '#fff' });
    drawText(ctx, CATALOG_COUNT + ' NAMED ANIMATIONS IN THE CATALOG', W / 2, 46, { align: 'center', color: COL.dim });
    // meter
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(220, 290, 200, 8);
    ctx.fillStyle = band === 'over' ? '#ff3b3b' : '#ffd23f'; ctx.fillRect(220, 290, 200 * (st.phase === 'back' ? fill : 0), 8);
    hint(ctx, 'UP/DOWN: STROKE   HOLD SPACE: BACKSWING, RELEASE: SWING   ESC: BACK');
  }

      { key: 'closeCall', label: 'CLOSE-CALL REPLAY', value: onoff(s.closeCall) },

      { key: 'back', label: 'BACK' },
    ];
  }
  changeSetting(key, d) {
    const s = this.settings;
    const cyc = (arr, v) => arr[(arr.indexOf(v) + d + arr.length) % arr.length];
    if (key === 'chargeSpeed') s.chargeSpeed = cyc(['slow', 'normal', 'fast'], s.chargeSpeed);
    else if (['autoMove', 'landingMarker', 'ghost'].includes(key)) s[key] = cyc(['auto', 'on', 'off'], s[key]);
    else if (key.startsWith('vol')) s[key] = Math.max(0, Math.min(1, Math.round((s[key] + d * 0.1) * 10) / 10));
    else if (typeof s[key] === 'boolean') s[key] = !s[key];
    saveSettings(s);
    this.audio.applyVolumes();
    if (this.match) this.match.eff = effective(s, this.match.P.diff);
    this.audio.menuMove();
  }
  upd_settings() {
    const rows = this.settingRows();
    if (this.backPressed()) { this.audio.menuBack(); this.go(this.st.back || 'title'); return; }
    const ok = this.menuNav(rows.length);
    const r = rows[this.st.i];
    if (this.input.pressed('ArrowLeft')) r.key !== 'back' && this.changeSetting(r.key, -1);
    if (this.input.pressed('ArrowRight')) r.key !== 'back' && this.changeSetting(r.key, 1);
    if (ok) { if (r.key === 'back') { this.audio.menuBack(); this.go(this.st.back || 'title'); } else this.changeSetting(r.key, 1); }
  }
  draw_settings(ctx) {
    drawBackdrop(ctx, this.t);
    this.drawSettingsPanel(ctx, this.st.i);
  }
  drawSettingsPanel(ctx, sel) {
    drawTitle(ctx, 'SETTINGS', 8);
    drawPanel(ctx, 120, 28, 400, 314);
    const rows = this.settingRows();
    drawMenu(ctx, rows, sel, 150, 36, { lineH: 16, valueX: 330 });
    drawText(ctx, 'LEFT/RIGHT: CHANGE   ESC: BACK', W / 2, HGT - 12, { align: 'center', color: COL.dim });
  }

  // ---------------- overlays: pause, controls, stats ----------------
  updOverlay(dt) {
    const o = this.overlay;
    const I = this.input;
    if (o.kind === 'controls') { if (I.pressed('Escape', 'Space', 'Enter', 'Backspace')) this.overlay = o.back || null; return; }
    if (o.kind === 'stats') { if (I.pressed('Escape', 'Space', 'Enter', 'Backspace')) this.overlay = { kind: 'pause', i: 2 }; return; }
    if (o.kind === 'settings') {
      const rows = this.settingRows();
      if (I.pressed('Escape', 'Backspace')) { this.overlay = { kind: 'pause', i: 3 }; return; }
      if (I.pressed('ArrowUp')) o.i = (o.i + rows.length - 1) % rows.length;
      if (I.pressed('ArrowDown')) o.i = (o.i + 1) % rows.length;
      const r = rows[o.i];
      if (I.pressed('ArrowLeft') && r.key !== 'back') this.changeSetting(r.key, -1);
      if (I.pressed('ArrowRight') && r.key !== 'back') this.changeSetting(r.key, 1);
      if (I.pressed('Space', 'Enter')) { if (r.key === 'back') this.overlay = { kind: 'pause', i: 3 }; else this.changeSetting(r.key, 1); }
      return;
    }
    if (o.kind === 'pause') {
      const items = ['RESUME', 'CONTROLS', 'MATCH STATS', 'SETTINGS', 'QUIT MATCH'];
      if (I.pressed('ArrowUp')) { o.i = (o.i + items.length - 1) % items.length; this.audio.menuMove(); }
      if (I.pressed('ArrowDown')) { o.i = (o.i + 1) % items.length; this.audio.menuMove(); }
      if (I.pressed('Escape', 'KeyP')) { this.overlay = null; return; }
      if (I.pressed('Space', 'Enter')) {
        const c = items[o.i];
        this.audio.menuSelect();
        if (c === 'RESUME') this.overlay = null;
        if (c === 'CONTROLS') this.overlay = { kind: 'controls', back: o };
        if (c === 'MATCH STATS') this.overlay = { kind: 'stats' };
        if (c === 'SETTINGS') this.overlay = { kind: 'settings', i: 0 };
        if (c === 'QUIT MATCH') { this.overlay = null; this.match = null; this.go('title'); this.audio.startMusic(); }
        this.input.resetTaps();
      }
    }
  }
  drawOverlay(ctx) {
    const o = this.overlay;
    ctx.fillStyle = 'rgba(4,8,20,0.72)'; ctx.fillRect(0, 0, W, HGT);
    if (o.kind === 'pause') {
      drawTitle(ctx, 'PAUSED', 70);
      drawPanel(ctx, W / 2 - 80, 100, 160, 96);
      drawMenu(ctx, ['RESUME', 'CONTROLS', 'MATCH STATS', 'SETTINGS', 'QUIT MATCH'], o.i, W / 2, 110, { align: 'center', width: 140, lineH: 17 });
    } else if (o.kind === 'controls') drawControls(ctx);
    else if (o.kind === 'stats' && this.match) {
      const m = this.match.m;
      const stats = deriveStats(m.log);
      drawPanel(ctx, 140, 14, 360, 320);
      drawText(ctx, 'MATCH STATS', W / 2, 22, { align: 'center', color: COL.gold });
      drawText(ctx, m.players[0].data.short, 390, 36, { align: 'center' });
      drawText(ctx, m.players[1].data.short, 455, 36, { align: 'center' });
      statRows(stats, m, this.settings).forEach((r, i) => {
        const y = 50 + i * 14;
        drawText(ctx, r[0], 154, y, { color: COL.dim });
        drawText(ctx, r[1], 390, y, { align: 'center' });
        drawText(ctx, r[2], 455, y, { align: 'center' });
      });
    } else if (o.kind === 'settings') { this.drawSettingsPanel(ctx, o.i); }
  }
}

function statRows(stats, m, settings) {
  const S = stats.players;
  const sp = (v) => (settings.mph ? Math.round(v / 1.609) + ' MPH' : v + ' KM/H');
  return [
    ['ACES', S[0].aces, S[1].aces],
    ['DOUBLE FAULTS', S[0].doubleFaults, S[1].doubleFaults],
    ['1ST SERVE IN', S[0].firstPct + '%', S[1].firstPct + '%'],
    ['WON ON 1ST SERVE', S[0].firstWonPct + '%', S[1].firstWonPct + '%'],
    ['WON ON 2ND SERVE', S[0].secondWonPct + '%', S[1].secondWonPct + '%'],
    ['FASTEST SERVE', sp(S[0].fastestServe), sp(S[1].fastestServe)],
    ['WINNERS', S[0].winners, S[1].winners],
    ['UNFORCED ERRORS', S[0].unforced, S[1].unforced],
    ['FORCED ERRORS', S[0].forced, S[1].forced],
    ['BREAK POINTS WON', S[0].bpWon + '/' + S[0].bpChances, S[1].bpWon + '/' + S[1].bpChances],
    ['NET POINTS WON', S[0].netWon + '/' + S[0].netPoints, S[1].netWon + '/' + S[1].netPoints],
    ['TOTAL POINTS WON', S[0].pointsWon, S[1].pointsWon],
    ['PERFECT CONTACTS', S[0].perfect + ' (' + S[0].perfectPct + '%)', S[1].perfect + ' (' + S[1].perfectPct + '%)'],
    ['AVERAGE HOLD BAND', bandName(S[0].avgBand), bandName(S[1].avgBand)],
    ['LONGEST RALLY', stats.longest + ' SHOTS', ''],
    ['AVERAGE RALLY', stats.avgRally.toFixed(1) + ' SHOTS', ''],
  ].map((r) => r.map(String));
}

function drawControls(ctx) {
  drawPanel(ctx, 40, 14, 560, 332);
  drawText(ctx, 'CONTROLS', W / 2, 22, { align: 'center', scale: 2, color: COL.gold });
  // key diagram
  const key = (x, y, w, label, hl) => { ctx.fillStyle = hl ? '#ffd166' : '#e8e8e8'; ctx.fillRect(x, y, w, 16); ctx.fillStyle = '#555'; ctx.fillRect(x, y + 14, w, 2); drawText(ctx, label, x + w / 2, y + 4, { align: 'center', color: '#111' }); };
  key(90, 50, 16, '^'); key(72, 68, 16, '{'); key(90, 68, 16, '~'); key(108, 68, 16, '}');
  key(160, 68, 110, 'SPACE', true);
  drawText(ctx, 'MOVE / AIM', 98, 90, { align: 'center', color: '#fff' });
  drawText(ctx, 'HOLD = POWER', 215, 90, { align: 'center', color: COL.gold });
  drawText(ctx, 'RELEASE = HIT', 215, 100, { align: 'center', color: COL.gold });
  const lines = [
    'RALLY: HOLD SPACE AS THE BALL COMES. RELEASE TO SWING.',
    'THE ARROW HELD WHEN YOU RELEASE AIMS THE SHOT:',
    '  LEFT/RIGHT = SIDELINE   UP = DEEP   DOWN = SHORT ANGLE',
    'UP + TOUCH/SOFT VS A NET RUSHER = LOB.  DOWN + TOUCH = DROP SHOT.',
    'SERVE: TAP SPACE TO TOSS, THEN HOLD AND RELEASE AS THE BALL',
    '  STARTS TO FALL. HOLD FROM THE TOSS FOR A FULL-POWER SERVE.',
    '  HOLD LEFT OR RIGHT TO AIM AT THAT HALF OF THE SERVICE BOX.',
    'SHIFT: SPRINT   ESC/P: PAUSE   H: THIS PANEL   M: FULLSCREEN',
    '2 PLAYERS: P1 ARROWS + ENTER, P2 WASD + F + LEFT SHIFT',
  ];
  lines.forEach((l, i) => drawText(ctx, l, 70, 116 + i * 12, { color: i === 0 || i === 4 ? '#fff' : COL.dim }));
  // band table
  const bands = [['TOUCH', '< 0.20S', 'SAFE, LOOPY, SITS UP', '#9be564'], ['SOFT', '0.20-0.50S', 'COMPACT, RELIABLE', '#d7f75b'], ['FIRM', '0.50-0.85S', 'FULL SWING', '#ffd23f'], ['HARD', '0.85-1.00S', 'FAST, FLAT, RISKY', '#ff8c42'], ['OVER', '> 1.25S', 'WILD - NETS AND LONG BALLS', '#ff3b3b']];
  bands.forEach((b, i) => {
    const y = 234 + i * 12;
    ctx.fillStyle = b[3]; ctx.fillRect(70, y, 8, 7);
    drawText(ctx, b[0], 84, y, { color: '#fff' }); drawText(ctx, b[1], 130, y, { color: COL.dim }); drawText(ctx, b[2], 210, y, { color: COL.dim });
  });
  drawText(ctx, 'TIMING: PERFECT +-30MS, GOOD +-70MS, EARLY/LATE +-140MS', 70, 300, { color: '#8ecae6' });
  drawText(ctx, 'EARLY PULLS CROSS-COURT, LATE PUSHES IT THE OTHER WAY.', 70, 312, { color: '#8ecae6' });
  drawText(ctx, 'PRESS ESC TO CLOSE', W / 2, 330, { align: 'center', color: COL.dim });
}

function drawTrophy(ctx, x, y, s) {
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(x - 6 * s, y - 14 * s, 12 * s, 9 * s);
  ctx.fillRect(x - 9 * s, y - 13 * s, 3 * s, 5 * s); ctx.fillRect(x + 6 * s, y - 13 * s, 3 * s, 5 * s);
  ctx.fillRect(x - 2 * s, y - 5 * s, 4 * s, 4 * s);
  ctx.fillStyle = '#c99a2e'; ctx.fillRect(x - 5 * s, y - 1 * s, 10 * s, 3 * s);
  ctx.fillStyle = '#fff6d0'; ctx.fillRect(x - 4 * s, y - 13 * s, 2 * s, 5 * s);
}
