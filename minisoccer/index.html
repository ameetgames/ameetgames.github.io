<script type="text/plain" data-mod="ui/online.js">// Online lobby screen: name, create or join a room, pick sides, the host picks clubs and starts.
// The match itself runs through NetSession (src/net/session.js); main.js plays it.
import { HubLink, serverBase, wakeServer, newRoomCode, cleanCode, newId } from '@@net/hub.js@@';
import { NetSession } from '@@net/session.js@@';

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

export class OnlineLobby {
  /**
   * @param root   element to draw into
   * @param opts   { clubs, store, makeMatch(cfg), onStart(session, match, key), onReplace(match), onPause(on), onEnd(why), back() }
   */
  constructor(root, opts) {
    this.root = root; this.o = opts;
    this.session = null; this.code = null; this.status = ''; this.people = [];
    this.cfg = { home: opts.clubs.findIndex((c) => c.code === 'ARS'), away: opts.clubs.findIndex((c) => c.code === 'LIV'), half: 4, difficulty: 'pro', weather: 'clear' };
  }

  visible() { return !this.root.closest('.overlay')?.hidden; }

  get name() { return this.o.store.get('ms_name', '') || ''; }
  get server() { return this.o.store.get('ms_server', '') || ''; }

  open() { if (this.session) this.drawLobby(); else this.drawStart(); }

  drawStart() {
    this.root.innerHTML = `
      <div class="head"><h1>ONLINE</h1><a href="#" id="onBack">BACK</a></div>
      <div class="sub">Play with friends over the internet. One person creates a room and shares the code; up to four people can play, two per club. Empty sides are played by the CPU.</div>
      <div class="settings" style="max-width:520px">
        <label>YOUR NAME<input id="onName" maxlength="16" value="${esc(this.name)}" style="font:inherit;padding:6px;width:100%"></label>
        <label>ROOM CODE (TO JOIN)<input id="onCode" maxlength="8" style="font:inherit;padding:6px;width:100%;text-transform:uppercase"></label>
        <details style="margin-top:6px"><summary>Server</summary><input id="onServer" placeholder="default: the Mini2K server" value="${esc(this.server)}" style="font:inherit;padding:6px;width:100%"></details>
      </div>
      <div class="actions"><button id="onCreate">CREATE ROOM</button><button class="ghost" id="onJoin">JOIN</button></div>
      <div class="sub" id="onStatus" style="margin-top:10px">${esc(this.status)}</div>`;
    const $ = (id) => this.root.querySelector('#' + id);
    $('onBack').onclick = (e) => { e.preventDefault(); this.o.back(); };
    const save = () => { this.o.store.set('ms_name', $('onName').value.trim().slice(0, 16)); this.o.store.set('ms_server', $('onServer').value.trim()); };
    $('onCreate').onclick = () => { save(); this.connect(true, newRoomCode()); };
    $('onJoin').onclick = () => { save(); const c = cleanCode($('onCode').value); if (c.length < 4) return this.say('Type the room code your friend sent you.'); this.connect(false, c); };
  }

  say(t) { this.status = t; const el = this.root.querySelector('#onStatus'); if (el) el.textContent = t; }

  async connect(host, code) {
    const base = serverBase(this.server);
    this.say('Connecting to the server (it may take a minute to wake up)...');
    if (!(await wakeServer(base, 75000))) return this.say('Could not reach the server. Try again in a minute.');
    // a guest keeps its id for this tab, so reloading and joining again takes back the same seat
    let gid = null;
    try { gid = sessionStorage.getItem('ms_netid'); if (!gid) { gid = newId(); sessionStorage.setItem('ms_netid', gid); } } catch { gid = newId(); }
    const link = new HubLink('server', base, code, host ? 'host' : gid);
    try { await link.connect(); } catch (e) { return this.say(e.message); }
    this.code = code;
    const name = this.name || (host ? 'Host' : 'Guest');
    this.session = new NetSession(link, host, name, {
      makeMatch: (cfg) => this.o.makeMatch(cfg),
      onLobby: (people, cfg) => { this.people = people; if (cfg && !host) Object.assign(this.cfg, cfg); if (!this.session?.m && this.visible()) this.drawLobby(); },
      onStart: (cfg, m, key) => this.o.onStart(this.session, m, key),
      onReplace: (m) => this.o.onReplace(m),
      onPause: (on) => this.o.onPause(on),
      onStatus: (t) => this.o.onStatus?.(t),
      onClose: (why) => { this.session = null; this.status = typeof why === 'string' && why.length > 8 ? why : 'Disconnected.'; this.o.onEnd(this.status); },
    });
    if (host) { this.people = this.session.people; this.session.lobbyCfg = { ...this.cfg }; }
    this.drawLobby();
    if (!host) setTimeout(() => { if (this.session && !this.people.length) this.say('Waiting for the host... (check the code)'); }, 5000);
  }

  leave() { this.session?.close(); this.session = null; this.people = []; this.drawStart(); }

  drawLobby() {
    const s = this.session; if (!s) return this.drawStart();
    const clubs = this.o.clubs;
    const me = this.people.find((p) => p.id === s.id);
    const opt = (v, cur, label) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label)}</option>`;
    const clubSel = (id, cur) => `<select id="${id}" ${s.host ? '' : 'disabled'}>${clubs.map((c, i) => opt(i, cur, c.name)).join('')}</select>`;
    const side = (p) => p.side === 'home' ? clubs[this.cfg.home]?.short ?? 'HOME' : p.side === 'away' ? clubs[this.cfg.away]?.short ?? 'AWAY' : 'WATCHING';
    this.root.innerHTML = `
      <div class="head"><h1>ROOM <span style="color:var(--yel)">${esc(this.code)}</span></h1><a href="#" id="onLeave">LEAVE</a></div>
      <div class="sub">${s.host ? 'Send this code to your friends. Pick the clubs, then kick off.' : 'Waiting for the host to kick off.'}</div>
      <div class="settings" style="max-width:620px">
        <label>HOME CLUB${clubSel('onHome', this.cfg.home)}</label>
        <label>AWAY CLUB${clubSel('onAway', this.cfg.away)}</label>
        <label>HALF LENGTH<select id="onHalf" ${s.host ? '' : 'disabled'}>${[2, 3, 4, 5, 6, 8, 10].map((h) => opt(h, this.cfg.half, h + ' MIN')).join('')}</select></label>
        <label>CPU LEVEL<select id="onDiff" ${s.host ? '' : 'disabled'}>${[['easy', 'Super Easy'], ['rookie', 'Rookie'], ['pro', 'Pro'], ['world', 'World Class'], ['legend', 'Legend']].map(([v, l]) => opt(v, this.cfg.difficulty, l)).join('')}</select></label>
        <label>YOU PLAY FOR<select id="onSide">${opt('home', me?.side, 'Home club')}${opt('away', me?.side, 'Away club')}${opt('watch', me?.side, 'Just watch')}</select></label>
      </div>
      <div style="margin:10px 0">${this.people.map((p) => `<div>${esc(p.name)}${p.id === s.id ? ' (you)' : ''}${p.id === 'host' ? ' - host' : ''}: <b style="color:var(--yel)">${esc(side(p))}</b></div>`).join('') || '<div>Connecting...</div>'}</div>
      <div class="actions">${s.host ? '<button id="onGo">KICK OFF</button>' : ''}</div>
      <div class="sub" id="onStatus">${esc(this.status)}</div>`;
    const $ = (id) => this.root.querySelector('#' + id);
    $('onLeave').onclick = (e) => { e.preventDefault(); this.leave(); };
    $('onSide').onchange = () => s.setSide($('onSide').value);
    if (s.host) {
      const upd = () => { this.cfg.home = +$('onHome').value; this.cfg.away = +$('onAway').value; this.cfg.half = +$('onHalf').value; this.cfg.difficulty = $('onDiff').value; s.setLobbyCfg(this.cfg); this.drawLobby(); };
      for (const id of ['onHome', 'onAway', 'onHalf', 'onDiff']) $(id).onchange = upd;
      $('onGo').onclick = () => {
        if (this.cfg.home === this.cfg.away) return this.say('Pick two different clubs.');
        s.start({ ...this.cfg, seed: (Math.random() * 2 ** 31) | 0 });
      };
    }
  }
}
</script>
<script type="text/plain" data-mod="main.js">// MiniSoccer app: menus, match setup, the 60 Hz loop, input, sound and the coach menu.
import { loadData, pickLineup, teamRatings, chooseKits } from '@@engine/data.js@@';
import { Match } from '@@engine/live.js@@';
import { STEP } from '@@engine/pitch.js@@';
import { FORMATIONS, FORMATION_NAMES } from '@@engine/formations.js@@';
import { DIFFICULTY } from '@@engine/ai.js@@';
import { deriveStats } from '@@engine/boxscore.js@@';
import { Broadcast } from '@@render/broadcast.js@@';
import { CAMERAS } from '@@render/view.js@@';
import { Sound } from '@@render/audio.js@@';
import { Keyboard, PRESETS, padFrame, pads } from '@@input/keys.js@@';
import { loadPixelFonts } from '@@ui/pixelfont.js@@';
import { Commentary } from '@@ui/commentary.js@@';
import { Cup } from '@@ui/cup.js@@';
import { Drill, DRILLS } from '@@ui/practice.js@@';
import { Replay } from '@@render/replay.js@@';
import { OnlineLobby } from '@@ui/online.js@@';
import { makeOnlineMatch, stateHash } from '@@net/session.js@@';

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } },
};

const DEFAULTS = {
  half: 4, difficulty: 'pro', speed: 'normal', matchType: 'league', offsides: true, fouls: 'on', injuries: true, weather: 'clear', time: 'evening',
  camera: 'broadcast', radar: 'on', names: 'controlled', preset: 'classic', timed: true, passAssist: 'assisted', shotAssist: 'assisted', autoSwitch: 'air',
  audio: true, crowd: true, volume: 0.6, commentary: true, replays: true,
};
const settings = { ...DEFAULTS, ...store.get('ms_settings', {}) };
const saveSettings = () => store.set('ms_settings', settings);

const SETTING_ROWS = [
  ['half', 'Half length', [[2, '2 MIN'], [3, '3 MIN'], [4, '4 MIN'], [5, '5 MIN'], [6, '6 MIN'], [8, '8 MIN'], [10, '10 MIN']]],
  ['difficulty', 'Difficulty', Object.entries(DIFFICULTY).map(([k, v]) => [k, v.label])],
  ['speed', 'Game speed', [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast']]],
  ['matchType', 'Match type', [['league', 'League'], ['knockout', 'Knockout'], ['golden', 'Golden goal']]],
  ['offsides', 'Offsides', [[true, 'On'], [false, 'Off']]],
  ['fouls', 'Fouls', [['on', 'On'], ['lenient', 'Lenient'], ['strict', 'Strict'], ['off', 'Off']]],
  ['injuries', 'Injuries', [[true, 'On'], [false, 'Off']]],
  ['weather', 'Weather', [['clear', 'Clear'], ['cloudy', 'Cloudy'], ['rain', 'Rain'], ['snow', 'Snow'], ['random', 'Random']]],
  ['time', 'Time', [['day', 'Day'], ['evening', 'Evening'], ['night', 'Night']]],
  ['camera', 'Camera', Object.entries(CAMERAS).filter(([k]) => k !== 'pro').map(([k, v]) => [k, v.label])],
  ['radar', 'Radar', [['on', 'On'], ['transparent', 'Clear'], ['off', 'Off']]],
  ['names', 'Names', [['controlled', 'Mine'], ['off', 'Off']]],
  ['preset', 'Keys', [['classic', 'Classic'], ['mini2k', 'Mini2K']]],
  ['timed', 'Timed Finish', [[true, 'On'], [false, 'Off']]],
  ['passAssist', 'Passing', [['assisted', 'Assisted'], ['semi', 'Semi'], ['manual', 'Manual']]],
  ['autoSwitch', 'Auto switch', [['air', 'Air balls'], ['auto', 'Auto'], ['manual', 'Manual']]],
  ['commentary', 'Commentary', [[true, 'On'], [false, 'Off']]],
  ['replays', 'Goal replays', [[true, 'On'], [false, 'Off']]],
  ['audio', 'Sound', [[true, 'On'], [false, 'Off']]],
];

let DATA, clubs, byClub;
const kb = new Keyboard();
const sound = new Sound(settings);
const canvas = $('screen');
const bc = new Broadcast(canvas);
const replay = new Replay();
let replayDone = false;
let match = null, local = null, running = false, paused = false, mode = 'menu', comm = null, cup = null, drill = null;
let pick = { home: 0, away: 1, focus: 0 };
let net = null, lobby = null;   // online: the NetSession while a match runs, and the lobby screen

// ---------------------------------------------------------------- boot
async function boot() {
  await loadPixelFonts();
  DATA = await loadData();
  clubs = DATA.clubs;
  byClub = new Map(clubs.map((c) => [c.code, DATA.players.filter((p) => p.club === c.code)]));
  bc.appearance = DATA.appearance ?? {};
  const saved = store.get('ms_pick', null);
  if (saved && saved.home < clubs.length && saved.away < clubs.length) pick = { ...saved, focus: 0 };
  else pick = { home: clubs.findIndex((c) => c.code === 'ARS'), away: clubs.findIndex((c) => c.code === 'LIV'), focus: 0 };
  wireMenus();
  show('menu');
  requestAnimationFrame(loop);
}

function show(id) {
  for (const o of ['menu', 'setup', 'coach', 'cupView', 'online']) $(o).hidden = o !== id;
  kb.active = id === null;
}

// ---------------------------------------------------------------- menus
let setupKind = 'kick';
function wireMenus() {
  $('btnKick').onclick = () => openSetup('kick');
  $('btnLocal').onclick = () => openSetup('local');
  $('btnPens').onclick = () => openSetup('pens');
  $('btnPractice').onclick = () => openSetup('practice');
  $('btnWatch').onclick = () => openSetup('watch');
  $('btnCup').onclick = () => openCup();
  $('btnOnline').onclick = () => openOnline();
  $('lnkBack').onclick = (e) => { e.preventDefault(); show('menu'); };
  $('lnkControls').onclick = (e) => { e.preventDefault(); openControls(); };
  $('btnGo').onclick = () => startFromSetup();
  $('btnRandom').onclick = () => { pick.home = (Math.random() * clubs.length) | 0; do { pick.away = (Math.random() * clubs.length) | 0; } while (pick.away === pick.home); drawCards(); };
  $('btnLineup').onclick = () => openLineup();
  $('selSide').onchange = () => { settings.side = $('selSide').value; saveSettings(); };
  window.addEventListener('keydown', onKey);
  document.addEventListener('fullscreenchange', () => {});
}

function openSetup(kind) {
  setupKind = kind;
  $('setupTitle').textContent = { kick: 'KICK-OFF', local: 'LOCAL 2 PLAYERS', pens: 'PENALTY SHOOTOUT', practice: 'PRACTICE ARENA', watch: 'CPU VS CPU' }[kind];
  const sel = $('selSide');
  sel.value = kind === 'local' ? (settings.side === 'coop' ? 'coop' : 'both') : kind === 'watch' ? 'none' : (settings.side === 'away' ? 'away' : 'home');
  for (const o of sel.options) o.disabled = (kind === 'local' && !['both', 'coop'].includes(o.value)) || (kind === 'watch' && o.value !== 'none') || ((kind === 'kick' || kind === 'pens' || kind === 'practice') && !['home', 'away'].includes(o.value));
  $('drillRow').hidden = kind !== 'practice';
  $('btnGo').textContent = kind === 'watch' ? 'WATCH' : kind === 'pens' ? 'START SHOOTOUT' : kind === 'practice' ? 'PRACTICE' : 'KICK OFF';
  buildSettings();
  drawCards();
  show('setup');
  $('btnGo').focus();
}

function buildSettings() {
  const box = $('settingsBox');
  box.innerHTML = '';
  for (const [key, label, opts] of SETTING_ROWS) {
    const l = document.createElement('label');
    l.innerHTML = `<span>${label}</span>`;
    const s = document.createElement('select');
    for (const [v, t] of opts) { const o = document.createElement('option'); o.value = JSON.stringify(v); o.textContent = t; if (JSON.stringify(settings[key]) === o.value) o.selected = true; s.appendChild(o); }
    s.onchange = () => { settings[key] = JSON.parse(s.value); saveSettings(); sound.apply(); };
    l.appendChild(s);
    box.appendChild(l);
  }
}

function stars(ovr) { const s = Math.max(0.5, Math.min(5, (ovr - 62) / 5)); const full = Math.floor(s); return '*'.repeat(full) + (s - full >= 0.5 ? '+' : ''); }

function clubCard(el, idx, who) {
  const c = clubs[idx];
  const squad = byClub.get(c.code);
  const { lineup } = pickLineup(squad, c.formation);
  const r = teamRatings(squad, lineup, c.formation);
  const top = [...squad].sort((a, b) => b.ovr - a.ovr).slice(0, 3).map((p) => `${p.short} ${p.ovr}`).join(' · ');
  el.innerHTML = `<div class="who">${who}${pick.focus === (who === 'HOME' ? 0 : 1) ? ' <b style="color:var(--yel)">&lt; &gt;</b>' : ''}</div>
    <div class="nav"><button class="ghost" data-d="-1">&lt;</button><div class="roundel" style="background:${c.colors[0]};--ring:${c.colors[1]}">${c.code}</div><button class="ghost" data-d="1">&gt;</button></div>
    <div class="nm">${c.name}</div>
    <div class="stars">${stars(r.ovr)}</div>
    <div class="rt">OVR <b>${r.ovr}</b> &nbsp; ATT <b>${r.att}</b> &nbsp; MID <b>${r.mid}</b> &nbsp; DEF <b>${r.def}</b></div>
    <div class="rt">${c.formation} · ${c.stadium}</div>
    <div class="top">${top}</div>`;
  for (const b of el.querySelectorAll('button[data-d]')) b.onclick = () => { const k = who === 'HOME' ? 'home' : 'away'; pick[k] = (pick[k] + Number(b.dataset.d) + clubs.length) % clubs.length; pick.focus = k === 'home' ? 0 : 1; drawCards(); };
}

function drawCards() { clubCard($('cardH'), pick.home, 'HOME'); clubCard($('cardA'), pick.away, 'AWAY'); store.set('ms_pick', pick); }

function openControls() {
  const P = PRESETS[settings.preset] ?? PRESETS.classic;
  coachScreen('CONTROLS', [{ label: 'Classic', body: () => keysHtml(PRESETS.classic) }, { label: 'Mini2K-style', body: () => keysHtml(PRESETS.mini2k) }, { label: 'Gamepad', body: () => gamepadHtml() }, { label: '2 players', body: () => keysHtml(PRESETS.split1) + keysHtml(PRESETS.split2) }],
    [{ label: 'Back', fn: () => show(match && mode === 'match' ? null : 'menu') }], P === PRESETS.mini2k ? 1 : 0);
}

function keysHtml(P) {
  return `<h2>${P.label}</h2><div class="keys">${P.rows.map(([a, k]) => `<div class="krow"><b>${k}</b><span>${a}</span></div>`).join('')}</div>`;
}
function gamepadHtml() {
  const rows = [['Left stick', 'Move'], ['Right stick', 'Skill moves / directional switch'], ['A / Cross', 'Pass / contain'], ['B / Circle', 'Shoot / tackle'], ['X / Square', 'Lob, cross / slide'], ['Y / Triangle', 'Through ball / keeper rush'], ['LB / L1', 'Chip, lofted, one-two / switch'], ['RB / R1', 'Finesse, driven / teammate contain'], ['LT / L2', 'Jockey / shield'], ['RT / R2', 'Sprint'], ['R3', 'Take the keeper'], ['Start', 'Coach menu']];
  return `<h2>Gamepad</h2><div class="keys">${rows.map(([k, a]) => `<div class="krow"><b>${k}</b><span>${a}</span></div>`).join('')}</div>`;
}

// ---------------------------------------------------------------- match setup
function sideFor(c, kit, gkKit, opts = {}) {
  const squad = byClub.get(c.code);
  const formation = opts.formation ?? store.get(`ms_form_${c.code}`, null) ?? c.formation;
  const saved = store.get(`ms_lineup_${c.code}`, null);
  let { lineup, bench } = pickLineup(squad, formation);
  if (saved && saved.formation === formation && saved.lineup?.every((id) => squad.some((p) => p.id === id))) { lineup = saved.lineup; bench = saved.bench.filter((id) => squad.some((p) => p.id === id)); }
  return { club: c, squad, lineup, bench, formation, kit, gkKit, tactics: { ...c.style } };
}

function buildMatch(homeIdx, awayIdx, humans, extra = {}) {
  const h = clubs[homeIdx], a = clubs[awayIdx];
  const kits = chooseKits(h, a);
  const w = settings.weather === 'random' ? ['clear', 'clear', 'cloudy', 'rain', 'snow'][(Math.random() * 5) | 0] : settings.weather;
  const s = { ...settings, weather: w };
  const assist = { pass: settings.passAssist, shot: settings.shotAssist, timed: settings.timed, autoSwitch: settings.autoSwitch };
  const m = new Match({
    home: sideFor(h, kits.home, kits.homeGk), away: sideFor(a, kits.away, kits.awayGk),
    seed: (Math.random() * 2 ** 31) | 0,
    settings: { half: s.half, difficulty: s.difficulty, offsides: s.offsides, fouls: s.fouls, injuries: s.injuries, weather: w, matchType: extra.matchType ?? s.matchType },
    humans: humans.map((hh) => ({ ...hh, assist })),
    ...extra.matchOpts,
  });
  for (const t of m.teams) { t.captain = t.club.captain; }
  return { m, s };
}

function humansFor(side) {
  if (side === 'home') return [{ key: 'p1', team: 0 }];
  if (side === 'away') return [{ key: 'p1', team: 1 }];
  if (side === 'both') return [{ key: 'p1', team: 0 }, { key: 'p2', team: 1 }];
  if (side === 'coop') return [{ key: 'p1', team: 0 }, { key: 'p2', team: 0 }];
  return [];
}

function startFromSetup() {
  const side = $('selSide').value;
  if (setupKind === 'practice') return startPractice(side === 'away' ? pick.away : pick.home, $('selDrill').value);
  const humans = humansFor(side);
  const { m, s } = buildMatch(pick.home, pick.away, humans, setupKind === 'pens' ? { matchType: 'knockout' } : {});
  if (setupKind === 'pens') m.startShootout();
  startMatch(m, s, humans);
}

function startPractice(clubIdx, kind = 'free') {
  const c = clubs[clubIdx], opp = clubs[(clubIdx + 1) % clubs.length];
  const kits = chooseKits(c, opp);
  const home = sideFor(c, kits.home, kits.homeGk);
  const oppSide = sideFor(opp, kits.away, kits.awayGk);
  const n = DRILLS[kind]?.opp ?? 2;
  oppSide.lineup = oppSide.lineup.slice(0, 1 + n); oppSide.bench = [];
  const humans = [{ key: 'p1', team: 0 }];
  const m = new Match({ home, away: oppSide, seed: (Math.random() * 2 ** 31) | 0, settings: { half: 60, difficulty: settings.difficulty, offsides: false, fouls: 'off', injuries: false, weather: settings.weather === 'random' ? 'clear' : settings.weather, matchType: 'league' }, humans: humans.map((h) => ({ ...h, assist: { pass: settings.passAssist, shot: settings.shotAssist, timed: settings.timed, autoSwitch: settings.autoSwitch } })) });
  m.practice = true;
  startMatch(m, settings, humans);
  drill = new Drill(m, kind, 0, $('drill'));
  $('drill').hidden = false;
}

function startMatch(m, s, humans) {
  match = m;
  local = { humans, mine: humans.map((h) => h.key), team: humans[0]?.team ?? null, colorOf: (k) => humans.findIndex((h) => h.key === k) };
  bc.setup(m, { ...s, weather: m.settings.weather });
  bc.mentalityShow = 0;
  comm = new Commentary(m, (text) => settings.commentary && m.cue('commentary', { text }));
  drill = null; $('drill').hidden = true;
  replay.reset(); replayDone = false; bc.replayTag = false;
  bc.onCue = onCue;
  mode = 'match';
  running = true; paused = false;
  show(null);
  canvas.focus?.();
  sound.play('whistle', {});
}

// ---------------------------------------------------------------- loop
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  pollPads();
  if (match && mode === 'match' && net) {
    netFrame(dt);
    bc.render(dt, local);
    crowdSound();
  } else if (match && mode === 'match') {
    if (replay.playing) {
      if (!paused && !replay.frame(match, dt)) { bc.replayTag = false; match.goalT = Math.max(match.goalT ?? 0, (match.goalLen ?? 300) - 50); acc = 0; }
    } else if (running && !paused) {
      const sp = { slow: 0.8, normal: 1, fast: 1.25 }[settings.speed] ?? 1;
      acc += dt * sp;
      let n = 0;
      while (acc >= STEP && n < 8) {
        match.step(gatherInputs()); comm?.step(); drill?.step(); replay.record(match); acc -= STEP; n++;
        if (match.phase !== 'goal') replayDone = false;
        else if (!replayDone && match.goalT > 95 && settings.replays && !drill && !match.shootout) { replayDone = true; if (replay.start(match)) { bc.replayTag = true; break; } }
        if (afterStep()) break;
      }
    }
    bc.render(dt, local);
    crowdSound();
  } else if (!match) drawIdle(dt);
  requestAnimationFrame(loop);
}

function drawIdle() {
  const g = canvas.getContext('2d');
  g.fillStyle = '#0a150f'; g.fillRect(0, 0, 640, 360);
}

let padPrev = [];
function pollPads() {
  const list = pads();
  list.forEach((pd, i) => {
    const f = padFrame(pd);
    const prev = padPrev[i] ?? {};
    if (f.start && !prev.start && match && mode === 'match') togglePause();
    padPrev[i] = f;
  });
}

function gatherInputs() {
  const out = {};
  const list = pads().map(padFrame);
  const two = local.humans.length >= 2;
  for (const [i, h] of local.humans.entries()) {
    let f;
    if (!two) {
      f = kb.frame(settings.preset);
      const pf = list[0];
      if (pf && (pf.mx || pf.my || pf.b || pf.sx || pf.sy)) f = { mx: f.mx || pf.mx, my: f.my || pf.my, b: f.b | pf.b, sx: f.sx || pf.sx, sy: f.sy || pf.sy };
    } else {
      const pf = list[i];
      f = pf ?? kb.frame(i === 0 ? 'split1' : 'split2');
    }
    out[h.key] = f;
  }
  return out;
}

let shownPhase = null;
function afterStep() {
  const m = match;
  if (net && m.phase === 'halftime') return false;   // online: the host resumes for everyone after a short break
  if (m.phase === 'halftime' && shownPhase !== 'halftime') {
    shownPhase = 'halftime';
    if (local.humans.length === 0 && setupKind === 'watch') { /* show anyway for a moment */ }
    halfTimeScreen();
    return true;
  }
  if (m.phase === 'fulltime' && shownPhase !== 'fulltime') {
    shownPhase = 'fulltime';
    setTimeout(() => fullTimeScreen(), 900);
    return true;
  }
  if (m.phase !== 'halftime' && m.phase !== 'fulltime') shownPhase = null;
  return false;
}

// ---------------------------------------------------------------- sound
function onCue(f) {
  switch (f.type) {
    case 'kick': sound.play('kick', f); break;
    case 'touch': sound.play('touch'); break;
    case 'bounce': sound.play('bounce'); break;
    case 'header': sound.play('header'); break;
    case 'post': sound.play('post'); sound.play('groan'); break;
    case 'save': sound.play('save'); sound.play('cheer'); break;
    case 'catch': sound.play('catch'); break;
    case 'tackle': sound.play('tackle'); break;
    case 'slide': sound.play('slide'); break;
    case 'block': sound.play('block'); break;
    case 'whistle': if (!f.quiet) sound.play('whistle', f); break;
    case 'goal': sound.play('net'); sound.play('goal'); break;
    case 'card': sound.play('boo'); break;
    case 'timed': if (f.grade === 'perfect') sound.play('green'); break;
    case 'sub': sound.play('sub'); break;
    case 'skill': sound.play('touch'); break;
  }
}

let chantT = 0;
function crowdSound() {
  const m = match;
  if (!m) return;
  let lvl = 0.25;
  if (m.phase === 'live') {
    const own = m.owner ? m.teams[m.owner.team] : null;
    const adv = own ? (m.ball.x * own.dir + 52.5) / 105 : 0.5;
    lvl = 0.2 + Math.max(0, adv - 0.6) * 1.6;
  }
  if (m.phase === 'goal') lvl = 1;
  sound.crowd(Math.min(1, lvl), mode === 'match' && !paused);
  chantT += 1;
  if (chantT > 60 * 25 && m.phase === 'live') { chantT = 0; sound.play('chant'); }
}

// ---------------------------------------------------------------- keys
function onKey(e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (e.code === 'KeyM') { toggleFull(); return; }
  if (mode === 'menu' && !$('setup').hidden) {
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { const k = pick.focus === 0 ? 'home' : 'away'; pick[k] = (pick[k] + (e.code === 'ArrowRight' ? 1 : -1) + clubs.length) % clubs.length; drawCards(); e.preventDefault(); }
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { pick.focus = 1 - pick.focus; drawCards(); e.preventDefault(); }
    if (e.code === 'Escape') show('menu');
    return;
  }
  if (!match || mode !== 'match') return;
  if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); togglePause(); return; }
  if (paused) return;
  if (net && !['KeyH', 'Tab'].includes(e.code)) return;   // online: nothing local may change the shared game
  const t = local.team != null ? match.teams[local.team] : null;
  switch (e.code) {
    case 'KeyH': { const hk = $('hudKeys'); hk.hidden = !hk.hidden; if (!hk.hidden) hk.innerHTML = (PRESETS[settings.preset] ?? PRESETS.classic).rows.map(([a, k]) => `<div><b>${k}</b> ${a}</div>`).join(''); break; }
    case 'Tab': { e.preventDefault(); const cams = ['broadcast', 'tele', 'wide']; settings.camera = cams[(cams.indexOf(settings.camera) + 1) % cams.length]; saveSettings(); bc.setup(match, { ...settings, weather: match.settings.weather }); break; }
    case 'BracketLeft': case 'BracketRight': if (t) { t.mentality = Math.max(0, Math.min(4, t.mentality + (e.code === 'BracketRight' ? 1 : -1))); bc.mentalityShow = match.tick; } break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': {
      if (match.phase === 'goal') { const sp = match.byId.get(match.celebrator); if (sp?.act) sp.act.style = Number(e.code.slice(-1)); break; }
      if (!t) break;
      const att = match.owner && match.owner.team === t.idx;
      const key = att ? ['box', 'overlap', 'possession', 'long'][Number(e.code.slice(-1)) - 1] : ['press', 'trap', 'teampress', 'bus'][Number(e.code.slice(-1)) - 1];
      t.quick[key] = !t.quick[key];
      if (key === 'possession') t.tactics.possession = t.quick[key];
      if (key === 'teampress' && t.quick[key]) setTimeout(() => { if (match) t.quick.teampress = false; }, 30000);
      break;
    }
    case 'KeyT': if (t) { openCoach('subs'); } break;
    case 'Space': if (replay.playing) { replay.stop(match); bc.replayTag = false; match.goalT = Math.max(match.goalT ?? 0, (match.goalLen ?? 300) - 50); } else if (match.phase === 'goal') match.skipGoal = true; break;
  }
}

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {});
}

function togglePause() {
  if (net) { if (match.phase !== 'fulltime') net.requestPause(!net.paused); return; }
  if (paused) { paused = false; show(null); return; }
  openCoach('facts');
}

// ---------------------------------------------------------------- coach menu
function coachScreen(title, tabs, actions, startTab = 0, score = '') {
  $('coachTitle').textContent = title;
  $('coachScore').textContent = score;
  $('coachScore').hidden = !score;
  const tabsEl = $('coachTabs'), body = $('coachBody'), act = $('coachActions');
  tabsEl.innerHTML = ''; act.innerHTML = '';
  let cur = startTab;
  const render = () => {
    tabsEl.innerHTML = '';
    tabs.forEach((t, i) => { const b = document.createElement('button'); b.className = 'ghost' + (i === cur ? ' on' : ''); b.textContent = t.label; b.onclick = () => { cur = i; render(); }; tabsEl.appendChild(b); });
    body.innerHTML = '';
    const html = tabs[cur]?.body();
    if (typeof html === 'string') body.innerHTML = html; else if (html) body.appendChild(html);
    tabs[cur]?.after?.(body);
  };
  render();
  for (const a of actions) { const b = document.createElement('button'); b.textContent = a.label; if (a.ghost) b.className = 'ghost'; b.onclick = a.fn; act.appendChild(b); }
  show('coach');
  act.querySelector('button')?.focus();
}

function scoreText() { const m = match; return `${m.teams[0].club.code} ${m.teams[0].score} - ${m.teams[1].score} ${m.teams[1].club.code}`; }

function openCoach(tab = 'facts') {
  paused = true;
  const tabs = coachTabs();
  const idx = Math.max(0, tabs.findIndex((t) => t.id === tab));
  coachScreen('COACH', tabs, [
    { label: 'Resume', fn: () => { paused = false; show(null); } },
    { label: 'Restart', ghost: true, fn: () => { const humans = local.humans; const { m, s } = buildMatch(clubs.indexOf(match.teams[0].club), clubs.indexOf(match.teams[1].club), humans); if (setupKind === 'pens') m.startShootout(); startMatch(m, s, humans); } },
    { label: 'Quit', ghost: true, fn: () => quitToMenu() },
  ], idx, scoreText());
}

function coachTabs() {
  const tabs = [{ id: 'facts', label: 'Match facts', body: factsHtml }, { id: 'players', label: 'Player stats', body: playersHtml }];
  if (local.team != null) {
    tabs.push({ id: 'subs', label: 'Substitutions', body: () => subsEl(local.team) });
    tabs.push({ id: 'tactics', label: 'Tactics', body: () => tacticsEl(local.team) });
  }
  tabs.push({ id: 'keys', label: 'Controls', body: () => keysHtml(PRESETS[settings.preset] ?? PRESETS.classic) });
  return tabs;
}

function factsHtml() {
  const st = deriveStats(match);
  const [a, b] = st.teams;
  const row = (l, x, y) => `<tr><td>${x}</td><td>${l}</td><td>${y}</td></tr>`;
  const scorers = (ti) => st.scorers.filter((s) => s.team === ti).map((s) => `${match.byId.get(s.pid)?.short ?? '?'} ${s.min}'${s.own ? ' (OG)' : ''}${s.pen ? ' (P)' : ''}`).join('<br>');
  return `<div class="scoreline"><span>${match.teams[0].club.short}</span><span class="sc">${a.goals} - ${b.goals}</span><span>${match.teams[1].club.short}</span></div>
    ${match.shootout ? `<div class="sub" style="text-align:center">PENALTIES ${match.teams[0].pens ?? match.shootout.kicks[0].reduce((s, v) => s + v, 0)} - ${match.teams[1].pens ?? match.shootout.kicks[1].reduce((s, v) => s + v, 0)}</div>` : ''}
    <div class="scorers"><div>${scorers(0)}</div><div>${scorers(1)}</div></div>
    <table class="facts">${row('Possession', a.possession + '%', b.possession + '%')}${row('Shots', a.shots, b.shots)}${row('On target', a.onTarget, b.onTarget)}${row('Expected goals', a.xg.toFixed(2), b.xg.toFixed(2))}
    ${row('Passes', `${a.passOk}/${a.passes}`, `${b.passOk}/${b.passes}`)}${row('Pass accuracy', pct(a.passOk, a.passes), pct(b.passOk, b.passes))}${row('Tackles won', a.tacklesWon, b.tacklesWon)}${row('Interceptions', a.interceptions, b.interceptions)}
    ${row('Corners', a.corners, b.corners)}${row('Offsides', a.offsides, b.offsides)}${row('Fouls', a.fouls, b.fouls)}${row('Yellow cards', a.yellows, b.yellows)}${row('Red cards', a.reds, b.reds)}${row('Saves', a.saves, b.saves)}</table>
    ${shotMapHtml(st)}`;
}
const pct = (a, b) => (b ? Math.round(a / b * 100) + '%' : '-');

function shotMapHtml(st) {
  const c = document.createElement('canvas'); c.width = 210; c.height = 136;
  const g = c.getContext('2d');
  g.fillStyle = '#1f6b2e'; g.fillRect(0, 0, 210, 136);
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.strokeRect(1.5, 1.5, 207, 133); g.beginPath(); g.moveTo(105, 0); g.lineTo(105, 136); g.stroke();
  g.strokeRect(1.5, 68 - 40, 33, 80); g.strokeRect(210 - 34.5, 68 - 40, 33, 80);
  for (const s of st.shots) {
    const x = (s.x + 52.5) * 2, y = (s.y + 34) * 2;
    const r = 2 + s.xg * 8;
    g.fillStyle = s.outcome === 'goal' ? '#ffd84a' : s.outcome === 'saved' ? '#ffffff' : '#ff6a5a';
    g.globalAlpha = 0.85; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  }
  return `<h2 style="font:20px var(--px);color:var(--yel);margin-top:16px">SHOT MAP</h2><img class="shotmap" src="${c.toDataURL()}" alt="shot map"><div class="sub" style="text-align:center">YELLOW GOAL · WHITE SAVED · RED MISSED/BLOCKED · SIZE = XG</div>`;
}

function playersHtml() {
  const st = deriveStats(match);
  let html = '<table id="statTable"><tr><th></th><th>PLAYER</th><th>POS</th><th>MIN</th><th>G</th><th>A</th><th>SH</th><th>PAS</th><th>TKL</th><th>SV</th><th>RTG</th></tr>';
  for (const t of match.teams) {
    html += `<tr class="team"><th></th><th colspan="10">${t.club.name.toUpperCase()}</th></tr>`;
    for (const p of [...t.on, ...t.off, ...t.bench]) {
      const s = st.players.get(p.id) ?? {};
      const card = p.red ? ' <span style="color:#ff5a5a">R</span>' : p.yellow ? ' <span style="color:#ffd84a">Y</span>' : '';
      html += `<tr class="${p.onPitch ? 'on' : ''}"><td>${p.onPitch ? '>' : ''}</td><td>${p.num} ${p.short}${card}${p.id === st.potm ? ' *' : ''}</td><td>${p.pos}</td><td>${Math.round(p.mins)}</td><td>${s.goals ?? 0}</td><td>${s.assists ?? 0}</td><td>${s.shots ?? 0}</td><td>${s.passOk ?? 0}/${s.passes ?? 0}</td><td>${s.tackles ?? 0}</td><td>${s.saves ?? 0}</td><td>${p.entered != null ? (s.rating ?? 6).toFixed(1) : '-'}</td></tr>`;
    }
  }
  return html + '</table>';
}

function subsEl(team) {
  const t = match.teams[team];
  const wrap = document.createElement('div');
  const left = 5 - t.subsUsed - t.pendingSubs.length;
  wrap.innerHTML = `<div class="sub">Subs used ${t.subsUsed}/5 · windows ${t.windowsUsed}/3 · subs go on at the next stoppage${t.pendingSubs.length ? ` · ${t.pendingSubs.length} waiting` : ''}</div>`;
  const tbl = document.createElement('table'); tbl.id = 'subTable';
  tbl.innerHTML = '<tr><th>ON THE PITCH</th><th>STAMINA</th><th>SUB ON</th></tr>';
  for (const p of t.on.filter((q) => q.onPitch)) {
    const tr = document.createElement('tr');
    const pend = t.pendingSubs.find((s) => s.off === p.id);
    tr.innerHTML = `<td>${p.num} ${p.short} <span class="tag2">${p.pos}</span></td><td class="${p.stamina < 0.5 ? 'low' : ''}">${Math.round(p.stamina * 100)}%</td>`;
    const td = document.createElement('td');
    if (pend) td.textContent = '< ' + match.byId.get(pend.on)?.short;
    else if (left > 0) {
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">-</option>' + t.bench.filter((b) => !t.pendingSubs.some((s) => s.on === b.id)).map((b) => `<option value="${b.id}">${b.num} ${b.short} (${b.data.pos.join('/')} ${b.data.ovr})</option>`).join('');
      sel.onchange = () => { if (sel.value) { match.requestSub(team, p.id, sel.value); t.autoSubs = false; openCoach('subs'); } };
      td.appendChild(sel);
    }
    tr.appendChild(td);
    tbl.appendChild(tr);
  }
  wrap.appendChild(tbl);
  const auto = document.createElement('label'); auto.className = 'auto';
  auto.innerHTML = `<input type="checkbox" ${t.autoSubs ? 'checked' : ''}> AI makes my subs`;
  auto.querySelector('input').onchange = (e) => { t.autoSubs = e.target.checked; };
  wrap.appendChild(auto);
  return wrap;
}

function tacticsEl(team) {
  const t = match.teams[team];
  const wrap = document.createElement('div');
  wrap.className = 'settings';
  const mk = (label, opts, cur, fn) => { const l = document.createElement('label'); l.innerHTML = `<span>${label}</span>`; const s = document.createElement('select'); for (const [v, tx] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = tx; if (String(v) === String(cur)) o.selected = true; s.appendChild(o); } s.onchange = () => fn(s.value); l.appendChild(s); wrap.appendChild(l); };
  mk('Formation', FORMATION_NAMES.map((f) => [f, f]), t.formation, (v) => { setFormation(t, v); });
  mk('Mentality', [[0, 'Ultra defensive'], [1, 'Defensive'], [2, 'Balanced'], [3, 'Attacking'], [4, 'Ultra attacking']], t.mentality, (v) => { t.mentality = Number(v); });
  for (const [k, l] of [['box', 'Get in the box'], ['overlap', 'Overlap'], ['possession', 'Possession'], ['long', 'Long ball'], ['press', 'High press'], ['trap', 'Offside trap'], ['bus', 'Park the bus']]) {
    mk(l, [[0, 'Off'], [1, 'On']], t.quick[k] ? 1 : 0, (v) => { t.quick[k] = v === '1'; if (k === 'possession') t.tactics.possession = t.quick[k]; });
  }
  return wrap;
}

function setFormation(t, f) {
  t.formation = f; t.slots = FORMATIONS[f];
  for (const p of t.on) if (p.slot != null && p.onPitch) p.pos = t.slots[p.slot][0];
  store.set(`ms_form_${t.club.code}`, f);
}

function openLineup() {
  const c = clubs[$('selSide').value === 'away' ? pick.away : pick.home];
  const squad = byClub.get(c.code);
  let formation = store.get(`ms_form_${c.code}`, null) ?? c.formation;
  let { lineup, bench } = sideFor(c, null, null);
  const render = () => {
    const slots = FORMATIONS[formation];
    const wrap = document.createElement('div');
    const fsel = `<label class="row"><span>FORMATION</span><select id="lfForm">${FORMATION_NAMES.map((f) => `<option ${f === formation ? 'selected' : ''}>${f}</option>`).join('')}</select></label>`;
    const rows = slots.map((s, i) => {
      const p = squad.find((q) => q.id === lineup[i]);
      return `<tr><td><span class="tag2">${s[0]}</span></td><td><select data-slot="${i}">${squad.map((q) => `<option value="${q.id}" ${q.id === lineup[i] ? 'selected' : ''}>${q.num} ${q.short} (${q.pos.join('/')} ${q.ovr})${q.available === false ? ' INJ' : ''}</option>`).join('')}</select></td><td>${p ? p.ovrs?.[s[0]] ?? p.ovr : ''}</td></tr>`;
    }).join('');
    wrap.innerHTML = `${fsel}<table id="subTable"><tr><th>SLOT</th><th>PLAYER</th><th>OVR HERE</th></tr>${rows}</table>`;
    return wrap;
  };
  const save = () => { const used = new Set(lineup); bench = squad.filter((p) => !used.has(p.id)).sort((a, b) => b.ovr - a.ovr).slice(0, 9).map((p) => p.id); store.set(`ms_lineup_${c.code}`, { formation, lineup, bench }); store.set(`ms_form_${c.code}`, formation); };
  coachScreen(`${c.short.toUpperCase()} LINEUP`, [{ label: 'Lineup', body: render, after: (body) => {
    body.querySelector('#lfForm').onchange = (e) => { formation = e.target.value; ({ lineup, bench } = pickLineup(squad, formation)); save(); openLineupRefresh(); };
    for (const s of body.querySelectorAll('select[data-slot]')) s.onchange = () => { const i = Number(s.dataset.slot); const other = lineup.indexOf(s.value); if (other >= 0) lineup[other] = lineup[i]; lineup[i] = s.value; save(); openLineupRefresh(); };
  } }], [{ label: 'Done', fn: () => { save(); show('setup'); } }, { label: 'Best XI', ghost: true, fn: () => { ({ lineup, bench } = pickLineup(squad, formation)); save(); openLineupRefresh(); } }]);
  function openLineupRefresh() { const b = $('coachBody'); b.innerHTML = ''; b.appendChild(render()); coachScreenAfter(); }
  function coachScreenAfter() {
    const body = $('coachBody');
    body.querySelector('#lfForm').onchange = (e) => { formation = e.target.value; ({ lineup, bench } = pickLineup(squad, formation)); save(); openLineupRefresh(); };
    for (const s of body.querySelectorAll('select[data-slot]')) s.onchange = () => { const i = Number(s.dataset.slot); const other = lineup.indexOf(s.value); if (other >= 0) lineup[other] = lineup[i]; lineup[i] = s.value; save(); openLineupRefresh(); };
  }
}

function halfTimeScreen() {
  paused = true;
  const m = match;
  const label = m.period === 1 ? 'HALF-TIME' : m.period === 2 ? 'FULL-TIME: EXTRA TIME NEXT' : m.period === 3 ? 'EXTRA TIME: HALF-TIME' : 'BREAK';
  const tabs = coachTabs();
  coachScreen(label, tabs, [
    { label: m.period === 1 ? 'Second half' : 'Continue', fn: () => { m.resume(); paused = false; show(null); } },
    { label: 'Quit', ghost: true, fn: () => quitToMenu() },
  ], 0, scoreText());
}

function fullTimeScreen() {
  paused = true;
  const st = deriveStats(match);
  const potm = match.byId.get(st.potm);
  const tabs = [{ label: 'Result', body: () => factsHtml() + (potm ? `<div class="sub" style="margin-top:14px">PLAYER OF THE MATCH: <b style="color:var(--yel)">${potm.name}</b> (${(st.players.get(potm.id)?.rating ?? 6).toFixed(1)})</div>` : '') }, { label: 'Player ratings', body: playersHtml }];
  const actions = [];
  if (net) {
    actions.push({ label: 'Back to the room', fn: () => backToRoom() });
    actions.push({ label: 'Leave', ghost: true, fn: () => quitToMenu() });
  } else if (cup && cup.pending) actions.push({ label: 'Back to the cup', fn: () => { cup.recordUserResult(match); match = null; mode = 'menu'; openCup(); } });
  else {
    actions.push({ label: 'Rematch', fn: () => { const humans = local.humans; const { m, s } = buildMatch(clubs.indexOf(match.teams[0].club), clubs.indexOf(match.teams[1].club), humans); if (setupKind === 'pens') m.startShootout(); startMatch(m, s, humans); } });
    actions.push({ label: 'Main menu', ghost: true, fn: () => quitToMenu() });
  }
  coachScreen('FULL-TIME', tabs, actions, 0, scoreText());
}

function quitToMenu() {
  if (net) { lobby?.leave(); net = null; }
  drill = null; $('drill').hidden = true;
  match = null; mode = 'menu'; paused = false; running = false;
  sound.crowd(0, false);
  show('menu');
}

// ---------------------------------------------------------------- cup
function openCup() {
  if (!cup) cup = new Cup(clubs, store, { sim: simMatch });
  mode = 'menu';
  $('cupBody').innerHTML = '';
  $('cupBody').appendChild(cup.view({
    play: (homeIdx, awayIdx, userTeam) => {
      const humans = [{ key: 'p1', team: userTeam }];
      const { m, s } = buildMatch(homeIdx, awayIdx, humans, { matchType: 'knockout' });
      setupKind = 'cup';
      startMatch(m, s, humans);
    },
    back: () => show('menu'),
    refresh: () => openCup(),
    clubIdx: (code) => clubs.findIndex((c) => c.code === code),
  }));
  show('cupView');
}

/** Headless whole-match sim (CPU vs CPU) for cup results and instant results. */
function simMatch(homeIdx, awayIdx, knockout = true) {
  const { m } = buildMatch(homeIdx, awayIdx, [], { matchType: knockout ? 'knockout' : 'league' });
  m.settings.half = 3;
  let n = 0;
  while (m.phase !== 'fulltime' && n < 60 * 60 * 40) { m.step({}); if (m.phase === 'halftime') m.resume(); n++; }
  const st = deriveStats(m);
  return { score: [m.teams[0].score, m.teams[1].score], pens: m.shootout ? [m.teams[0].pens, m.teams[1].pens] : null, winner: m.shootout ? m.shootout.winner : (m.teams[0].score > m.teams[1].score ? 0 : 1), scorers: st.scorers.map((s) => ({ ...s, name: m.byId.get(s.pid)?.short })) };
}

window.__ms = { get match() { return match; }, settings, startFromSetup, openSetup, pick, clubs: () => clubs };
boot().catch((e) => { $('err').textContent = 'Error: ' + e.message; console.error(e); });

// ---------------------------------------------------------------- online
function openOnline() {
  if (!lobby) lobby = new OnlineLobby($('onlineBody'), {
    clubs, store,
    makeMatch: (cfg) => {
      const h = clubs[cfg.home], a = clubs[cfg.away];
      const kits = chooseKits(h, a);
      const side = (c, kit, gkKit) => { const squad = byClub.get(c.code); const { lineup, bench } = pickLineup(squad, c.formation); return { club: c, squad, lineup, bench, formation: c.formation, kit, gkKit, tactics: { ...c.style } }; };
      const m = makeOnlineMatch(cfg, { home: side(h, kits.home, kits.homeGk), away: side(a, kits.away, kits.awayGk) });
      for (const t of m.teams) t.captain = t.club.captain;
      return m;
    },
    onStart: (session, m, key) => startNetMatch(session, m, key),
    onReplace: (m) => { match = m; bc.m = m; m.fx.length = 0; comm = new Commentary(m, (text) => settings.commentary && m.cue('commentary', { text })); comm.i = m.events.length; shownPhase = m.phase; },
    onPause: (on) => netPause(on),
    onStatus: (t) => { bc.netStatus = t; },
    onEnd: (why) => { if (net) { net = null; match = null; mode = 'menu'; paused = false; running = false; sound.crowd(0, false); } show('online'); lobby.drawStart(); lobby.say(why); },
    back: () => show('menu'),
  });
  show('online');
  lobby.open();
}

function startNetMatch(session, m, key) {
  const seat = session.seats.find((s) => s.key === key);
  const humans = seat ? [{ key, team: seat.team }] : [];
  startMatch(m, { ...settings, weather: m.settings.weather }, humans);
  local.colorOf = (k) => session.seats.findIndex((s) => s.key === k);
  local.mine = key ? [key] : [];
  net = session; acc = 0; shownPhase = null;
  bc.netStatus = '';
}

function netFrame(dt) {
  const mine = () => (local.humans.length ? gatherInputs()[local.humans[0].key] : null);
  if (net.host) {
    if (!net.paused && match.phase !== 'fulltime') {
      acc += dt;
      let n = 0;
      while (acc >= STEP && n++ < 8) { net.hostStep(mine()); comm?.step(); acc -= STEP; }
      if (acc > STEP * 8) acc = 0;
      net.flush();
    }
  } else {
    net.guestFrame(dt, () => mine() ?? {});
    if (net.m !== match) lobby.o.onReplace(net.m);
    comm?.step();
  }
  afterStep();
}

function netPause(on) {
  paused = on;
  if (!match || match.phase === 'fulltime') return;
  if (on) coachScreen('PAUSED', [{ label: 'Match facts', body: () => factsHtml() }], [
    { label: 'Resume', fn: () => net?.requestPause(false) },
    { label: 'Leave', ghost: true, fn: () => quitToMenu() },
  ], 0, scoreText());
  else show(null);
}

function backToRoom() {
  const s = net; net = null;
  match = null; mode = 'menu'; paused = false; running = false; sound.crowd(0, false);
  if (s) s.m = null;
  show('online');
  lobby.drawLobby();
}
// debugging aid for tests: where this screen's copy of the online match is
window.__msNet = () => (net && match ? { host: net.host, tick: match.tick, phase: match.phase, buf: net.buf?.length, waiting: net.waiting, same: net.m === match, hash: stateHash(match), score: [match.teams[0].score, match.teams[1].score], stats: net.stats } : null);
</script>

const urls = {};
for (const el of document.querySelectorAll('script[data-mod]')) {
  const code = el.textContent.replace(/@@([^@]+)@@/g, (_, m) => urls[m]);
  urls[el.dataset.mod] = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
}
import(urls['main.js']).catch((e) => { document.getElementById('err').textContent = 'Error: ' + e.message; });
