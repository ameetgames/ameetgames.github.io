<script type="text/plain" data-mod="ui/commentary.js">// Text commentary: reads new entries from the match event log and emits short lines through a callback.
// Pure presentation; never touches match state. Uses its own tiny RNG so it does not disturb the engine.

const LINES = {
  kickoff1: ['And we are under way at {stadium}!', "{home} get us started. Here we go!", 'The referee blows and this one is up and running.'],
  kickoff2: ['The second half is under way.', 'Back out they come. Second half, {score}.'],
  kickoffET: ['Extra time begins. Thirty more minutes.'],
  goal: ['GOAL! {name} scores for {team}!', '{name}! What a finish! {score}.', "It's in! {name} for {team}!", '{name} finds the net! {score}.'],
  goalLong: ['From distance! {name} lets fly and it flies in!', 'Unstoppable from {name}, from all of {dist} metres!'],
  goalHead: ['A towering header from {name}!', '{name} rises highest and nods it home!'],
  goalPen: ['{name} sends the keeper the wrong way. {score}.', 'Penalty converted, calmly, by {name}.'],
  goalFk: ['Over the wall and in! A beauty of a free kick from {name}!'],
  goalOwn: ['Oh dear. An own goal from {name}. {score}.', 'Into his own net goes {name}. Nightmare.'],
  assist: ['Lovely work from {name} to set that up.', 'The assist from {name}, and what a ball it was.'],
  save: ['Good save by {name}!', '{name} gets down well to keep it out.', 'Denied by {name}!'],
  saveBig: ['What a stop from {name}! How did he keep that out?', 'A superb reflex save from {name}!'],
  miss: ['{name} drags it wide.', 'Off target from {name}.', '{name} should have done better there.', 'Over the bar from {name}.'],
  missBig: ['How has {name} missed that?!', 'A glorious chance, and {name} puts it wide!'],
  post: ['Off the woodwork!', 'It rattles the frame of the goal!'],
  block: ['Blocked by {name}!', '{name} throws himself in the way.'],
  yellow: ['{name} goes into the book.', 'A yellow card for {name}.'],
  second: ['A second yellow for {name}, and he has to go!'],
  red: ['Straight red! {name} is sent off!', 'Off goes {name}. {team} down to ten.'],
  penalty: ['PENALTY! The referee points to the spot!', "It's a penalty to {team}!"],
  offside: ['The flag is up. {name} was offside.', 'Offside against {name}.'],
  corner: ['Corner to {team}.', '{team} win a corner.'],
  sub: ['A change for {team}: {on} comes on for {off}.'],
  injury: ['{name} is down and looks hurt.'],
  added: ['The fourth official shows {mins} minutes of added time.'],
  halftime: ["That's half-time. {score}.", 'The referee blows for the break. {score}.'],
  fulltime: ["It's all over! {score}.", 'Full-time at {stadium}. {score}.'],
  shootout: ['So it comes down to penalties.', 'Penalties to decide it. Nerves of steel needed.'],
  shootScored: ['{name} scores.', 'Tucked away by {name}.'],
  shootMissed: ['{name} misses!', 'Saved! {name} is denied.'],
  shootEnd: ['{team} win it on penalties!'],
  spell: ['{team} are well on top here.', 'Plenty of possession for {team} in this spell.', '{team} are pinning them back.'],
};

export class Commentary {
  constructor(m, emit) {
    this.m = m; this.emit = emit;
    this.i = 0; this.cool = 0; this.seed = 1234567;
    this.last = new Map();
    this.quietTicks = 0;
  }

  rnd() { this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff; return this.seed / 0x7fffffff; }

  pick(key, vars) {
    const arr = LINES[key]; if (!arr) return null;
    let k = Math.floor(this.rnd() * arr.length);
    if (arr.length > 1 && this.last.get(key) === k) k = (k + 1) % arr.length;
    this.last.set(key, k);
    return arr[k].replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
  }

  say(key, vars = {}, prio = 1) {
    if (prio < 2 && this.cool > 0) return;
    const text = this.pick(key, { ...this.base(), ...vars });
    if (!text) return;
    this.emit(text);
    this.cool = prio >= 2 ? 120 : 200;
    this.quietTicks = 0;
  }

  base() {
    const m = this.m, [a, b] = m.teams;
    return { home: a.club.short ?? a.club.name, away: b.club.short ?? b.club.name, stadium: a.club.stadium ?? 'the stadium', score: `${a.club.code ?? a.club.short} ${a.score}-${b.score} ${b.club.code ?? b.club.short}` };
  }

  nm(id) { const p = this.m.byId.get(id); return p ? (p.short ?? p.name) : 'him'; }
  tm(i) { const c = this.m.teams[i]?.club; return c ? (c.short ?? c.name) : ''; }

  step() {
    const ev = this.m.events;
    if (this.cool > 0) this.cool--;
    this.quietTicks++;
    while (this.i < ev.length) {
      const e = ev[this.i++];
      this.onEvent(e, ev);
    }
    if (this.quietTicks > 60 * 40 && this.m.phase === 'live') {
      const t = this.m.teams, pt = t[0].possTicks + t[1].possTicks;
      if (pt > 600) {
        const lead = t[0].possTicks / pt > 0.5 ? 0 : 1;
        this.say('spell', { team: this.tm(lead) }, 0);
      }
      this.quietTicks = 0;
    }
    this.tick();
  }

  onEvent(e, ev) {
    switch (e.type) {
      case 'kickoff':
        if (e.period === 1 && e.t < 1) this.say('kickoff1', {}, 2);
        else if (e.period === 2 && this.m.time < 1) this.say('kickoff2', {}, 2);
        else if (e.period === 3 && this.m.time < 1) this.say('kickoffET', {}, 2);
        break;
      case 'goal': {
        const v = { name: this.nm(e.pid), team: this.tm(e.team) };
        const shot = [...ev].reverse().find((s) => s.type === 'shot' && s.pid === e.pid);
        let key = 'goal';
        if (e.own) key = 'goalOwn';
        else if (e.setPiece === 'penalty') key = 'goalPen';
        else if (e.setPiece === 'freekick') key = 'goalFk';
        else if (e.kind === 'header') key = 'goalHead';
        else if (shot && shot.dist > 22) { key = 'goalLong'; v.dist = shot.dist; }
        this.say(key, v, 3);
        if (e.assist && !e.own) this.queued = { key: 'assist', vars: { name: this.nm(e.assist) }, at: 150 };
        break;
      }
      case 'save': {
        const shot = [...ev].reverse().find((s) => s.type === 'shot' && s.pid === e.shooter);
        this.say(shot && shot.xg > 0.3 ? 'saveBig' : 'save', { name: this.nm(e.pid) }, 1);
        break;
      }
      case 'shot': this.pendingShot = { e, ticks: 70 }; break;
      case 'woodwork': this.say('post', {}, 2); this.pendingShot = null; break;
      case 'block': this.say('block', { name: this.nm(e.pid) }, 1); this.pendingShot = null; break;
      case 'card':
        this.say(e.card === 'Y' ? 'yellow' : e.second ? 'second' : 'red', { name: this.nm(e.pid), team: this.tm(e.team) }, 2);
        break;
      case 'penalty_given': this.say('penalty', { team: this.tm(e.team) }, 3); break;
      case 'offside': this.say('offside', { name: this.nm(e.pid) }, 1); break;
      case 'corner': this.say('corner', { team: this.tm(e.team) }, 0); break;
      case 'sub': this.say('sub', { team: this.tm(e.team), on: this.nm(e.on), off: this.nm(e.off) }, 1); break;
      case 'injury': this.say('injury', { name: this.nm(e.pid) }, 1); break;
      case 'added': this.say('added', { mins: e.mins }, 2); break;
      case 'period_end': if (e.period === 1) this.say('halftime', {}, 3); break;
      case 'fulltime': this.say('fulltime', {}, 3); break;
      case 'shootout_start': this.say('shootout', {}, 3); break;
      case 'shootout_kick': this.say(e.scored ? 'shootScored' : 'shootMissed', { name: this.nm(e.pid) }, 2); break;
      case 'shootout_end': this.say('shootEnd', { team: this.tm(e.winner) }, 3); break;
    }
    if (e.type === 'goal' || e.type === 'save') this.pendingShot = null;
  }

  /** Called every engine step; handles delayed lines (missed shots, assists). */
  tick() {
    if (this.pendingShot && --this.pendingShot.ticks <= 0) {
      const e = this.pendingShot.e; this.pendingShot = null;
      this.say(e.xg > 0.35 ? 'missBig' : 'miss', { name: this.nm(e.pid) }, e.xg > 0.35 ? 2 : 0);
    }
    if (this.queued && --this.queued.at <= 0) { const q = this.queued; this.queued = null; this.say(q.key, q.vars, 2); }
  }
}
</script>
<script type="text/plain" data-mod="ui/cup.js">// The Cup: an 8- or 16-club knockout. The user's ties are played; every other tie is simulated
// headlessly by the real engine (opts.sim). Saved to localStorage after every change.

const ROUND_NAMES = { 16: 'Round of 16', 8: 'Quarter-finals', 4: 'Semi-finals', 2: 'Final' };
const KEY = 'ms_cup';

export class Cup {
  constructor(clubs, store, opts) {
    this.clubs = clubs; this.store = store; this.sim = opts.sim;
    this.state = store.get(KEY, null);
    if (this.state && !this.state.rounds) this.state = null;
    this.pending = false;
  }

  save() { this.store.set(KEY, this.state); }
  idx(code) { return this.clubs.findIndex((c) => c.code === code); }
  club(code) { return this.clubs[this.idx(code)]; }

  start(userCode, size) {
    const codes = this.clubs.map((c) => c.code).filter((c) => c !== userCode);
    // seeded shuffle from the current time; the draw itself does not need to be reproducible
    let s = (Date.now() & 0x7fffffff) || 1;
    const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = codes.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [codes[i], codes[j]] = [codes[j], codes[i]]; }
    const field = [userCode, ...codes.slice(0, size - 1)];
    for (let i = field.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [field[i], field[j]] = [field[j], field[i]]; }
    const ties = [];
    for (let i = 0; i < field.length; i += 2) ties.push({ h: field[i], a: field[i + 1], res: null });
    this.state = { user: userCode, size, rounds: [ties], champion: null, out: false };
    this.save();
  }

  get round() { return this.state.rounds[this.state.rounds.length - 1]; }
  userTie() { return this.round.find((t) => (t.h === this.state.user || t.a === this.state.user) && !t.res); }

  /** Store a tie result: {score:[h,a], pens:[h,a]|null, winner:0|1, scorers}. */
  setResult(tie, res) { tie.res = { score: res.score, pens: res.pens ?? null, winner: res.winner, scorers: (res.scorers ?? []).slice(0, 8) }; }

  simOthers() {
    for (const t of this.round) if (!t.res) this.setResult(t, this.sim(this.idx(t.h), this.idx(t.a), true));
  }

  advance() {
    const st = this.state;
    if (this.round.some((t) => !t.res)) return;
    const winners = this.round.map((t) => (t.res.winner === 0 ? t.h : t.a));
    if (!winners.includes(st.user)) st.out = true;
    if (winners.length === 1) { st.champion = winners[0]; this.save(); return; }
    const next = [];
    for (let i = 0; i < winners.length; i += 2) next.push({ h: winners[i], a: winners[i + 1], res: null });
    st.rounds.push(next);
    // once the user is out, play the rest of the cup out instantly
    if (st.out) { this.simOthers(); this.advance(); return; }
    this.save();
  }

  recordUserResult(m) {
    const tie = this.userTie();
    this.pending = false;
    if (!tie) return;
    const sc = [m.teams[0].score, m.teams[1].score];
    const pens = m.shootout ? [m.teams[0].pens, m.teams[1].pens] : null;
    const winner = m.shootout ? m.shootout.winner : sc[0] > sc[1] ? 0 : 1;
    const scorers = m.events.filter((e) => e.type === 'goal').map((e) => ({ team: e.team, own: e.own, min: Math.ceil(e.t / 60), name: m.byId.get(e.pid)?.short }));
    this.setResult(tie, { score: sc, pens, winner, scorers });
    this.simOthers();
    this.advance();
    this.save();
  }

  simUser() {
    const tie = this.userTie(); if (!tie) return;
    this.setResult(tie, this.sim(this.idx(tie.h), this.idx(tie.a), true));
    this.simOthers(); this.advance(); this.save();
  }

  view(h) {
    const el = document.createElement('div');
    const btn = (label, fn, ghost) => { const b = document.createElement('button'); b.textContent = label; if (ghost) b.className = 'ghost'; b.onclick = fn; b.style.margin = '6px'; return b; };
    const title = document.createElement('div');
    title.className = 'title'; title.style.cssText = 'font-size:22px;margin-bottom:10px;color:var(--yel,#ffd84a)';
    title.textContent = 'THE CUP';
    el.appendChild(title);

    if (!this.state) {
      const p = document.createElement('div');
      p.style.cssText = 'margin:8px 0 14px;line-height:1.6';
      p.textContent = 'Pick your club. Knockout ties go to extra time and penalties. Your matches are played, the rest are simulated.';
      el.appendChild(p);
      const sel = document.createElement('select');
      sel.style.cssText = 'font:inherit;padding:6px;margin:6px';
      for (const c of this.clubs) { const o = document.createElement('option'); o.value = c.code; o.textContent = `${c.name} (${c.ovr})`; sel.appendChild(o); }
      const size = document.createElement('select');
      size.style.cssText = sel.style.cssText;
      for (const n of [16, 8]) { const o = document.createElement('option'); o.value = n; o.textContent = `${n} clubs`; size.appendChild(o); }
      el.append(sel, size, document.createElement('br'));
      el.appendChild(btn('Start the cup', () => { this.start(sel.value, +size.value); h.refresh(); }));
      el.appendChild(btn('Back', h.back, true));
      return el;
    }

    const st = this.state;
    const status = document.createElement('div');
    status.style.cssText = 'margin-bottom:10px;line-height:1.5';
    const uc = this.club(st.user);
    if (st.champion) status.innerHTML = st.champion === st.user ? `<b style="color:var(--yel,#ffd84a)">${uc.name} WIN THE CUP!</b>` : `Cup winners: <b>${this.club(st.champion).name}</b>. ${uc.name} went out.`;
    else if (st.out) status.textContent = `${uc.name} are out.`;
    else { const t = this.userTie(); status.innerHTML = t ? `Next: <b>${ROUND_NAMES[this.round.length * 2] ?? 'Round'}</b> — ${this.club(t.h).name} v ${this.club(t.a).name}` : ''; }
    el.appendChild(status);

    const grid = document.createElement('div');
    grid.style.cssText = 'display:flex;gap:10px;overflow-x:auto;text-align:left;font-size:12px;margin-bottom:10px';
    st.rounds.forEach((ties) => {
      const col = document.createElement('div');
      col.style.cssText = 'min-width:150px;display:flex;flex-direction:column;justify-content:space-around;gap:6px';
      const hd = document.createElement('div'); hd.textContent = ROUND_NAMES[ties.length * 2] ?? ''; hd.style.cssText = 'color:#9aa8bc;margin-bottom:4px';
      col.appendChild(hd);
      for (const t of ties) {
        const box = document.createElement('div');
        const mine = t.h === st.user || t.a === st.user;
        box.style.cssText = `padding:4px 6px;background:${mine ? '#2b3a1e' : '#1a2230'};border:2px solid ${mine ? '#ffd84a' : '#33405a'}`;
        const line = (code, i) => {
          const w = t.res && t.res.winner === i;
          const sc = t.res ? `${t.res.score[i]}${t.res.pens ? ` (${t.res.pens[i]})` : ''}` : '';
          return `<div style="display:flex;justify-content:space-between;${w ? 'color:#fff;font-weight:bold' : t.res ? 'color:#7d8899' : ''}"><span>${this.club(code)?.short ?? code}</span><span>${sc}</span></div>`;
        };
        box.innerHTML = line(t.h, 0) + line(t.a, 1);
        if (t.res && t.res.scorers?.length) box.title = t.res.scorers.map((s) => `${s.name ?? '?'} ${s.min}'${s.own ? ' (og)' : ''}`).join(', ');
        col.appendChild(box);
      }
      grid.appendChild(col);
    });
    el.appendChild(grid);

    const t = !st.champion && !st.out ? this.userTie() : null;
    if (t) {
      el.appendChild(btn('Play match', () => { this.pending = true; h.play(this.idx(t.h), this.idx(t.a), t.h === st.user ? 0 : 1); }));
      el.appendChild(btn('Simulate my match', () => { this.simUser(); h.refresh(); }, true));
    }
    el.appendChild(btn(st.champion || st.out ? 'New cup' : 'Abandon cup', () => { this.state = null; this.store.set(KEY, null); h.refresh(); }, true));
    el.appendChild(btn('Back', h.back, true));
    return el;
  }
}
</script>
<script type="text/plain" data-mod="ui/practice.js">// Practice Arena drills. Sits on top of a normal Match: watches the state every engine step and
// re-sets the drill when an attempt is over. Keeps a small score panel in the DOM.
import { PITCH } from '@@engine/pitch.js@@';
import { MOVES } from '@@engine/skills.js@@';

export const DRILLS = {
  free: { label: 'Free play', opp: 2, help: 'Attack the keeper and two defenders. Anything goes.' },
  finishing: { label: 'Finishing', opp: 2, help: 'You get the ball 13 to 26 m out. Beat the keeper. Try D twice for a Timed Finish.' },
  freekick: { label: 'Free kicks', opp: 5, help: 'Arrows aim, J / L add curl, D shoots, A crosses, S passes. Shift for a driven shot.' },
  corner: { label: 'Corners', opp: 6, help: 'Arrows pick the zone, A crosses (hold for power), Shift whips it, S plays it short.' },
  penalty: { label: 'Penalties', opp: 0, help: 'Arrows pick the corner, hold D for power. Too much power and it flies over.' },
  skills: { label: 'Skill Trainer', opp: 1, help: 'Use the skill stick (I J K L). Each move you land is ticked off; beating the defender earns an A.' },
};

const SKILL_HELP = {
  feint: 'tap J or L', stepover: 'roll fwd → side', revstep: 'roll side → fwd', ballroll: 'hold side', dragback: 'tap back',
  heelflick: 'roll fwd → back', roulette: 'roll back → side → fwd', fakeexit: 'roll side → back → other side', rainbow: 'roll back → fwd, hold fwd',
  spin: 'roll back → side', croqueta: 'roll side → other side', stopturn: 'fwd → back at speed', elastico: 'roll side → fwd → other side',
  sombrero: 'hold fwd, then back', tornado: 'side → back → other side → fwd',
};

export class Drill {
  constructor(m, kind, team, panel) {
    this.m = m; this.kind = kind; this.team = team; this.panel = panel;
    this.attempts = 0; this.goals = 0; this.t = 0; this.state = 'init';
    this.evI = 0; this.moves = new Map();
    this.seed = 99991;
    this.render();
  }

  rnd(a, b) { this.seed = (this.seed * 48271) % 2147483647; return a + (this.seed / 2147483647) * (b - a); }

  get dir() { return this.m.teams[this.team].dir; }

  /** Called after every engine step. */
  step() {
    const m = this.m;
    this.t++;
    // events: goals, skills
    for (; this.evI < m.events.length; this.evI++) {
      const e = m.events[this.evI];
      if (e.type === 'goal' && e.team === this.team && !e.own) { this.goals++; this.render(); }
      if (e.type === 'skill' && e.team === this.team) { const r = this.moves.get(e.move); if (!r) this.moves.set(e.move, 'B'); this.render(); }
      if (e.type === 'skill_beat' && e.team === this.team) { this.moves.set(e.move, 'A'); this.render(); }
    }
    if (this.state === 'init') { if (m.phase !== 'halftime') this.reset(); return; }
    if (this.state === 'run' && this.over()) { this.state = 'wait'; this.wait = 50; }
    if (this.state === 'wait' && this.wait-- <= 0) this.reset();
  }

  /** Has this attempt finished? */
  over() {
    const m = this.m, k = this.kind;
    if (m.phase === 'kickoff' || m.phase === 'goal') return true;
    if (m.phase === 'restart' && m.restart && !this.isMine(m.restart)) return true;
    if (k === 'free' || k === 'skills') {
      if (m.owner && m.owner.team !== this.team && m.owner.pos === 'GK' && m.owner.holding && this.t > 60) return true;
      return false;
    }
    if (m.owner && m.owner.team !== this.team && this.t > 40) return true;
    if (m.phase === 'live' && this.t > 60 * 9) return true;
    return false;
  }

  isMine(r) { return r.team === this.team && r.type === ({ freekick: 'freekick', corner: 'corner', penalty: 'penalty' }[this.kind] ?? r.type) && r.drill; }

  reset() {
    const m = this.m, dir = this.dir, k = this.kind;
    this.t = 0; this.state = 'run';
    const L = PITCH.HALF_L;
    if (k === 'freekick') {
      this.attempts++;
      m.startRestart('freekick', this.team, dir * (L - this.rnd(18, 30)), this.rnd(-16, 16), { drill: true });
    } else if (k === 'corner') {
      this.attempts++;
      m.startRestart('corner', this.team, dir * (L - 0.3), (this.rnd(0, 1) < 0.5 ? -1 : 1) * (PITCH.HALF_W - 0.3), { drill: true });
    } else if (k === 'penalty') {
      this.attempts++;
      m.startRestart('penalty', this.team, dir * (L - PITCH.PEN_SPOT), 0, { drill: true });
    } else {
      // open play: hand the ball to the user's player at a random spot
      if (k === 'finishing') this.attempts++;
      const c = m.ctls.find((cc) => cc.team === this.team);
      const t = m.teams[this.team];
      const p = (c && m.byId.get(c.pid)) ?? t.on.find((q) => q.pos !== 'GK');
      const x = dir * (k === 'finishing' ? L - this.rnd(13, 26) : k === 'skills' ? L - 32 : 0);
      const y = k === 'finishing' ? this.rnd(-14, 14) : 0;
      m.phase = 'live'; m.restart = null; m.owner = null;
      p.x = x - dir * 0.6; p.y = y; p.vx = p.vy = 0; p.act = null; p.face = dir > 0 ? 0 : Math.PI;
      Object.assign(m.ball, { x, y, z: 0, vx: 0, vy: 0, vz: 0, spin: 0, top: 0 });
      // defenders back to their spots between the ball and goal
      const opp = m.teams[1 - this.team].on.filter((q) => q.pos !== 'GK');
      // skills: one defender square in front; finishing: defenders chase from behind and the side
      opp.forEach((q, i) => {
        if (k === 'skills') { q.x = x + dir * 3; q.y = y; }
        else if (k === 'finishing') { q.x = x - dir * (4 + i * 2); q.y = y + (i % 2 ? 6 : -6); }
        else { q.x = x + dir * (7 + i * 2); q.y = y + (i - (opp.length - 1) / 2) * 4; }
        q.vx = q.vy = 0; q.act = null;
      });
      const gk = m.gk(1 - this.team); if (gk) { gk.x = dir * (L - 1); gk.y = 0; gk.act = null; gk.holding = null; }
      m.giveBall(p);
      if (c) m.control(c, p);
    }
    this.render();
  }

  render() {
    if (!this.panel) return;
    const d = DRILLS[this.kind];
    let html = `<div><b>${d.label.toUpperCase()}</b></div><div style="opacity:.8">${d.help}</div>`;
    if (this.kind === 'skills') {
      const me = this.m.ctls.find((c) => c.team === this.team);
      const p = me && this.m.byId.get(me.pid);
      const stars = p?.sm ?? 3;
      html += `<div style="margin-top:6px">${p ? p.short : ''} ${'*'.repeat(stars)} skill</div>`;
      for (const [k, mv] of Object.entries(MOVES)) {
        const g = this.moves.get(k);
        const locked = mv.tier > stars;
        html += `<div style="${locked ? 'opacity:.4' : ''}">${g ? `<b>${g}</b>` : '-'} ${mv.label} <span style="opacity:.7">${SKILL_HELP[k] ?? ''}</span></div>`;
      }
    } else if (this.kind !== 'free') {
      html += `<div style="margin-top:6px">Scored <b>${this.goals}</b> of ${this.attempts}</div>`;
    } else html += `<div style="margin-top:6px">Goals <b>${this.goals}</b></div>`;
    html += '<div style="opacity:.6;margin-top:6px">P = menu, H = keys</div>';
    this.panel.innerHTML = html;
  }
}
</script>
<script type="text/plain" data-mod="render/replay.js">// Instant replay: a ring buffer of render state (players, ball, owner) recorded every engine step.
// Playback writes a recorded frame into the match for rendering only, then restores the live state.
// The engine is not stepped while a replay plays, so the simulation is untouched.

const KEEP = 60 * 9;   // seconds of history

function snap(m) {
  const b = m.ball;
  return {
    tick: m.tick,
    ball: { x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz },
    owner: m.owner ? m.owner.id : null,
    ps: m.players.map((p) => ({ p, x: p.x, y: p.y, face: p.face, vx: p.vx, vy: p.vy, speed: p.speed, act: p.act ? { ...p.act } : null, skill: p.skill ? { ...p.skill } : null, holding: p.holding, jockey: p.jockey, onPitch: p.onPitch })),
  };
}

function apply(m, f) {
  Object.assign(m.ball, f.ball);
  m.owner = f.owner ? m.byId.get(f.owner) : null;
  for (const s of f.ps) {
    const p = s.p;
    p.x = s.x; p.y = s.y; p.face = s.face; p.vx = s.vx; p.vy = s.vy; p.speed = s.speed;
    p.act = s.act; p.skill = s.skill; p.holding = s.holding; p.jockey = s.jockey; p.onPitch = s.onPitch;
  }
}

export class Replay {
  constructor() { this.buf = []; this.playing = null; }

  reset() { this.buf = []; this.playing = null; }

  /** Call after every engine step while the ball is live. */
  record(m) {
    if (this.playing) return;
    if (m.phase !== 'live' && m.phase !== 'goal') return;
    this.buf.push(snap(m));
    if (this.buf.length > KEEP) this.buf.shift();
  }

  /** Start playing the last `secs` seconds up to the goal (plus a short tail). */
  start(m, secs = 6, speed = 0.55) {
    if (this.buf.length < 30) return false;
    const goalI = this.buf.findLastIndex((f) => f.tick <= m.goalTick + 40);
    const end = goalI > 0 ? goalI : this.buf.length - 1;
    const begin = Math.max(0, end - Math.round(secs * 60));
    this.playing = { frames: this.buf.slice(begin, end + 1), k: 0, speed, live: snap(m), phase: m.phase };
    return true;
  }

  /** Advance by real seconds dt; writes the frame into m. Returns false when finished (live state restored). */
  frame(m, dt) {
    const pl = this.playing;
    if (!pl) return false;
    pl.k += dt * 60 * pl.speed;
    const i = Math.floor(pl.k);
    if (i >= pl.frames.length) { this.stop(m); return false; }
    apply(m, pl.frames[i]);
    return true;
  }

  stop(m) {
    const pl = this.playing;
    if (!pl) return;
    apply(m, pl.live);
    this.playing = null;
    this.buf = [];
  }
}
</script>
<script type="text/plain" data-mod="net/hub.js">// Online rooms on the Mini2K relay server (the same server Mini2K uses; MiniSoccer rooms are
// prefixed 'msoc-' so the two games never meet). Every message goes to everyone in the room; a message
// with `to` is only for that screen. Ported from Mini2K's src/net/peer.js (HubLink and server helpers).

export const cleanCode = (s) => String(s ?? '').toUpperCase().replace(/[^0-9A-Z]/g, '').slice(0, 12);
export function newRoomCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return [...crypto.getRandomValues(new Uint8Array(6))].map((b) => A[b % A.length]).join('');
}
export const newId = () => [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, '0')).join('');

function openWs(base, room, timeout = 15000) {
  return new Promise((resolve, reject) => {
    let ws;
    try { ws = new WebSocket(wsUrl(base, room)); } catch { reject(new Error('That server address is not valid.')); return; }
    const fail = setTimeout(() => { ws.close(); reject(new Error('Could not reach the server. It may still be waking up: try again in a minute.')); }, timeout);
    ws.onopen = () => { clearTimeout(fail); resolve(ws); };
    ws.onerror = () => { clearTimeout(fail); reject(new Error('Could not reach the server. Check its address.')); };
  });
}

/** The server's address: typed in Network settings, or the site this page was opened from. */
/** AR's own relay server on Render (free plan; sleeps when idle, wakes in about a minute). */
export const DEFAULT_SERVER = 'https://mini2k-relay.onrender.com';
export function serverBase(typed) {
  let u = String(typed ?? '').trim();
  // opened from a web address: the relay server may be serving this page (checked with /health)
  if (!u && typeof location !== 'undefined' && /^https?:$/.test(location.protocol) && location.hostname) u = location.origin;
  // the double-click file: use the built-in server
  if (!u) u = DEFAULT_SERVER;
  if (!/^[a-z]+:\/\//i.test(u)) u = 'https://' + u;
  return u.replace(/^ws(s?):/i, 'http$1:').replace(/\/+$/, '');
}
const wsUrl = (base, room) => base.replace(/^http/i, 'ws') + '/ws?room=' + encodeURIComponent(room);

/** Free hosting puts the server to sleep when nobody uses it; the first visit wakes it (up to a minute). */
export async function wakeServer(base, ms = 75000) {
  const until = Date.now() + ms;
  while (Date.now() < until) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
      const r = await fetch(base + '/health', { cache: 'no-store', signal: ctl.signal });
      clearTimeout(t);
      if (r.ok && (await r.text()).startsWith('ok')) return true;
    } catch { /* asleep or unreachable: try again */ }
    await new Promise((res) => setTimeout(res, 2000));
  }
  return false;
}



export class HubLink {
  constructor(kind, base, code, id) {
    this.kind = kind; this.base = base; this.room = 'msoc-4-' + code; this.id = id;
    this.onmsg = null; this.onclose = null; this.onreopen = null; this.oncount = null;
    this.closed = false; this.ws = null; this.bc = null; this.n = 0;
  }
  async connect() {
    if (this.kind === 'local') {
      this.bc = new BroadcastChannel(this.room);
      this.bc.onmessage = (e) => this.recv(e.data);
      return this;
    }
    const ws = await openWs(this.base, this.room);
    this.ws = ws;
    ws.onmessage = (e) => this.recv(e.data);
    ws.onclose = () => { if (this.ws === ws && !this.closed) this.reopen(); };
    return this;
  }
  async reopen() {
    for (let i = 0; i < 20 && !this.closed; i++) {
      await new Promise((r) => setTimeout(r, 1500));
      try { await this.connect(); this.onreopen?.(); return; } catch { /* keep trying */ }
    }
    this.fireClose('closed');
  }
  recv(raw) {
    let m; try { m = JSON.parse(raw); } catch { return; }
    if (m.t === '_n') { this.n = m.n; this.oncount?.(m.n); return; }
    if (m.from === this.id || (m.to && m.to !== this.id)) return;
    this.onmsg?.(m);
  }
  get open() { return !this.closed && (this.kind === 'local' ? !!this.bc : this.ws?.readyState === 1); }
  send(m) {
    if (!this.open) return false;
    const s = JSON.stringify({ ...m, from: this.id });
    if (this.kind === 'local') this.bc.postMessage(s); else this.ws.send(s);
    return true;
  }
  async route() { return this.kind === 'local' ? 'local' : 'server'; }
  fireClose(why) { if (this.closed) return; this.closed = true; this.onclose?.(why); }
  close() { this.closed = true; try { this.ws?.close(); this.bc?.close(); } catch { /* gone */ } }
}
</script>
<script type="text/plain" data-mod="net/session.js">// Online MiniSoccer: up to four people in one room (HubLink). Lockstep with the host as the truth.
//
// The engine is deterministic, so screens never send the game itself, only buttons:
//   guest: its own buttons, one packed number per 60 Hz step --(i)--> host
//   host:  step N = m.step(every seat's buttons) --(f: [cmds, seat0, seat1, ...] per step)--> everyone
//   guest: plays frame N on its own copy and ends up in the same state.
// Every second the host sends a fingerprint of the game. If a guest's copy ever differs, or a guest
// joins late or comes back, it asks for the whole frame log and replays the match from the start
// (a full match replays headless in about a second), so no snapshot format is needed.
//
// Seats: 'h1','h2' play for the home club, 'a1','a2' for the away club; an empty side is the CPU.

import { Match } from '@@engine/live.js@@';

export const STEP = 1 / 60;
const TARGET = 3, TARGET_MAX = 10, SNAP = 30, HASH_EVERY = 60, LOG_CHUNK = 15000;

/** One 60 Hz input frame <-> one small integer. Directions are quantised to -1/0/1. */
const q = (v) => (v > 0.35 ? 1 : v < -0.35 ? -1 : 0);
export function packInput(f) {
  if (!f) return 0;
  const dir = (q(f.mx) + 1) * 3 + (q(f.my) + 1);
  const st = (q(f.sx ?? 0) + 1) * 3 + (q(f.sy ?? 0) + 1);
  return dir + st * 9 + ((f.b | 0) << 7);
}
export function unpackInput(n) {
  const lo = n & 127, dir = lo % 9, st = Math.floor(lo / 9);
  return { mx: Math.floor(dir / 3) - 1, my: (dir % 3) - 1, sx: Math.floor(st / 3) - 1, sy: (st % 3) - 1, b: n >> 7 };
}

/** Fingerprint of the game state (positions rounded, score, clock). */
export function stateHash(m) {
  let h = 2166136261;
  const add = (v) => { h ^= Math.round(v * 1000) | 0; h = Math.imul(h, 16777619); };
  add(m.tick); add(m.ball.x); add(m.ball.y); add(m.ball.z); add(m.teams[0].score); add(m.teams[1].score);
  for (const p of m.players) { add(p.x); add(p.y); }
  return h >>> 0;
}

/** Apply a frame command (same call on every screen at the same step). */
function applyCmd(m, c) {
  if (c.k === 'resume' && m.phase === 'halftime') m.resume();
  else if (c.k === 'sub') m.requestSub?.(c.team, c.off, c.on);
}

export class NetSession {
  /**
   * @param link  HubLink (connected)
   * @param host  true on the room creator's screen
   * @param ui    { makeMatch(cfg) -> Match, onLobby(people), onStart(cfg, match), onReplace(match), onPause(on), onClose(why), onStatus(text) }
   */
  constructor(link, host, name, ui) {
    this.link = link; this.host = host; this.name = name; this.ui = ui;
    this.id = link.id;
    this.people = host ? [{ id: link.id, name, side: 'home' }] : [];
    this.cfg = null; this.m = null; this.seats = []; this.key = null;
    this.paused = false;
    // host
    this.qs = new Map(); this.held = new Map(); this.seen = new Map(); this.out = []; this.hashes = []; this.log = []; this.cmds = [];
    // guest
    this.buf = []; this.expect = new Map(); this.acc = 0; this.inAcc = 0; this.iq = []; this.target = TARGET; this.waiting = false; this.logParts = null;
    this.stats = { resyncs: 0, mismatches: 0, ffw: 0 };
    link.onmsg = (msg) => this.onMsg(msg);
    link.onclose = (why) => this.ui.onClose?.(why);
    link.onreopen = () => { if (!this.host) this.hello(); };
    if (!host) this.hello();
    this.pingT = setInterval(() => { if (!this.host) this.link.send({ t: 'hi', to: 'host' }); }, 1000);
  }

  hello() { this.link.send({ t: 'hello', name: this.name, to: 'host' }); }
  close() { clearInterval(this.pingT); this.link.send({ t: 'bye' }); this.link.close(); }

  // ---------------------------------------------------------------- lobby
  setSide(side) {
    if (this.host) { const me = this.people.find((p) => p.id === this.id); if (me) me.side = side; this.sendLobby(); }
    else this.link.send({ t: 'side', side, to: 'host' });
  }
  sendLobby() { this.link.send({ t: 'lobby', people: this.people, cfg: this.lobbyCfg }); this.ui.onLobby?.(this.people, this.lobbyCfg); }
  /** Host: show the clubs and settings it picked on every lobby screen. */
  setLobbyCfg(cfg) { this.lobbyCfg = { ...cfg }; this.sendLobby(); }

  onMsg(msg) {
    const from = msg.from;
    switch (msg.t) {
      case 'hello':
        if (!this.host) break;
        this.seen.set(from, performance.now());
        if (!this.people.some((p) => p.id === from)) this.people.push({ id: from, name: String(msg.name ?? 'Guest').slice(0, 16), side: this.people.filter((p) => p.side === 'away').length < 2 ? 'away' : 'watch' });
        else this.people.find((p) => p.id === from).name = String(msg.name ?? 'Guest').slice(0, 16);
        this.sendLobby();
        if (this.m) { this.link.send({ t: 'start', cfg: this.cfg, to: from }); this.sendLog(from); }   // came back mid-match
        break;
      case 'hi': if (this.host) this.seen.set(from, performance.now()); break;
      case 'side': if (this.host && !this.m) { const p = this.people.find((x) => x.id === from); if (p && ['home', 'away', 'watch'].includes(msg.side)) { p.side = msg.side; this.sendLobby(); } } break;
      case 'bye':
        if (this.host) { if (!this.m) this.people = this.people.filter((p) => p.id !== from); this.seen.delete(from); this.sendLobby(); }
        else if (from === 'host') this.ui.onClose?.('The host left.');
        break;
      case 'lobby': if (!this.host) { this.people = msg.people; this.ui.onLobby?.(msg.people, msg.cfg); } break;
      case 'start': if (!this.host) this.begin(msg.cfg); break;
      case 'i': if (this.host) { const seat = this.seats.find((s) => s.id === from); if (seat) { this.seen.set(from, performance.now()); const qq = this.qs.get(seat.key) ?? []; this.qs.set(seat.key, qq); for (const x of msg.q) qq.push(x | 0); } } break;
      case 'need': if (this.host && this.m) this.sendLog(from); break;
      case 'f': if (!this.host && !this.waiting && this.m) { msg.f.forEach((f, k) => { const n = msg.n + k; if (n > this.m.tick) this.buf.push({ n, f }); }); for (const [n, h] of msg.h ?? []) this.expect.set(n, h); } break;
      case 'log': if (!this.host) this.gotLog(msg); break;
      case 'pause': this.paused = !!msg.on; this.ui.onPause?.(this.paused); break;
      case 'askpause': if (this.host) this.setPause(!!msg.on); break;
    }
  }

  // ---------------------------------------------------------------- start
  /** Host: start the match. base = { home, away, half, difficulty, weather, seed }. */
  start(base) {
    const seats = [];
    for (const side of ['home', 'away']) {
      const ps = this.people.filter((p) => p.side === side).slice(0, 2);
      ps.forEach((p, i) => seats.push({ key: (side === 'home' ? 'h' : 'a') + (i + 1), team: side === 'home' ? 0 : 1, id: p.id, name: p.name }));
    }
    this.cfg = { ...base, seats };
    this.link.send({ t: 'start', cfg: this.cfg });
    this.begin(this.cfg);
  }

  begin(cfg) {
    this.cfg = cfg; this.seats = cfg.seats;
    this.key = cfg.seats.find((s) => s.id === this.id)?.key ?? null;
    this.m = this.ui.makeMatch(cfg);
    this.buf = []; this.expect.clear(); this.log = []; this.out = []; this.hashes = []; this.waiting = false;
    this.ui.onStart?.(cfg, this.m, this.key);
    if (!this.host && this.m.tick === 0) { /* fresh start */ }
  }

  // ---------------------------------------------------------------- host
  /** Next buttons of a guest seat (one queued step; merge presses if the queue piles up). */
  take(key) {
    const qq = this.qs.get(key) ?? [];
    while (qq.length > 8) { const x = qq.shift(); qq[0] = (((qq[0] >> 7) | (x >> 7)) << 7) | (qq[0] & 127); }
    const seat = this.seats.find((s) => s.key === key);
    if (!qq.length && performance.now() - (this.seen.get(seat?.id) ?? 0) > 1500) this.held.set(key, 0);   // dropped out: stand still
    const v = qq.length ? qq.shift() : (this.held.get(key) ?? 0);
    this.held.set(key, v);
    return v;
  }

  /** Host: one 60 Hz step with this screen's own frame. */
  hostStep(myFrame) {
    const m = this.m;
    const cmds = this.cmds; this.cmds = [];
    if (m.phase === 'halftime') { this.htT = (this.htT ?? 0) + 1; if (this.htT > 60 * 8) { cmds.push({ k: 'resume' }); this.htT = 0; } }
    for (const c of cmds) applyCmd(m, c);
    const f = [cmds.length ? cmds : 0];
    const inputs = {};
    for (const s of this.seats) {
      const v = s.key === this.key ? packInput(myFrame) : this.take(s.key);
      f.push(v);
      inputs[s.key] = unpackInput(v);
    }
    m.step(inputs);
    this.out.push(f); this.log.push(f);
    if (m.tick % HASH_EVERY === 0) this.hashes.push([m.tick, stateHash(m)]);
  }

  /** Host: send frames made since the last call (once per screen refresh). */
  flush() {
    if (!this.out.length) return;
    this.link.send({ t: 'f', n: this.m.tick - this.out.length + 1, f: this.out, h: this.hashes.length ? this.hashes : undefined });
    this.out = []; this.hashes = [];
  }

  sendLog(to) {
    this.flush();
    const n = this.log.length;
    const parts = Math.max(1, Math.ceil(n / LOG_CHUNK));
    for (let i = 0; i < parts; i++) this.link.send({ t: 'log', to, part: i, of: parts, upto: n, f: this.log.slice(i * LOG_CHUNK, (i + 1) * LOG_CHUNK) });
  }

  setPause(on) { this.paused = on; this.link.send({ t: 'pause', on }); this.ui.onPause?.(on); }
  requestPause(on) { if (this.host) this.setPause(on); else this.link.send({ t: 'askpause', on, to: 'host' }); }

  // ---------------------------------------------------------------- guest
  playFrame(f) {
    const m = this.m;
    if (f[0]) for (const c of f[0]) applyCmd(m, c);
    const inputs = {};
    this.seats.forEach((s, i) => { inputs[s.key] = unpackInput(f[1 + i]); });
    m.step(inputs);
    const want = this.expect.get(m.tick);
    if (want !== undefined) { this.expect.delete(m.tick); if (want !== stateHash(m)) { this.stats.mismatches++; this.resync(); } }
  }

  resync() {
    if (this.waiting) return;
    this.waiting = true; this.buf = []; this.logParts = null;
    this.link.send({ t: 'need', to: 'host' });
    this.ui.onStatus?.('Catching up...');
  }

  gotLog(msg) {
    if (!this.cfg) return;
    if (!this.logParts || msg.part === 0) this.logParts = { of: msg.of, parts: [] };
    this.logParts.parts[msg.part] = msg.f;
    if (this.logParts.parts.filter(Boolean).length < this.logParts.of) return;
    const frames = this.logParts.parts.flat();
    this.logParts = null;
    // rebuild the match from the start and replay every frame
    this.m = this.ui.makeMatch(this.cfg);
    for (const f of frames) this.playFrame(f);
    this.buf = this.buf.filter((x) => x.n > this.m.tick);
    for (const k of [...this.expect.keys()]) if (k <= this.m.tick) this.expect.delete(k);
    this.waiting = false; this.stats.resyncs++;
    this.ui.onReplace?.(this.m);
    this.ui.onStatus?.('');
  }

  /**
   * Guest: once per screen refresh. Sends this screen's buttons (60 a second) and plays the host's
   * frames, a little faster when behind, jumping ahead when far behind.
   */
  guestFrame(dt, frame) {
    this.inAcc += dt;
    let n = 0;
    while (this.inAcc >= STEP && n++ < 8) { this.inAcc -= STEP; this.iq.push(this.key ? packInput(frame()) : 0); }
    if (this.inAcc > STEP) this.inAcc = 0;
    if (this.iq.length && this.key && !this.paused) this.link.send({ t: 'i', q: this.iq, to: 'host' });
    this.iq = [];
    if (!this.m || this.waiting) return;
    // a gap in the frames (joined mid-match, lost messages): replay the whole log instead
    while (this.buf.length && this.buf[0].n <= this.m.tick) this.buf.shift();
    if (this.buf.length && this.buf[0].n !== this.m.tick + 1) { this.resync(); return; }
    const behind = this.buf.length, T = this.target;
    if (behind > SNAP + T) { this.stats.ffw++; while (this.buf.length > T && !this.waiting) this.playFrame(this.buf.shift().f); this.acc = 0; return; }
    const rate = behind > T + 1 ? 1 + Math.min(0.25, (behind - T) * 0.03) : 1;
    this.acc += dt * rate;
    while (this.acc >= STEP && this.buf.length && !this.waiting) { this.playFrame(this.buf.shift().f); this.acc -= STEP; }
    if (!this.buf.length && this.acc >= STEP) { this.acc = STEP; if (!this.dry) this.target = Math.min(TARGET_MAX, this.target + 1); this.dry = true; }
    else this.dry = false;
  }
}

/** The match every screen builds from the same start config (no saved lineups, so all screens agree). */
export function makeOnlineMatch(cfg, sides) {
  return new Match({
    home: sides.home, away: sides.away, seed: cfg.seed,
    settings: { half: cfg.half, difficulty: cfg.difficulty, offsides: true, fouls: 'on', injuries: true, weather: cfg.weather, matchType: cfg.matchType ?? 'league' },
    humans: cfg.seats.map((s) => ({ key: s.key, team: s.team, assist: { pass: 'assisted', shot: 'assisted', timed: true, autoSwitch: 'air' } })),
  });
}
