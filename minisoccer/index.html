    if (dGoal < 30 && Math.abs(r.y) < 18 && m.rng.chance(0.75 * ((taker.attrs.fka ?? 50) / 80))) {
      const spec = shotSpec(m, taker, 'normal', m.rng.range(0.7, 0.9), null, 'cpu');
      spec.shotType = 'fk'; spec.setPiece = 'freekick';
      spec.tz = m.rng.range(1.2, 2.1);
      spec.curl = (spec.ty > 0 ? -1 : 1) * dir * 1.4 * -1;
      return spec;
    }
    const box = matesOf(m, taker).filter((q) => inBox(q.x, q.y, dir));
    if (box.length) { const q = m.rng.pick(box); const s = passTo(m, taker, q, 'cross'); if (s) return { ...s, setPiece: 'freekick' }; }
  }
  if (r.type === 'goalkick') {
    const spec = bestPass(m, taker, { gk: true });
    if (spec && spec.type === 'gkthrow') spec.type = 'ground';
    return spec ?? { type: 'gkkick', tx: 0, ty: 0, power: 0.8 };
  }
  // throw-ins and other free kicks: best pass
  const spec = bestPass(m, taker);
  if (spec && r.type === 'throw' && dist(taker, { x: spec.tx, y: spec.ty }) > 22) { spec.tx = taker.x + (spec.tx - taker.x) * 0.5; spec.ty = taker.y + (spec.ty - taker.y) * 0.5; }
  return spec ?? { type: 'ground', tx: r.x + dir * 8, ty: r.y * 0.8, power: 0.5 };
}

export function penaltySpec(m, taker) {
  const t = m.teams[taker.team];
  const side = m.rng.chance(0.5 + (taker.foot === 'L' ? -0.05 : 0.05)) ? 1 : -1;
  const center = m.rng.chance(0.1);
  return { type: 'shot', shotType: 'penalty', tx: t.dir * PITCH.HALF_L, ty: center ? 0 : side * m.rng.range(1.8, 3.0), tz: m.rng.range(0.25, 1.6), power: m.rng.range(0.6, 0.85), setPiece: 'penalty' };
}

/** Keeper's guess on a penalty: -1 / 0 / +1 (world y side). */
export function penaltyDive(m, gk) {
  const r = m.rng.next();
  return r < 0.45 ? -1 : r < 0.9 ? 1 : 0;
}

export function penOrder(m, team) {
  const t = m.teams[team];
  const on = t.on.filter((p) => p.onPitch && !p.red);
  return [...on].sort((a, b) => (a.pos === 'GK') - (b.pos === 'GK') || (b.attrs.pen ?? 0) - (a.attrs.pen ?? 0));
}

// ---------------------------------------------------------------- substitutions (CPU)
export function pickSub(m, t, off) {
  const g = GROUP[off.pos];
  const bench = t.bench.filter((p) => !p.red && !t.pendingSubs.some((s) => s.on === p.id));
  const same = bench.filter((p) => (p.data.pos ?? []).some((pos) => GROUP[pos] === g));
  const pool = same.length ? same : bench;
  if (off.pos === 'GK') { const gk = bench.find((p) => p.data.pos[0] === 'GK'); return gk ?? null; }
  return pool.filter((p) => p.data.pos[0] !== 'GK').sort((a, b) => (b.data.ovr ?? 0) - (a.data.ovr ?? 0))[0] ?? null;
}

/** CPU subs at a stoppage: tired players after 60', tactical changes. */
export function cpuSubs(m, t) {
  if (!m.autoSubsFor(t.idx)) return;
  const min = m.clock() / 60;
  if (min < 58 || t.subsUsed + t.pendingSubs.length >= 5 || t.windowsUsed >= 3) return;
  const tired = t.on.filter((p) => p.onPitch && p.pos !== 'GK' && (p.stamina < 0.55 || p.injured || (p.yellow && GROUP[p.pos] === 'DEF' && min > 70))).sort((a, b) => a.stamina - b.stamina);
  let n = Math.min(tired.length, min > 75 ? 3 : 2, 5 - t.subsUsed - t.pendingSubs.length);
  for (const p of tired) {
    if (n <= 0) break;
    const s = pickSub(m, t, p);
    if (s) { t.pendingSubs.push({ off: p.id, on: s.id }); n--; }
  }
}
</script>
<script type="text/plain" data-mod="engine/live.js">// The real-time match: 22 players, a ball, a referee's rules, at fixed 60 Hz steps.
// Deterministic: everything random goes through this.rng (seeded). The renderer only reads.
//
// Phases: 'kickoff' | 'restart' | 'live' | 'goal' | 'halftime' | 'fulltime' | 'shootout'
// A restart has sub-steps: setup (players walk to positions) -> take (taker aims and kicks).
import { Rng } from '@@engine/rng.js@@';
import { PITCH, STEP, G, clamp, len, dist, angDiff, inBox } from '@@engine/pitch.js@@';
import { makeBall, stepBall, predict, groundSpeedFor, loftSpeedFor, WEATHER_BALL, copyBall } from '@@engine/physics.js@@';
import { MODEL, pressureMult, passError, shotError, shotSpeed, controlProb, tackleOdds, foulOdds, keeperReach, saveKind, xg } from '@@engine/model.js@@';
import { offsidePosition, NO_OFFSIDE_RESTART, goalLineRestart, stoppageMinutes, shootoutDecided, applyCard } from '@@engine/rules.js@@';
import { FORMATIONS } from '@@engine/formations.js@@';
import { B, EMPTY } from '@@engine/input.js@@';
import * as AI from '@@engine/ai.js@@';
import { MOVES, token, recognise } from '@@engine/skills.js@@';

const STEPS_PER_S = 60;
const PATH_N = 300;
const HOLD_MAX = { pass: 60, shot: 66 };     // steps to full power (1.0 s pass, 1.1 s shot)
const HOLD_EXTRA = 18;                        // held at 100% this long, then it fires anyway

export class Match {
  /**
   * opts: { home, away, seed, settings, humans }
   *  home/away: { club, squad: [player data], lineup: [11 ids in formation order], bench: [ids], formation, kit, gkKit }
   *  settings: { half (minutes), difficulty, offsides, fouls, injuries, weather, matchType: 'league'|'knockout'|'golden', handball }
   *  humans: [{ key, team, assist? }]  (team 0 = home, 1 = away)
   */
  constructor(opts) {
    this.opts = opts;
    this.settings = { half: 4, difficulty: 'pro', offsides: true, fouls: 'on', injuries: true, weather: 'clear', matchType: 'league', handball: true, ...opts.settings };
    this.rng = new Rng(opts.seed ?? 1);
    this.tick = 0;
    this.wb = WEATHER_BALL[this.settings.weather] ?? WEATHER_BALL.clear;
    this.diff = AI.DIFFICULTY[this.settings.difficulty] ?? AI.DIFFICULTY.pro;
    this.ball = makeBall();
    this.owner = null;
    this.path = null; this.pathT = 0;
    this.events = [];
    this.fx = [];                 // presentation cues for the renderer (sounds, banners); renderer drains it
    this.time = 0;                // match seconds in the current period (0..2700 for a half)
    this.period = 1;              // 1, 2 halves; 3, 4 extra time
    this.added = 0;               // stoppage seconds announced for this period
    this.dead = { goals: 0, subs: 0, cards: 0, injurySecs: 0, other: 0 };
    this.scale = 2700 / (this.settings.half * 60);   // match seconds per real second
    this.teams = [this.buildTeam(opts.home, 0), this.buildTeam(opts.away, 1)];
    this.players = [...this.teams[0].on, ...this.teams[1].on];
    this.byId = new Map();
    for (const t of this.teams) for (const p of [...t.on, ...t.bench]) this.byId.set(p.id, p);
    this.ctls = (opts.humans ?? []).map((h) => ({ key: h.key, team: h.team, pid: null, prev: 0, hold: null, lastPress: {}, keeperLock: false, assist: { pass: 'assisted', shot: 'assisted', timed: true, autoSwitch: 'air', ...(h.assist ?? {}) }, aimX: 0, aimY: 0, held: 0 }));
    this.ctlByKey = Object.fromEntries(this.ctls.map((c) => [c.key, c]));
    this.offsideFlags = null;     // ids in an offside position at the last pass, until the defense touches
    this.lastTouch = { team: -1, pid: null, kind: null, tick: 0 };
    this.lastKick = null;         // { pid, team, type, tick, receiver }
    this.advantage = null;
    this.restart = null;
    this.shootout = null;
    this.momentum = 0;            // -1 (away on top) .. +1 (home on top)
    this.momentumLog = [];
    this.stats = null;
    this.halfKickoff = this.rng.chance(0.5) ? 0 : 1;   // coin toss: who kicks off the first half
    this.phase = 'kickoff';
    this.setupKickoff(this.halfKickoff);
    this.log('kickoff', { team: this.halfKickoff, period: 1 });
    for (const c of this.ctls) this.autoSelect(c);
  }

  // ---------------------------------------------------------------- setup
  buildTeam(side, idx) {
    const formation = side.formation && FORMATIONS[side.formation] ? side.formation : '4-3-3';
    const slots = FORMATIONS[formation];
    const squad = new Map(side.squad.map((p) => [p.id, p]));
    const mk = (d, slot) => ({
      id: d.id, name: d.name, short: d.short ?? d.name.split(' ').slice(-1)[0], num: d.num, team: idx, data: d,
      pos: slot != null ? slots[slot][0] : d.pos[0], slot, attrs: d.attrs, wf: d.wf ?? 3, sm: d.sm ?? 2, foot: d.foot ?? 'R', h: d.h ?? 1.8,
      x: 0, y: 0, vx: 0, vy: 0, face: idx === 0 ? 0 : Math.PI, stamina: 1, yellow: 0, red: false, injured: 0,
      act: null, cool: 0, touchPh: 0, tx: 0, ty: 0, urg: 0.5, run: null, onPitch: slot != null, ctl: null, lean: 0, think: 0,
      mins: 0, entered: slot != null ? 0 : null,
    });
    const on = side.lineup.slice(0, 11).map((id, i) => mk(squad.get(id), i));
    const bench = (side.bench ?? []).map((id) => mk(squad.get(id), null)).filter((p) => p.data);
    return {
      idx, club: side.club, formation, slots, on, bench, off: [], kit: side.kit, gkKit: side.gkKit,
      dir: idx === 0 ? 1 : -1, score: 0, subsUsed: 0, windowsUsed: 0, windowOpen: false, pendingSubs: [],
      mentality: 2, quick: {}, tactics: { ...(side.tactics ?? {}) }, shootout: [], pens: 0,
      possTicks: 0, phase: 'mid', presser: null, cover: null, chaser: null, lastWon: -9999, lastLost: -9999,
      cpu: !(this.opts.humans ?? []).some((h) => h.team === idx),
    };
  }

  log(type, data = {}) {
    const e = { type, t: this.clock(), period: this.period, tick: this.tick, ...data };
    this.events.push(e);
    return e;
  }

  cue(type, data = {}) { this.fx.push({ type, tick: this.tick, ...data }); }

  /** Displayed match clock in seconds (0..5400+, extra time continues to 7200). */
  clock() {
    const base = [0, 0, 2700, 5400, 6300][this.period] ?? 0;
    return base + this.time;
  }

  periodLen() { return this.period <= 2 ? 2700 : 900; }

  gk(team) { return this.teams[team].on.find((p) => p.pos === 'GK' && !p.red) ?? null; }

  opp(team) { return 1 - team; }

  // ---------------------------------------------------------------- formation spots for restarts
  /** Base formation spot (world) for a player, kickoff shape. */
  homeSpot(p, kickoff) {
    const t = this.teams[p.team], [, u, v] = t.slots[p.slot] ?? ['CM', 0.4, 0];
    let uu = kickoff ? Math.min(0.47, u * 0.86) : u;
    const x = (-PITCH.HALF_L + uu * PITCH.L) * t.dir;
    const y = v * t.dir * PITCH.HALF_W * 0.82;
    return { x, y };
  }

  placeAll(fn) {
    for (const p of this.players) { if (!p.onPitch) continue; const s = fn(p); p.x = s.x; p.y = s.y; p.vx = 0; p.vy = 0; p.act = null; p.run = null; }
  }

  setupKickoff(team) {
    this.phase = 'kickoff';
    this.owner = null;
    Object.assign(this.ball, makeBall());
    this.path = null;
    this.offsideFlags = null;
    this.placeAll((p) => this.homeSpot(p, true));
    // two players of the kicking team at the ball
    const t = this.teams[team];
    const fw = t.on.filter((p) => p.onPitch && !p.red && p.pos !== 'GK').sort((a, b) => (b.x * t.dir) - (a.x * t.dir));
    const taker = fw[0] ?? t.on.find((p) => p.onPitch && !p.red), mate = fw[1];
    taker.x = -t.dir * 0.4; taker.y = 0.3;
    if (mate) { mate.x = -t.dir * 0.6; mate.y = -3; }
    // opponents out of the circle
    for (const p of this.teams[1 - team].on) {
      if (!p.onPitch) continue;
      const d = Math.hypot(p.x, p.y);
      if (d < PITCH.CIRCLE_R + 0.5) { const s = (PITCH.CIRCLE_R + 0.8) / (d || 1); p.x *= s; p.y *= s; if (Math.abs(p.x) < 0.5) p.x = -this.teams[p.team].dir * (PITCH.CIRCLE_R + 0.8); }
    }
    for (const p of this.players) p.face = this.teams[p.team].dir > 0 ? 0 : Math.PI;
    this.restart = { type: 'kickoff', team, x: 0, y: 0, taker: taker.id, t: 0, setup: 0, ready: true, readyT: 0, wait: this.rng.range(0.6, 1.2) };
    this.giveBall(taker, true);
    for (const c of this.ctls) if (c.team === team) this.control(c, taker);
  }

  // ---------------------------------------------------------------- controllers
  control(c, p) {
    if (!p || p.red || !p.onPitch) return;
    if (c.pid != null) { const old = this.byId.get(c.pid); if (old && old.ctl === c.key) old.ctl = null; }
    // someone else (co-op) already has this player? then don't steal
    if (p.ctl && p.ctl !== c.key) return;
    c.pid = p.id; p.ctl = c.key;
    c.hold = null;
  }

  ctlPlayer(c) { return c.pid != null ? this.byId.get(c.pid) : null; }

  autoSelect(c) {
    const t = this.teams[c.team];
    if (this.owner && this.owner.team === c.team && !this.owner.ctl) return this.control(c, this.owner);
    const free = t.on.filter((p) => p.onPitch && !p.red && p.pos !== 'GK' && !p.ctl);
    if (!free.length) return;
    let best = free[0], bd = Infinity;
    for (const p of free) { const d = dist(p, this.ball); if (d < bd) { bd = d; best = p; } }
    this.control(c, best);
  }

  /** Best player to switch to (Q): reaches the ball path soonest, goal-side preferred. */
  switchTarget(c, dirX = 0, dirY = 0) {
    const t = this.teams[c.team], cur = this.ctlPlayer(c);
    const cand = t.on.filter((p) => p.onPitch && !p.red && p.pos !== 'GK' && (!p.ctl || p.ctl === c.key) && p !== cur);
    if (!cand.length) return null;
    const goalX = -t.dir * PITCH.HALF_L;
    let best = null, bs = -Infinity;
    for (const p of cand) {
      let s;
      if (dirX || dirY) {
        if (!cur) continue;
        const dx = p.x - cur.x, dy = p.y - cur.y, d = Math.hypot(dx, dy) || 1;
        const cos = (dx * dirX + dy * dirY) / (d * Math.hypot(dirX, dirY));
        if (cos < 0.35) continue;
        s = cos * 2 - d / 30;
      } else {
        const tgt = this.ballTarget();
        const d = Math.hypot(p.x - tgt.x, p.y - tgt.y);
        const goalSide = (Math.abs(p.x - goalX) < Math.abs(this.ball.x - goalX)) ? 3 : 0;
        s = -d + goalSide;
      }
      if (s > bs) { bs = s; best = p; }
    }
    return best;
  }

  /** Where the ball will be soon (landing point for air balls). */
  ballTarget() {
    if (this.owner) return { x: this.owner.x, y: this.owner.y };
    const path = this.livePath();
    if (!path) return this.ball;
    for (let i = 0; i < Math.min(path.length, 90); i++) if (path[i].z < 1.2 && i > 10) return path[i];
    return path[Math.min(path.length - 1, 30)];
  }

  livePath() {
    if (!this.path) return null;
    const off = this.tick - this.pathT;
    if (off >= this.path.length - 2) return null;
    return off > 0 ? this.path.slice(off) : this.path;
  }

  /** Read one controller's frame: edge detection, holds, switching. Returns the processed frame. */
  readCtl(c, f) {
    f = f ?? EMPTY;
    const press = f.b & ~c.prev, rel = c.prev & ~f.b;
    c.prev = f.b;
    c.frame = f; c.press = press; c.rel = rel;
    for (const k of Object.values(B)) if (press & k) c.lastPress[k] = this.tick;
    return f;
  }

  // ---------------------------------------------------------------- main step
  step(inputs = {}) {
    this.tick++;
    for (const c of this.ctls) this.readCtl(c, inputs[c.key]);
    switch (this.phase) {
      case 'kickoff': case 'restart': this.stepRestart(); break;
      case 'live': this.stepLive(); break;
      case 'goal': this.stepGoal(); break;
      case 'halftime': case 'fulltime': break;
      case 'shootout': this.stepShootout(); break;
    }
    if (this.phase !== 'halftime' && this.phase !== 'fulltime') this.stepClock();
  }

  stepClock() {
    const running = this.phase === 'live' || (this.phase === 'restart' && this.restart?.type !== 'penalty');
    if (!running || this.phase === 'shootout' || this.shootout) return;
    this.time += this.scale * STEP;
    for (const p of this.players) if (p.onPitch) p.mins += this.scale * STEP / 60;
    const plen = this.periodLen();
    if (this.time >= plen && !this.addedShown) {
      this.addedShown = true;
      this.added = stoppageMinutes(this.dead) * 60 * (this.period > 2 ? 0.5 : 1);
      this.added = Math.round(this.added / 60) * 60 || 60;
      this.cue('added', { mins: Math.round(this.added / 60) });
      this.log('added', { mins: Math.round(this.added / 60) });
    }
    if (this.time >= plen + this.added && this.phase === 'live') {
      // let a dangerous attack finish (up to 15 match seconds)
      const atk = this.owner ? this.teams[this.owner.team] : null;
      const danger = atk && this.ball.x * atk.dir > 25 && this.time < plen + this.added + 15;
      if (!danger) this.endPeriod();
    }
  }

  endPeriod() {
    this.cue('whistle', { long: true });
    this.log('period_end', { period: this.period });
    const [h, a] = [this.teams[0].score, this.teams[1].score];
    const ko = this.settings.matchType !== 'league';
    if (this.period === 1 || this.period === 3) { this.phase = 'halftime'; this.owner = null; return; }
    if (this.period === 2 && (!ko || h !== a)) return this.finish();
    if (this.period === 2 && ko && this.settings.matchType === 'golden') { this.phase = 'halftime'; this.goldenNext = true; return; }
    if (this.period === 2 && ko) { this.phase = 'halftime'; return; }
    if (this.period === 4) { if (h !== a) return this.finish(); return this.startShootout(); }
  }

  /** Called by the UI (or headless runner) to start the next period after the break screen. */
  resume() {
    if (this.phase !== 'halftime') return;
    this.period++;
    this.time = 0; this.added = 0; this.addedShown = false;
    this.dead = { goals: 0, subs: 0, cards: 0, injurySecs: 0, other: 0 };
    for (const t of this.teams) { t.dir = -t.dir; t.windowOpen = false; }
    for (const p of this.players) if (this.period === 2 || this.period === 4) p.stamina = Math.min(1, p.stamina + 0.15);
    for (const t of this.teams) this.applySubs(t.idx, true);
    const kick = (this.period === 2 || this.period === 4) ? 1 - this.halfKickoff : this.halfKickoff;
    this.setupKickoff(kick);
    this.log('kickoff', { team: kick, period: this.period });
    this.cue('whistle', {});
  }

  finish() {
    this.phase = 'fulltime';
    this.owner = null;
    this.log('fulltime', { score: [this.teams[0].score, this.teams[1].score] });
    this.cue('whistle', { long: true, triple: true });
  }

  // ---------------------------------------------------------------- live play
  stepLive() {
    // AI: team shape every 6 steps, staggered; carrier decisions per difficulty interval
    for (const t of this.teams) if ((this.tick + t.idx * 3) % 6 === 0) AI.teamThink(this, t);
    if (this.owner) this.teams[this.owner.team].possTicks++;
    if (this.shootout) { this.stepShootoutLive(); return; }
    this.stepHumans();
    if (this.owner && !this.owner.ctl) AI.carrier(this, this.owner);
    for (const p of this.players) if (p.onPitch && !p.red) this.stepPlayer(p);
    this.stepBallLive();
    if (this.phase !== 'live') return;
    this.stepAdvantage();
    if (this.phase === 'live') this.stepDuels();
    if (this.tick % 30 === 0) this.updateMomentum();
  }

  /** Shoulder-to-shoulder contact on the carrier: holding, pushing and clipped heels give away fouls. */
  stepDuels() {
    const car = this.owner;
    if (!car || car.holding || car.act?.type === 'down' || this.restart || this.advantage) return;
    const strict = MODEL.STRICT[this.settings.fouls] ?? 1;
    if (!strict) return;
    let def = null, best = MODEL.DUEL_RANGE;
    for (const q of this.teams[1 - car.team].on) {
      if (!q.onPitch || q.red || q.pos === 'GK' || q.act) continue;
      const d = dist(q, car);
      if (d < best) { best = d; def = q; }
    }
    if (!def) return;
    const behind = this.fromBehind(def, car);
    const agg = (def.attrs.agg ?? 60) / 99, shield = car.shield ? 1.6 : 1;
    const pace = Math.min(1.5, 0.5 + (car.speed ?? 0) / 6);
    const box = inBox(car.x, car.y, this.teams[car.team].dir) ? MODEL.DUEL_BOX : 1;
    if (!this.rng.chance(MODEL.FOUL_DUEL * (0.5 + agg) * (behind ? 2.2 : 1) * shield * pace * box * strict)) return;
    const fo = foulOdds(def, 'stand', behind, false, strict);
    this.foul(def, car, 'duel', { ...fo, yellow: fo.yellow * 0.75, red: fo.red * 0.2 });
  }

  updateMomentum() {
    let target = 0;
    if (this.owner) {
      const t = this.teams[this.owner.team];
      const adv = (this.ball.x * t.dir + PITCH.HALF_L) / PITCH.L;   // 0..1
      target = (t.idx === 0 ? 1 : -1) * Math.max(0, adv - 0.45) * 1.8;
    }
    this.momentum += (target - this.momentum) * 0.08;
    if (this.tick % 600 === 0) this.momentumLog.push({ t: this.clock(), v: Math.round(this.momentum * 100) / 100 });
  }

  /** Movement physics for one player, toward p.want (velocity) set by AI or human. */
  stepPlayer(p) {
    if (p.cool > 0) p.cool--;
    const a = p.attrs;
    const fat = p.stamina < 0.6 ? 1 - (0.6 - p.stamina) * 0.38 : 1;
    const top = (6.5 + 2.6 * (a.spd ?? 60) / 99) * fat * (p.injured ? 0.6 : 1);
    const acc = (4.2 + 4.5 * (a.acc ?? 60) / 99) * fat;
    let wx = 0, wy = 0, spd = 0;
    if (p.skill && (this.owner !== p || p.act)) p.skill = null;
    if (p.skill) { this.stepSkill(p); return; }
    const act = p.act;
    if (act) {
      act.t++;
      if (act.type === 'down' || act.type === 'stumble' || act.type === 'celebrate' && act.still) {
        wx = 0; wy = 0;
        if (act.t >= act.dur) p.act = null;
      } else if (act.type === 'slide') {
        const k = Math.max(0, 1 - act.t / act.dur);
        p.vx = Math.cos(act.ang) * act.v0 * k; p.vy = Math.sin(act.ang) * act.v0 * k;
        p.x += p.vx * STEP; p.y += p.vy * STEP;
        if (act.t === 6) this.resolveSlide(p);
        if (act.t >= act.dur) { p.act = { type: 'down', t: 0, dur: 30 }; }
        this.boundPlayer(p);
        return;
      } else if (act.type === 'dive') {
        const k = act.t / act.dur;
        const tx = act.x, ty = act.y;
        const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
        const v = act.speed;
        if (d > 0.05) { const s = Math.min(d, v * STEP); p.x += dx / d * s; p.y += dy / d * s; }
        if (act.t >= act.dur) p.act = { type: 'down', t: 0, dur: act.hold ? 24 : 36 };
        return;
      } else if (act.type === 'tackle') {
        if (act.t === 8) this.resolveTackle(p);
        if (act.t >= act.dur) p.act = null;
        wx = p.wantX * 0.3; wy = p.wantY * 0.3; spd = 0.3;
      } else if (act.type === 'kick') {
        if (act.t >= act.wind) { this.fireKick(p, act.spec); p.act = { type: 'follow', t: 0, dur: 10 }; }
        else { wx = p.wantX ?? 0; wy = p.wantY ?? 0; spd = 0.35; }
      } else if (act.type === 'follow') {
        if (act.t >= act.dur) p.act = null;
        wx = p.wantX ?? 0; wy = p.wantY ?? 0; spd = 0.5;
      } else if (act.type === 'header' || act.type === 'jump') {
        if (act.t >= act.dur) p.act = null;
      } else if (act.t >= (act.dur ?? 30)) p.act = null;
    }
    if (!act || act.type === 'tackle' || act.type === 'kick' || act.type === 'follow') {
      if (!act) { wx = p.wantX ?? 0; wy = p.wantY ?? 0; spd = p.wantS ?? 0.7; }
    }
    // desired velocity
    const wl = Math.hypot(wx, wy);
    let mult = spd;
    const hasBall = this.owner === p;
    if (hasBall) mult = Math.min(mult, p.dribMode === 'close' ? 0.55 : p.dribMode === 'sprint' ? 0.97 : 0.8);
    if (p.jockey) mult = Math.min(mult, p.sprintJockey ? 0.75 : 0.58);
    let dvx = 0, dvy = 0;
    if (wl > 0.01) { dvx = wx / wl * top * mult; dvy = wy / wl * top * mult; }
    // turning with the ball costs speed
    if (hasBall && wl > 0.01) {
      const turn = Math.abs(angDiff(Math.atan2(dvy, dvx), p.face));
      const k = Math.max(0.3, Math.cos(Math.min(turn, Math.PI / 2)) * 0.8 + 0.2);
      dvx *= k; dvy *= k;
    }
    // accelerate toward desired
    const ex = dvx - p.vx, ey = dvy - p.vy, el = Math.hypot(ex, ey);
    const maxDv = (el > 0 && (dvx * p.vx + dvy * p.vy) < 0 ? acc * 1.6 : acc) * STEP;
    if (el > maxDv) { p.vx += ex / el * maxDv; p.vy += ey / el * maxDv; } else { p.vx = dvx; p.vy = dvy; }
    p.x += p.vx * STEP; p.y += p.vy * STEP;
    this.boundPlayer(p);
    // facing
    const sp = Math.hypot(p.vx, p.vy);
    let faceTo = p.face;
    if (p.jockey && this.owner && this.owner.team !== p.team) faceTo = Math.atan2(this.owner.y - p.y, this.owner.x - p.x);
    else if (hasBall && wl > 0.01) faceTo = Math.atan2(wy, wx);
    else if (sp > 0.6) faceTo = Math.atan2(p.vy, p.vx);
    else faceTo = Math.atan2(this.ball.y - p.y, this.ball.x - p.x);
    const rate = (hasBall ? 4.5 + 6 * (a.agi ?? 60) / 99 - sp * 0.25 : 9) * STEP;
    const d = angDiff(faceTo, p.face);
    p.face += clamp(d, -rate, rate);
    // stamina
    const sprinting = sp > top * 0.8;
    const drain = (sprinting ? 0.0045 : sp > 3 ? 0.0011 : -0.0028) * (1.35 - 0.7 * (a.sta ?? 60) / 99) * (4 / this.settings.half) ** 0.6;
    p.stamina = clamp(p.stamina - drain * STEP * (drain < 0 ? 1 : 1), 0.05, 1);
    p.speed = sp;
  }

  boundPlayer(p) {
    p.x = clamp(p.x, -PITCH.HALF_L - 4, PITCH.HALF_L + 4);
    p.y = clamp(p.y, -PITCH.HALF_W - 3, PITCH.HALF_W + 3);
  }

  // ---------------------------------------------------------------- ball in play
  giveBall(p, quiet) {
    if (this.owner && this.owner !== p) this.owner.dribMode = null;
    const prevTeam = this.owner ? this.owner.team : this.lastTouch.team;
    this.owner = p;
    this.path = null;
    p.touchPh = 0;
    const b = this.ball;
    b.vx = b.vy = b.vz = 0; b.spin = b.top = 0; b.z = 0; b.knuckle = 0;
    if (!quiet) {
      if (prevTeam !== p.team && prevTeam !== -1) { this.teams[p.team].lastWon = this.tick; this.teams[1 - p.team].lastLost = this.tick; }
      this.touch(p, 'control');
      // auto-switch: the user controls whoever on their team gets the ball
      for (const c of this.ctls) if (c.team === p.team && !p.ctl) this.control(c, p);
    }
    for (const t of this.teams) for (const q of t.on) if (q.gkSave) q.gkSave = null;
  }

  touch(p, kind) {
    // offside: a touch by an attacker flagged at the last pass
    if (this.offsideFlags && this.offsideFlags.team === p.team && this.offsideFlags.ids.has(p.id) && this.settings.offsides) {
      this.offsideFlags = null;
      this.callOffside(p);
      return false;
    }
    if (this.offsideFlags && this.offsideFlags.team !== p.team) this.offsideFlags = null;
    if (this.ifk && p.id !== this.ifk.taker) this.ifk = null;
    const lk = this.lastKick;
    if (lk && lk.pass && !lk.credited && lk.team === p.team && lk.pid !== p.id && this.tick - lk.tick < 240 && this.lastTouch.pid === lk.pid) {
      lk.credited = true;
      this.log('pass_ok', { pid: lk.pid, to: p.id, team: p.team });
    }
    this.lastTouch = { team: p.team, pid: p.id, kind, tick: this.tick };
    return true;
  }

  /** Dribble: keep the ball at the carrier's feet with a touch rhythm. */
  dribble(p) {
    const b = this.ball, sp = p.speed ?? 0;
    const mode = p.dribMode ?? 'normal';
    const far = mode === 'close' ? 0.5 : mode === 'sprint' ? 0.9 + sp * 0.16 : 0.55 + sp * 0.07;
    const near = 0.32;
    const period = mode === 'close' ? 14 : mode === 'sprint' ? 26 : 20;
    p.touchPh = (p.touchPh + 1) % period;
    if (p.touchPh === 0 && sp > 1) this.cue('touch', { soft: true });
    const ph = p.touchPh / period;
    const d = sp < 0.5 ? near : near + (far - near) * (1 - ph);
    p.exposed = clamp((d - 0.6) / 1.2, 0, 1);
    b.x = p.x + Math.cos(p.face) * d;
    b.y = p.y + Math.sin(p.face) * d;
    b.z = 0;
    b.vx = p.vx; b.vy = p.vy; b.vz = 0;
    // a heavy touch at full sprint under pressure: ball runs loose
    if (p.touchPh === 0 && mode === 'sprint' && sp > 6.5) {
      const opp = this.nearestOpp(p);
      const turn = Math.abs(angDiff(Math.atan2(p.vy, p.vx), p.face));
      const risk = (opp.d < 2.5 ? 0.06 : 0.008) * (1.5 - (p.attrs.dri ?? 60) / 99) + turn * 0.05;
      if (this.rng.chance(risk)) this.looseFromCarrier(p, 4.5 + sp * 0.4, p.face + this.rng.range(-0.5, 0.5), 'heavy');
    }
  }

  looseFromCarrier(p, speed, ang, why) {
    this.owner = null;
    const b = this.ball;
    b.vx = Math.cos(ang) * speed; b.vy = Math.sin(ang) * speed; b.vz = why === 'pop' ? 2.5 : 0;
    p.cool = 10;
    this.newPath();
    if (why) this.log('loose', { pid: p.id, team: p.team, why });
  }

  nearestOpp(p) {
    let best = null, bd = Infinity;
    for (const q of this.teams[1 - p.team].on) { if (!q.onPitch || q.red) continue; const d = dist(p, q); if (d < bd) { bd = d; best = q; } }
    return { p: best, d: bd };
  }

  newPath() { this.path = predict(this.ball, PATH_N, this.wb); this.pathT = this.tick; this.planSaves(); }

  stepBallLive() {
    const b = this.ball;
    if (this.owner) {
      const p = this.owner;
      if (p.act && p.act.type === 'down') { this.looseFromCarrier(p, 2, p.face, null); }
      else { if (p.skill) this.skillBall(p); else this.dribble(p); this.checkLine(); return; }
    }
    const ev = stepBall(b, this.wb, this.rng.range(-1, 1) * 0.06);
    if (ev & 1 && b.vz > 2) this.cue('bounce', {});
    if (ev & 2) { this.cue('post', {}); this.log('woodwork', { pid: this.lastKick?.pid, team: this.lastKick?.team }); this.newPath(); }
    if (ev & 4) return this.goalScored(b.netSide);
    if (b.inNet) return;
    if ((ev & 1) && this.path) {
      // bounces are on the predicted path already; re-sync if we drifted
      const off = this.tick - this.pathT;
      const pp = this.path[off - 1];
      if (!pp || Math.abs(pp.x - b.x) + Math.abs(pp.y - b.y) > 0.05) this.newPath();
    }
    if (this.checkLine()) return;
    this.saveContact();
    if (this.phase !== 'live' || this.owner) return;
    this.contestLoose();
  }

  /** Ball out of play over a line. Returns true if play stopped. */
  checkLine() {
    const b = this.ball;
    if (this.shootout) return false;
    if (Math.abs(b.y) > PITCH.HALF_W + PITCH.BALL_R) {
      const team = this.lastTouch.team === 0 ? 1 : 0;
      this.log('out', { kind: 'throw', team });
      this.startRestart('throw', team, clamp(b.x, -PITCH.HALF_L + 1, PITCH.HALF_L - 1), Math.sign(b.y) * PITCH.HALF_W);
      return true;
    }
    if (Math.abs(b.x) > PITCH.HALF_L + PITCH.BALL_R && !b.inNet) {
      const side = Math.sign(b.x);
      const defending = this.teams[0].dir === side ? 1 : 0;   // team that defends the goal at `side`
      const kind = goalLineRestart(this.lastTouch.team, defending);
      if (kind === 'corner') {
        const team = 1 - defending;
        this.log('out', { kind: 'corner', team });
        this.startRestart('corner', team, side * (PITCH.HALF_L - 0.3), Math.sign(b.y || 1) * (PITCH.HALF_W - 0.3));
      } else {
        this.log('out', { kind: 'goalkick', team: defending });
        this.startRestart('goalkick', defending, side * (PITCH.HALF_L - 5.5), Math.sign(b.y || 1) * 4);
      }
      return true;
    }
    return false;
  }

  /** Loose ball: who controls it, heads it, or blocks it this step. */
  contestLoose() {
    const b = this.ball;
    const bs = Math.hypot(b.vx, b.vy);
    let best = null, bd = Infinity;
    const cands = [];
    for (const p of this.players) {
      if (!p.onPitch || p.red || p.cool > 0) continue;
      if (p.act && (p.act.type === 'down' || p.act.type === 'stumble' || p.act.type === 'dive')) continue;
      const isGk = p.pos === 'GK' && inBox(p.x, p.y, -this.teams[p.team].dir);
      const reach = isGk ? 1.15 : 0.62 + (p.act?.type === 'slide' ? 0.6 : 0);
      const d = Math.hypot(p.x - b.x, p.y - b.y);
      const zMax = isGk ? 2.55 : 2.35 + (p.attrs.jmp ?? 60) / 99 * 0.45;
      if (d > reach + Math.max(0, bs * STEP) || b.z > zMax) continue;
      if (this.lastKick && this.lastKick.pid === p.id && this.tick - this.lastKick.tick < 14) continue;
      cands.push({ p, d, isGk });
    }
    if (!cands.length) return;
    // aerial duel / contest: weight by distance, ratings, intended receiver
    for (const c of cands) {
      const p = c.p;
      let w = 1 / (0.15 + c.d);
      if (b.z > 1.4) w *= 0.6 + (p.attrs.hea ?? 50) / 99 * 0.5 + (p.attrs.jmp ?? 50) / 99 * 0.4 + (p.h - 1.8) * 1.5;
      else w *= 0.8 + (p.attrs.ctl ?? 60) / 99 * 0.4;
      if (c.isGk) w *= 3;
      if (this.lastKick && this.lastKick.receiver === p.id) w *= 1.3;
      c.w = w;
    }
    let total = cands.reduce((s, c) => s + c.w, 0), r = this.rng.next() * total;
    for (const c of cands) { r -= c.w; if (r <= 0) { best = c; break; } }
    best = best ?? cands[0];
    this.ballContact(best.p, best.isGk);
  }

  /** A player meets a loose ball. Decides control, header, volley, block or first-time action. */
  ballContact(p, isGk) {
    const b = this.ball;
    const relV = Math.hypot(b.vx - p.vx, b.vy - p.vy, b.vz);
    const opp = this.nearestOpp(p);
    const team = this.teams[p.team];
    const fromOpp = this.lastTouch.team !== p.team;
    // keeper hands (not from a deliberate back-pass by foot)
    const backPass = !fromOpp && this.lastKick && this.lastKick.team === p.team && this.lastKick.foot && this.lastKick.tick > this.lastTouch.tick - 1;
    if (isGk && !backPass) {
      if (relV > 16 && this.rng.chance(0.25)) { this.parry(p, relV); return; }
      this.touch(p, 'gk_catch');
      if (this.phase !== 'live') return;
      this.log('gk_claim', { pid: p.id, team: p.team, aerial: b.z > 1.2 });
      this.giveBall(p, true);
      this.lastTouch = { team: p.team, pid: p.id, kind: 'gk', tick: this.tick };
      for (const c of this.ctls) if (c.team === p.team) { /* keep user's outfield player */ }
      p.holding = { t: 0 };
      this.cue('catch', {});
      return;
    }
    // fast shot at an outfield player: block
    const shotFly = this.lastKick && this.lastKick.type === 'shot' && this.tick - this.lastKick.tick < 90 && relV > 13;
    if (shotFly && fromOpp) {
      if (!this.touch(p, 'block')) return;
      this.log('block', { pid: p.id, team: p.team, shooter: this.lastKick.pid });
      // deflections: often looped behind for a corner, otherwise back out toward the shooter
      const behind = this.rng.chance(0.35);
      const ang = behind ? Math.atan2(b.vy, b.vx) + this.rng.range(-0.9, 0.9) : Math.atan2(b.vy, b.vx) + Math.PI + this.rng.range(-1.2, 1.2);
      const s = relV * (behind ? this.rng.range(0.3, 0.55) : this.rng.range(0.2, 0.45));
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.vz = this.rng.range(0.5, 4);
      p.cool = 8;
      this.cue('block', {});
      this.newPath();
      return;
    }
    // buffered first-time action from a human, or AI first-time decision
    const queued = p.queued && this.tick - p.queued.tick < 40 ? p.queued : null;
    p.queued = null;
    // teammates' balls up to chest height are controlled (chest/thigh); higher ones, and contested balls, are headed
    const aerial = b.z > (fromOpp || queued ? 1.25 : 1.85);
    if (aerial) return this.header(p, queued);
    if (queued) {
      if (!this.touch(p, 'first_time')) return;
      if (this.phase !== 'live') return;
      this.owner = p; // momentary, so the kick code sees the carrier
      this.fireKick(p, queued.spec(this, p), true);
      return;
    }
    // stretching for an opponent's ball near the own goal or touchline: it flicks off the defender and out
    if (fromOpp && relV > 5 && this.lastKick && this.lastKick.team !== p.team && this.lastKick.type !== 'shot') {
      const ownLineX = -team.dir * PITCH.HALF_L;
      const nearLine = Math.abs(ownLineX - p.x) < 18 && Math.abs(p.y) < 26;
      const nearTouch = Math.abs(p.y) > PITCH.HALF_W - 9;
      const pch = (nearLine ? MODEL.DEFLECT_BEHIND : nearTouch ? MODEL.DEFLECT_TOUCH : 0) * (p.ctl ? 0.5 : 1) * (opp.d < 2.5 ? 1.4 : 1);
      if (pch && this.rng.chance(pch)) {
        if (!this.touch(p, 'deflect')) return;
        if (this.phase !== 'live') return;
        const tx = nearLine ? ownLineX - team.dir * 3 : p.x + this.rng.range(-6, 6);
        const ty = nearLine ? (p.y >= 0 ? 1 : -1) * this.rng.range(5, 20) : (p.y >= 0 ? 1 : -1) * (PITCH.HALF_W + 3);
        const ang = Math.atan2(ty - p.y, tx - p.x), sp = this.rng.range(9, 13);
        b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp; b.vz = this.rng.range(0.5, 4);
        p.cool = 12;
        this.log('clearance', { pid: p.id, team: p.team, deflect: true });
        this.lastKick = { pid: p.id, team: p.team, type: 'clear', tick: this.tick, foot: true };
        this.newPath();
        return;
      }
    }
    const ft = !p.ctl && AI.firstTime(this, p);
    if (ft) {
      if (!this.touch(p, 'first_time')) return;
      if (this.phase !== 'live') return;
      this.owner = p;
      this.fireKick(p, ft, true);
      return;
    }
    // control
    const help = p.ctl ? this.diff.userTouch : 0;
    const pc = controlProb(p, relV, b.z, opp.d, help);
    if (!this.touch(p, 'control')) return;
    if (this.phase !== 'live') return;
    if (this.rng.chance(pc)) {
      if (fromOpp && this.lastKick && this.lastKick.team !== p.team && this.tick - this.lastKick.tick < 150) this.log('interception', { pid: p.id, team: p.team });
      this.giveBall(p);
      p.face = Math.atan2(p.wantY || (b.y - p.y), p.wantX || (b.x - p.x));
    } else {
      // heavy touch
      this.log('miscontrol', { pid: p.id, team: p.team });
      const ang = Math.atan2(b.vy, b.vx) + this.rng.range(-1, 1);
      const s = Math.max(2.5, relV * this.rng.range(0.25, 0.5));
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.vz = this.rng.range(0, 1.5);
      p.cool = 12;
      this.newPath();
    }
  }

  header(p, queued) {
    const b = this.ball, t = this.teams[p.team];
    if (!this.touch(p, 'header')) return;
    if (this.phase !== 'live') return;
    p.act = { type: 'header', t: 0, dur: 20 };
    this.cue('header', {});
    const goalX = t.dir * PITCH.HALF_L;
    const dGoal = Math.hypot(goalX - p.x, p.y);
    const wantShot = queued ? queued.kind === 'shot' : (!p.ctl && dGoal < 16 && Math.abs(p.y) < 12);
    const ownDanger = Math.abs(-goalX - p.x) < 30;
    const lastPass = this.lastKick;
    if (wantShot && dGoal < 22) {
      this.owner = p;
      const spec = AI.shotSpec(this, p, 'header', queued?.power ?? 0.7, queued?.aim);
      this.fireKick(p, spec, true);
      return;
    }
    if (queued && queued.kind === 'pass') { this.owner = p; this.fireKick(p, { ...queued.spec(this, p), type: 'header' }, true); return; }
    const ownLineX = -goalX;
    if (queued?.kind !== 'shot' && this.lastTouch.team !== p.team && Math.abs(ownLineX - p.x) < 24 && Math.abs(p.y) < 26 && this.rng.chance(MODEL.HEAD_BEHIND)) {
      // under pressure from a cross: glanced or looped back over the line for a corner
      const ty = (p.y >= 0 ? 1 : -1) * this.rng.range(9, 22), tx = ownLineX - t.dir * 4;
      const ang = Math.atan2(ty - p.y, tx - p.x), s = this.rng.range(11, 15);
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.vz = this.rng.range(3, 6);
      p.cool = 10;
      this.log('clearance', { pid: p.id, team: p.team, header: true, behind: true });
      this.lastKick = { pid: p.id, team: p.team, type: 'clear', tick: this.tick, foot: false };
      this.newPath();
      return;
    }
    if (ownDanger || (!queued && this.lastTouch.team !== p.team && this.rng.chance(0.6))) {
      // clearance header: away from goal, wide
      const ang = (t.dir > 0 ? 0 : Math.PI) + this.rng.range(-0.8, 0.8);
      const s = 10 + (p.attrs.hea ?? 60) / 99 * 8;
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.vz = this.rng.range(3, 7);
      p.cool = 10;
      this.log('clearance', { pid: p.id, team: p.team, header: true });
      this.lastKick = { pid: p.id, team: p.team, type: 'clear', tick: this.tick, foot: false };
      this.newPath();
      return;
    }
    // header down / pass to a teammate
    this.owner = p;
    const spec = AI.passSpec(this, p, 'header');
    if (spec) { this.fireKick(p, { ...spec, type: 'header' }, true); return; }
    this.owner = null;
    b.vx *= -0.3; b.vy *= -0.3; b.vz = 1;
    this.newPath();
    void lastPass;
  }

  parry(gk, speed) {
    const b = this.ball, t = this.teams[gk.team];
    this.touch(gk, 'save');
    const side = Math.sign(b.y - gk.y) || (this.rng.chance(0.5) ? 1 : -1);
    // half of parries are pushed round the post / over the bar for a corner, the rest back into play
    const behind = this.rng.chance(0.5);
    const r = this.rng.range(1.3, 1.48);   // mostly sideways, so it goes round the post rather than in
    const ang = behind ? Math.atan2(side * Math.sin(r), -t.dir * Math.cos(r)) : (t.dir > 0 ? 0 : Math.PI) + side * this.rng.range(0.6, 1.3);
    const s = speed * this.rng.range(0.25, 0.45);
    b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s; b.vz = this.rng.range(1, 4);
    gk.cool = 15;
    this.cue('save', {});
    this.newPath();
  }

  // ---------------------------------------------------------------- keeper saves
  /** After every new ball path: if it is heading into (or near) a goal, plan the keeper's attempt. */
  planSaves() {
    const path = this.path;
    if (!path) return;
    for (const t of this.teams) {
      const gk = this.gk(t.idx);
      if (!gk) continue;
      gk.gkSave = null;
      const side = -t.dir;
      const gx = side * PITCH.HALF_L;
      // find where the path crosses the goal line
      let cross = -1;
      for (let i = 0; i < path.length; i++) if (side * path[i].x >= PITCH.HALF_L - 0.02) { cross = i; break; }
      if (cross < 0) continue;
      const c = path[cross];
      if (Math.abs(c.y) > PITCH.GOAL_HALF_W + 1.2 || c.z > PITCH.GOAL_H + 1.0) continue;
      if (gk.act && gk.act.type === 'down') continue;
      if (this.owner) continue;
      const onTarget = Math.abs(c.y) < PITCH.GOAL_HALF_W && c.z < PITCH.GOAL_H;
      // the keeper's plane: where the ball passes the keeper's x (or the line)
      let idx = cross;
      for (let i = 0; i < cross; i++) if (side * path[i].x >= side * gk.x) { idx = i; break; }
      const pt = path[idx];
      const tSec = (idx + 1) * STEP;
      const kr = keeperReach(gk, t.cpu ? this.diff.gkReach : 1);
      let gky = gk.y;
      const pen = this.penGuess && this.penGuess.tick === this.tick && this.penGuess.team === t.idx ? this.penGuess : null;
      if (pen) gky = pen.side * 1.9;
      let lateral = Math.hypot(pt.y - gky, Math.max(0, Math.abs(pt.x - gk.x) - 0.3));
      if (pen && pen.side && Math.sign(pt.y) !== pen.side && Math.abs(pt.y) > 0.8) lateral = 99;
      if (pen && !pen.side && Math.abs(pt.y) > 1.2) lateral = 99;
      const high = Math.max(0, pt.z - 2.3);
      const eff = Math.hypot(lateral, high);
      const avail = kr.reach + Math.max(0, tSec - kr.react) * kr.speed;
      const capped = Math.min(avail, kr.reach + 2.6);
      const shooter = this.lastKick;
      const reachable = eff <= capped && (tSec > kr.react * 0.6 || eff < 0.8);
      const stretch = clamp(eff / Math.max(0.5, capped), 0, 1);
      let ok = reachable;
      if (ok && onTarget) {
        let pSave = clamp(0.97 - stretch * stretch * 0.45 - (pt.v > 26 ? 0.09 : 0), 0.28, 0.99);
        // penalties: guessing right is half the job; corners and height beat even a good guess
        if (pen && pen.side && Math.abs(pt.y) < 0.8) pSave = 0.15;   // down the middle while he dives: only a trailing leg
        else if (pen) pSave = pen.side ? clamp(0.62 - Math.max(0, Math.abs(pt.y) - 2) * 0.3 - (pt.z > 1.7 ? 0.25 : 0) - (pt.v > 24 ? 0.1 : 0), 0.08, 0.7) : 0.85;
        ok = this.rng.chance(pSave);
      }
      if (!onTarget && !reachable) continue;
      if (!onTarget && reachable) ok = stretch < 0.6;   // gather wide shots only when easy
      gk.gkSave = { idx: this.pathT + idx, x: pt.x, y: pt.y, z: pt.z, ok, onTarget, speed: pt.v, stretch, kind: ok ? saveKind(gk, pt.v, stretch, this.rng) : 'miss', shooter: shooter?.pid };
      // start the dive (after reaction)
      const lat = Math.abs(pt.y - gk.y);
      const delay = Math.max(1, Math.round(kr.react * 60 * 0.8));
      gk.diveAt = this.tick + delay;
      gk.diveTo = { x: side * Math.min(PITCH.HALF_L - 0.2, Math.abs(pt.x) ) , y: ok ? pt.y : gk.y + Math.sign(pt.y - gk.y) * Math.min(lat, capped - 0.2), z: pt.z, dur: Math.max(8, idx - delay) };
      if (lat < 0.6 && pt.z < 1.6) gk.diveTo.stand = true;
      if (pen) {
        // committed early: he goes where he guessed, wherever the ball goes
        gk.diveAt = this.tick + 2;
        gk.diveTo = { x: gk.x, y: pen.side ? (ok ? pt.y : pen.side * 2.6) : gk.y, z: ok ? pt.z : 0.8, dur: Math.max(10, idx - 2), stand: !pen.side };
      }
    }
  }

  saveContact() {
    for (const t of this.teams) {
      const gk = this.gk(t.idx);
      if (!gk) continue;
      if (gk.diveAt && this.tick >= gk.diveAt && gk.diveTo) {
        const d = gk.diveTo;
        if (!d.stand && (!gk.act || gk.act.type !== 'dive')) gk.act = { type: 'dive', t: 0, dur: d.dur, x: d.x, y: d.y, z: d.z, speed: Math.hypot(d.y - gk.y, d.x - gk.x) / Math.max(1, d.dur) * 60 + 0.5, side: Math.sign(d.y - gk.y) * t.dir, hold: false };
        gk.diveAt = 0;
      }
      const s = gk.gkSave;
      if (!s || this.owner) continue;
      if (this.tick < s.idx) continue;
      gk.gkSave = null;
      gk.diveTo = null;
      if (!s.ok) continue;
      const b = this.ball;
      if (Math.abs(b.x - s.x) + Math.abs(b.y - s.y) > 1.5) continue;   // path changed
      const shooter = s.shooter;
      if (s.onTarget) this.log('save', { pid: gk.id, team: gk.team, shooter, kind: s.kind });
      this.touch(gk, 'save');
      if (this.phase !== 'live') return;
      if (s.kind === 'catch') {
        this.giveBall(gk, true);
        this.lastTouch = { team: gk.team, pid: gk.id, kind: 'gk', tick: this.tick };
        gk.holding = { t: 0 };
        if (gk.act?.type === 'dive') gk.act.hold = true;
        this.cue('catch', {});
      } else if (s.kind === 'parry') {
        this.parry(gk, s.speed);
      } else {
        b.vx *= -0.15; b.vy = (b.vy * 0.2) + this.rng.range(-2, 2); b.vz = 0.8;
        this.cue('save', {});
        gk.cool = 18;
        this.newPath();
      }
      return;
    }
  }

  // ---------------------------------------------------------------- kicks
  /** Start a kick with a wind-up (the ball leaves on the contact frame). */
  startKick(p, spec, wind) {
    p.act = { type: 'kick', t: 0, wind, spec, kind: spec.type };
  }

  /**
   * Release the ball. spec: { type, tx, ty, tz?, power, receiver?, curl?, top?, speed?, angle?, shotType?, timed? }
   * types: ground driven through lob lofted cross clear throw header shot gkthrow gkkick
   */
  fireKick(p, spec, firstTime = false) {
    if (this.owner !== p) return;
    if (!spec) { if (firstTime) this.giveBall(p); return; }
    const b = this.ball, t = this.teams[p.team];
    const opp = this.nearestOpp(p);
    const press = pressureMult(p, opp.d);
    const diffMult = t.cpu ? this.diff.cpuPassErr : this.diff.userPassErr;
    const startX = b.x, startY = b.y;
    const weak = this.weakFoot(p, Math.atan2(spec.ty - p.y, spec.tx - p.x));
    this.owner = null;
    b.z = Math.max(b.z, spec.type === 'throw' || spec.type === 'gkthrow' ? 1.9 : spec.type === 'header' ? 2.0 : b.z);
    const type = spec.type;
    if (spec.setPiece === 'penalty') this.penaltyGuess(p);
    const restartKick = this.phase !== 'live';
    if (restartKick) this.phase = 'live';
    const firstMult = firstTime ? 1.25 : 1;
    let kickRec = { pid: p.id, team: p.team, type: type === 'shot' ? 'shot' : type, tick: this.tick, receiver: spec.receiver ?? null, foot: type !== 'header' && type !== 'throw' && type !== 'gkthrow', pass: type !== 'shot' && type !== 'clear' };
    if (type === 'shot') {
      const sgn = t.dir;
      const goalX = sgn * PITCH.HALF_L;
      const dGoal = Math.hypot(goalX - startX, startY);
      const st = spec.shotType ?? 'normal';
      const tm = MODEL.TIMED[spec.timed ?? 'none'] ?? 1;
      const diffS = t.cpu ? this.diff.cpuShotErr : 1;
      let err = shotError(p, st, dGoal, press, weak, tm, diffS) * firstMult * (spec.errMult ?? 1);
      let power = clamp(spec.power ?? 0.7, 0.05, 1) * (spec.timed === 'perfect' ? 1.05 : 1);
      let speed = shotSpeed(p, st, power);
      // aim point in the goal mouth
      let ty = spec.ty, tz = spec.tz ?? 0.6;
      ty += this.rng.normal(0, err) * dGoal;
      tz += this.rng.normal(0, err * 0.85) * dGoal + Math.max(0, power - 0.8) * 2.2 * (1.1 - (p.attrs.sho ?? 60) / 99) + (power >= 0.99 ? this.rng.range(0, 1.2) : 0);
      if (st === 'header') tz = clamp(tz, 0.1, 3.5);
      tz = Math.max(0.12, tz);
      const curl = spec.curl ?? (st === 'finesse' ? -Math.sign(ty - startY || 1) * sgn * 1.6 : 0);
      if (st === 'chip') {
        const D = Math.hypot(goalX - startX, ty - startY);
        const ang = 0.72;
        const v = loftSpeedFor(D + 0.6, ang, this.wb) * (1 + this.rng.normal(0, err * 0.8));
        const h = Math.atan2(ty - startY, goalX - startX);
        b.vx = Math.cos(h) * v * Math.cos(ang); b.vy = Math.sin(h) * v * Math.cos(ang); b.vz = v * Math.sin(ang);
        b.spin = 0; b.top = 0;
      } else {
        this.aimBall(goalX, ty, tz, speed, curl, st === 'power' ? 0 : 0);
      }
      b.knuckle = spec.knuckle ? 1 : 0;
      const xgv = spec.shotType === 'penalty' ? 0.78 : xg(startX, startY, sgn, st === 'header' ? 'header' : 'foot', press);
      this.log('shot', { pid: p.id, team: p.team, x: startX, y: startY, xg: Math.round(xgv * 1000) / 1000, kind: st, timed: spec.timed ?? null, dist: Math.round(dGoal), setPiece: spec.setPiece ?? null, inBox: inBox(startX, startY, sgn) });
      this.cue('kick', { power: speed / 30, shot: true, timed: spec.timed });
      kickRec.shotType = st;
      kickRec.xg = xgv;
    } else {
      const D = Math.max(1, Math.hypot(spec.tx - startX, spec.ty - startY));
      const ptype = type === 'driven' ? 'driven' : type === 'lofted' ? 'lob' : type === 'clear' ? 'clear' : type === 'gkkick' ? 'lob' : type === 'gkthrow' ? 'throw' : type;
      const e = passError(p, MODEL.PASS_ERR[ptype] ? ptype : 'ground', D, press, weak, diffMult * firstMult * (spec.errMult ?? 1));
      const ang = Math.atan2(spec.ty - startY, spec.tx - startX) + this.rng.normal(0, e.ang);
      const pw = 1 + this.rng.normal(0, e.pow);
      const power = clamp(spec.power ?? 0.5, 0, 1.1);
      if (type === 'ground' || type === 'driven' || type === 'through' || type === 'throw' && spec.short || type === 'gkthrow' && spec.roll) {
        const va = type === 'driven' ? 10 : type === 'through' ? 4.5 : 7;
        let v = groundSpeedFor(D, va, this.wb);
        if (spec.manualPower != null) v = 4 + spec.manualPower * 26;
        v *= pw * (0.92 + power * 0.16);
        if (type === 'throw') v = Math.min(v, 14);
        b.vx = Math.cos(ang) * v; b.vy = Math.sin(ang) * v; b.vz = type === 'throw' || type === 'gkthrow' ? 0 : 0;
        if (type === 'throw') { b.z = 1.9; b.vz = 1.5; }
      } else if (type === 'header') {
        const v = 6 + D * 0.45; b.vx = Math.cos(ang) * v; b.vy = Math.sin(ang) * v; b.vz = 2 + D * 0.12;
      } else {
        // lofted family
        const angle = spec.angle ?? { lob: 0.62, lofted: 0.55, cross: spec.low ? 0.18 : spec.whip ? 0.3 : 0.42, clear: 0.6, throw: 0.5, gkthrow: 0.45, gkkick: 0.62 }[type] ?? 0.5;
        const top = spec.top ?? 0;
        let landD = D * (type === 'cross' ? 1 : 0.94);
        let v = loftSpeedFor(landD, angle, this.wb, top);
        if (type === 'throw') v = Math.min(v, 17);
        v *= pw;
        b.vx = Math.cos(ang) * v * Math.cos(angle); b.vy = Math.sin(ang) * v * Math.cos(angle); b.vz = v * Math.sin(angle);
        b.spin = spec.curl ?? 0; b.top = top;
      }
      this.cue('kick', { power: Math.hypot(b.vx, b.vy) / 30 });
      const fwd = (spec.tx - startX) * t.dir;
      this.log('pass', { pid: p.id, team: p.team, kind: type, to: spec.receiver ?? null, x: startX, y: startY, tx: spec.tx, ty: spec.ty, fwd: Math.round(fwd), cross: type === 'cross', setPiece: spec.setPiece ?? null });
    }
    this.lastKick = kickRec;
    p.cool = 10;
    p.dribMode = null;
    // offside snapshot at the moment of the pass
    if (this.settings.offsides && !(restartKick && NO_OFFSIDE_RESTART.has(this.restart?.type))) {
      const defs = this.teams[1 - p.team].on.filter((q) => q.onPitch && !q.red);
      const ids = new Set();
      for (const q of t.on) if (q !== p && q.onPitch && !q.red && offsidePosition(q, t.dir, startX, defs)) ids.add(q.id);
      this.offsideFlags = ids.size ? { team: p.team, ids, x: startX } : null;
    } else this.offsideFlags = null;
    if (restartKick) {
      if (this.restart?.type === 'freekick' && this.restart.indirect) this.ifk = { taker: p.id };
      this.restart = null;
    }
    this.touch(p, type);
    this.newPath();
    // the user takes over the intended receiver
    if (spec.receiver != null && type !== 'shot') {
      const r = this.byId.get(spec.receiver);
      for (const c of this.ctls) if (c.team === p.team && r && !r.ctl && c.assist.autoSwitch !== 'manual') this.control(c, r);
      if (r) r.expect = { tick: this.tick, x: spec.tx, y: spec.ty };
    }
  }

  weakFoot(p, ang) {
    // side of the body: kicking across to the weak side
    const rel = angDiff(ang, p.face);
    const leftSide = rel < -0.3;
    return p.foot === 'L' ? !leftSide && rel > 0.3 : leftSide;
  }

  /** Set ball velocity so it passes through (tx, ty, tz) at x = tx (shots) with horizontal speed ~ speed and curl (m). */
  aimBall(tx, ty, tz, speed, curl) {
    const b = this.ball;
    const sx = b.x, sy = b.y, sz = b.z;
    let dirY = ty - curl, dz = tz;
    let vz = 0, h = speed;
    const D = Math.hypot(tx - sx, ty - sy);
    const tFly = D / (speed * 0.88);
    const spin = curl ? (2 * curl) / (0.055 * speed * tFly * tFly) * -1 : 0;
    for (let it = 0; it < 5; it++) {
      const ang = Math.atan2(dirY - sy, tx - sx);
      const tt = Math.hypot(tx - sx, dirY - sy) / (h * 0.88);
      vz = (dz - sz) / tt + 0.5 * G * tt;
      const c = { ...b, vx: Math.cos(ang) * h, vy: Math.sin(ang) * h, vz, spin, top: 0, inNet: 0 };
      // fly the copy to the plane x = tx
      let hit = null;
      for (let i = 0; i < 240; i++) {
        const px = c.x, py = c.y, pz = c.z;
        stepBall(c, this.wb);
        if ((px - tx) * (c.x - tx) <= 0) { const k = (tx - px) / ((c.x - px) || 1e-6); hit = { y: py + (c.y - py) * k, z: pz + (c.z - pz) * k }; break; }
        if (c.inNet) { hit = { y: c.y, z: c.z }; break; }
      }
      if (!hit) break;
      dirY += (ty - hit.y);
      dz += (tz - hit.z) * 0.9;
      if (Math.abs(ty - hit.y) < 0.05 && Math.abs(tz - hit.z) < 0.05) break;
    }
    const ang = Math.atan2(dirY - sy, tx - sx);
    const tt = Math.hypot(tx - sx, dirY - sy) / (h * 0.88);
    vz = (dz - sz) / tt + 0.5 * G * tt;
    b.vx = Math.cos(ang) * h; b.vy = Math.sin(ang) * h; b.vz = vz; b.spin = spin; b.top = 0;
  }

  // ---------------------------------------------------------------- tackles and fouls
  tryTackle(p, kind) {
    if (p.act) return;
    if (kind === 'slide') {
      const car = this.owner && this.owner.team !== p.team ? this.owner : null;
      const tgt = car ? { x: this.ball.x, y: this.ball.y } : this.ball;
      const ang = Math.atan2(tgt.y - p.y, tgt.x - p.x);
      p.act = { type: 'slide', t: 0, dur: 30, ang, v0: Math.max(6, (p.speed ?? 4) + 2) };
      this.cue('slide', {});
      return;
    }
    p.act = { type: 'tackle', t: 0, dur: 20 };
  }

  resolveTackle(p) {
    const car = this.owner;
    if (!car || car.team === p.team || car.holding) return;   // a keeper's hands are off limits
    const d = Math.hypot(this.ball.x - p.x, this.ball.y - p.y);
    const dc = dist(p, car);
    if (d > 1.45 && dc > 1.25) { p.act = { type: 'stumble', t: 0, dur: 18 }; return; }
    const fromBehind = this.fromBehind(p, car);
    const t = this.teams[p.team];
    const timing = t.cpu ? this.diff.tackleTiming : 0.8;
    const odds = tackleOdds(p, car, car.exposed ?? 0, timing);
    const strict = MODEL.STRICT[this.settings.fouls] ?? 1;
    const r = this.rng.next();
    let outcome = r < odds.win ? 'win' : r < odds.win + odds.loose ? 'loose' : 'fail';
    const fo = foulOdds(p, 'stand', fromBehind, outcome !== 'fail', strict);
    if (this.rng.chance(fo.foul * (outcome === 'fail' ? 1.6 : 0.5))) return this.foul(p, car, 'stand', fo);
    this.log('tackle', { pid: p.id, team: p.team, on: car.id, won: outcome !== 'fail', outcome });
    this.cue('tackle', {});
    if (outcome === 'win') { this.giveBall(p); }
    else if (outcome === 'loose') this.looseFromCarrier(car, this.rng.range(3, 6), Math.atan2(car.y - p.y, car.x - p.x) + this.rng.range(-1.2, 1.2), 'tackle');
    else p.act = { type: 'stumble', t: 0, dur: 22 };
  }

  resolveSlide(p) {
    const b = this.ball;
    const car = this.owner && this.owner.team !== p.team && !this.owner.holding ? this.owner : null;
    const db = Math.hypot(b.x - p.x, b.y - p.y);
    const strict = MODEL.STRICT[this.settings.fouls] ?? 1;
    // the slide covers ~3 m: check over the next few steps by looking ahead at its path
    const reachBall = db < 2.6;
    const victim = car ?? this.players.find((q) => q.team !== p.team && q.onPitch && !q.red && dist(q, p) < 1.9);
    if (car && reachBall) {
      const ballFirst = db < 2.2;
      const fromBehind = this.fromBehind(p, car);
      const fo = foulOdds(p, 'slide', fromBehind, ballFirst, strict);
      const win = clamp(MODEL.SLIDE_BASE + ((p.attrs.sld ?? 50) - (car.attrs.dri ?? 60)) / 99 * 0.9 + (car.exposed ?? 0) * 0.25, 0.1, 0.9);
      if (this.rng.chance(fo.foul)) return this.foul(p, car, 'slide', fo);
      if (this.rng.chance(win)) {
        this.log('tackle', { pid: p.id, team: p.team, on: car.id, won: true, outcome: 'slide' });
        this.looseFromCarrier(car, this.rng.range(4, 8), p.act.ang + this.rng.range(-0.7, 0.7), 'tackle');
        this.cue('tackle', {});
      } else this.log('tackle', { pid: p.id, team: p.team, on: car.id, won: false, outcome: 'slide' });
    } else if (!car && db < 2.4 && b.z < 0.6 && !this.owner) {
      // slide block / poke on a loose ball
      const ang = p.act.ang + this.rng.range(-0.6, 0.6);
      const s = this.rng.range(5, 10);
      b.vx = Math.cos(ang) * s; b.vy = Math.sin(ang) * s;
      this.touch(p, 'slide');
      this.newPath();
    } else if (victim && dist(victim, p) < 1.3) {
      const fo = foulOdds(p, 'slide', this.fromBehind(p, victim), false, strict);
      if (this.rng.chance(fo.foul * 1.5)) this.foul(p, victim, 'slide', fo);
    }
  }

  fromBehind(def, car) {
    const ang = Math.atan2(def.y - car.y, def.x - car.x);
    return Math.abs(angDiff(ang, car.face)) > 2.2;
  }

  foul(def, victim, kind, fo) {
    const vt = this.teams[victim.team];
    this.cue('whistle', {});
    victim.act = { type: 'down', t: 0, dur: 50 };
    const ev = this.log('foul', { pid: def.id, team: def.team, on: victim.id, kind, x: victim.x, y: victim.y });
    // card
    let card = null;
    const goalX = vt.dir * PITCH.HALF_L;
    const dogso = this.owner === victim && Math.abs(goalX - victim.x) < 30 && Math.abs(victim.y) < 18 && this.lastDefender(def, victim);
    if (dogso && !inBox(victim.x, victim.y, vt.dir)) card = 'R';
    else if (this.rng.chance(fo.red)) card = 'R';
    else if (this.rng.chance(fo.yellow) || dogso) card = 'Y';
    // advantage: fouled team keeps a good attack going
    const keeps = this.owner && this.owner.team === victim.team && this.owner !== victim;
    if (keeps && !inBox(victim.x, victim.y, vt.dir) && (this.ball.x * vt.dir) > 0 && this.settings.fouls !== 'off') {
      this.advantage = { team: victim.team, tick: this.tick, x: victim.x, y: victim.y, card, def: def.id };
      this.cue('advantage', {});
      this.log('advantage', { team: victim.team });
      if (card) this.pendingCard = { pid: def.id, card };
      return;
    }
    if (card) this.giveCard(def, card);
    this.injuryCheck(victim, kind === 'slide' ? 0.035 : 0.012);
    if (inBox(victim.x, victim.y, vt.dir)) {
      this.log('penalty_given', { team: victim.team, on: victim.id, by: def.id });
      this.startRestart('penalty', victim.team, vt.dir * (PITCH.HALF_L - PITCH.PEN_SPOT), 0);
    } else this.startRestart('freekick', victim.team, victim.x, victim.y);
    void ev;
  }

  lastDefender(def, victim) {
    const t = this.teams[def.team];
    const goalX = -t.dir * PITCH.HALF_L;
    const vx = Math.abs(goalX - victim.x);
    const between = t.on.filter((q) => q.onPitch && !q.red && q !== def && q.pos !== 'GK' && Math.abs(goalX - q.x) < vx - 1);
    return between.length === 0;
  }

  giveCard(p, card) {
    const r = applyCard(p, card);
    p.yellow = r.yellow;
    this.dead.cards++;
    this.log('card', { pid: p.id, team: p.team, card: r.red ? 'R' : 'Y', second: r.second });
    this.cue('card', { pid: p.id, red: r.red });
    if (r.red) this.sendOff(p);
  }

  sendOff(p) {
    p.red = true; p.onPitch = false;
    for (const c of this.ctls) if (c.pid === p.id) { c.pid = null; p.ctl = null; this.autoSelect(c); }
    if (this.owner === p) this.owner = null;
    const t = this.teams[p.team];
    t.off.push(p);
    this.players = this.players.filter((q) => q !== p);
    if (t.on.filter((q) => q.onPitch).length < 7) { this.abandoned = p.team; this.finish(); }
  }

  injuryCheck(p, chance) {
    if (!this.settings.injuries) return;
    if (!this.rng.chance(chance)) return;
    const sev = this.rng.chance(0.75) ? 'minor' : this.rng.chance(0.8) ? 'moderate' : 'serious';
    this.log('injury', { pid: p.id, team: p.team, sev });
    this.cue('injury', { pid: p.id, sev });
    if (sev !== 'minor') { p.injured = sev; this.dead.injurySecs += sev === 'serious' ? 90 : 30; if (this.teams[p.team].cpu || this.autoSubsFor(p.team)) this.queueInjurySub(p); }
  }

  autoSubsFor(team) { return this.teams[team].autoSubs ?? this.teams[team].cpu; }

  queueInjurySub(p) {
    const t = this.teams[p.team];
    const sub = AI.pickSub(this, t, p);
    if (sub) t.pendingSubs.push({ off: p.id, on: sub.id });
  }

  stepAdvantage() {
    const a = this.advantage;
    if (!a) return;
    const age = this.tick - a.tick;
    const lost = !this.owner ? false : this.owner.team !== a.team;
    if (lost && age < 180) {
      // bring it back
      this.advantage = null;
      this.log('advantage_back', { team: a.team });
      if (this.pendingCard) { const p = this.byId.get(this.pendingCard.pid); if (p && !p.red) this.giveCard(p, this.pendingCard.card); this.pendingCard = null; }
      this.cue('whistle', {});
      return this.startRestart('freekick', a.team, a.x, a.y);
    }
    if (age >= 180) this.advantage = null;
  }

  callOffside(p) {
    const t = this.teams[1 - p.team];
    this.cue('whistle', {});
    this.cue('offside', { pid: p.id });
    this.log('offside', { pid: p.id, team: p.team, x: p.x, y: p.y });
    this.startRestart('freekick', t.idx, p.x, p.y, { indirect: true, offside: true });
  }

  // ---------------------------------------------------------------- goals
  goalScored(side) {
    if (this.shootout) { this.cue('net', {}); return; }
    const scoring = this.teams[0].dir === side ? 0 : 1;   // the team attacking goal `side`
    const lt = this.lastTouch;
    const recentShot = [...this.events].reverse().find((e) => e.type === 'shot' && e.tick > this.tick - 150);
    // a save, parry or block that still goes in counts for the shooter, not as an own goal
    const deflected = recentShot && recentShot.team === scoring && lt.team !== scoring && ['save', 'gk_catch', 'block', 'gk'].includes(lt.kind);
    const own = lt.team !== scoring && lt.team !== -1 && !deflected;
    // indirect free kick straight in: goal kick (or corner if own) instead
    if (this.ifk && lt.pid === this.ifk.taker) {
      this.ifk = null;
      this.log('ifk_direct', { team: lt.team });
      const defending = 1 - scoring;
      this.startRestart(own ? 'corner' : 'goalkick', own ? scoring : defending, side * (PITCH.HALF_L - 5.5), 4);
      return;
    }
    const t = this.teams[scoring];
    t.score++;
    this.dead.goals++;
    const shot = [...this.events].reverse().find((e) => e.type === 'shot' && e.tick > this.tick - 400);
    const scorer = deflected ? recentShot.pid : own ? lt.pid : (lt.team === scoring ? lt.pid : (shot && shot.team === scoring ? shot.pid : lt.pid));
    // assist: last completed pass to the scorer by a teammate
    let assist = null;
    if (!own) {
      for (let i = this.events.length - 1; i >= 0 && i > this.events.length - 60; i--) {
        const e = this.events[i];
        if (e.type === 'pass_ok' && e.to === scorer && e.team === scoring) { assist = e.pid; break; }
        if (e.type === 'pass' && e.team === scoring && e.pid !== scorer && (e.to === scorer || e.tick > (shot?.tick ?? 0) - 240) && this.tick - e.tick < 600) { assist = e.pid; break; }
        if (e.type === 'kickoff' || e.type === 'goal') break;
      }
    }
    const ev = this.log('goal', { team: scoring, pid: scorer, own, assist, kind: shot?.kind ?? 'normal', setPiece: shot?.setPiece ?? null, score: [this.teams[0].score, this.teams[1].score] });
    this.cue('goal', { team: scoring, pid: scorer, own });
    this.phase = 'goal';
    this.goalTick = this.tick;
    this.goalT = 0;
    this.owner = null;
    this.offsideFlags = null;
    this.advantage = null;
    const sp = this.byId.get(scorer);
    if (sp && !own) sp.act = { type: 'celebrate', t: 0, dur: 300, style: this.rng.int(0, 7) };
    this.celebrator = scorer;
    void ev;
    if (this.settings.matchType === 'golden' && this.period >= 3) { this.finish(); }
  }

  stepGoal() {
    this.goalT++;
    // scorer runs away, teammates follow, others walk back
    const sp = this.byId.get(this.celebrator);
    for (const p of this.players) {
      if (!p.onPitch) continue;
      if (p === sp && p.act?.type === 'celebrate') {
        const t = this.teams[p.team];
        if (this.goalT < 120) { p.wantX = Math.sign(p.y || 1) * 0 + t.dir; p.wantY = Math.sign(p.y || 1); p.wantS = 0.9; }
        else { p.wantX = 0; p.wantY = 0; }
        p.act.t++;
      } else if (sp && p.team === sp.team && p !== sp && p.pos !== 'GK') {
        const dx = sp.x - p.x, dy = sp.y - p.y, d = Math.hypot(dx, dy);
        p.wantX = d > 2 ? dx : 0; p.wantY = d > 2 ? dy : 0; p.wantS = 0.8;
      } else { const h = this.homeSpot(p, true); p.wantX = h.x - p.x; p.wantY = h.y - p.y; p.wantS = Math.hypot(p.wantX, p.wantY) > 1 ? 0.35 : 0; }
      const keepAct = p.act; if (keepAct && keepAct.type === 'celebrate') p.act = null;
      this.stepPlayer(p);
      if (keepAct && keepAct.type === 'celebrate') p.act = keepAct;
    }
    stepBall(this.ball, this.wb);
    if (this.goalT >= (this.goalLen ?? 300) || this.skipGoal) {
      this.skipGoal = false;
      if (sp) sp.act = null;
      if (this.phase !== 'goal') return;
      const conceded = 1 - (this.events.filter((e) => e.type === 'goal').at(-1)?.team ?? 0);
      this.applySubs(0); this.applySubs(1);
      this.setupKickoff(conceded);
      this.log('kickoff', { team: conceded, period: this.period });
    }
  }

  // ---------------------------------------------------------------- restarts
  startRestart(type, team, x, y, extra = {}) {
    this.phase = 'restart';
    this.owner = null;
    this.path = null;
    this.advantage = null;
    this.offsideFlags = null;
    this.ifk = null;
    for (const p of this.players) { p.gkSave = null; p.diveTo = null; p.queued = null; if (p.act && p.act.type !== 'down') p.act = null; p.run = null; p.jockey = false; }
    const b = this.ball;
    Object.assign(b, makeBall());
    b.x = clamp(x, -PITCH.HALF_L, PITCH.HALF_L); b.y = clamp(y, -PITCH.HALF_W, PITCH.HALF_W);
    if (type === 'freekick' && inBox(b.x, b.y, this.teams[team].dir * -1)) {
      // a free kick to the defending team inside its own box can be taken anywhere in the box: fine as is
    }
    if (type === 'freekick' && extra.indirect && inBox(b.x, b.y, this.teams[team].dir)) {
      // indirect free kick to the attack inside the box: move outside the goal area
      if (PITCH.HALF_L - Math.abs(b.x) < PITCH.SIX_DEPTH) b.x = Math.sign(b.x) * (PITCH.HALF_L - PITCH.SIX_DEPTH);
    }
    const r = { type, team, x: b.x, y: b.y, t: 0, setup: 0, ready: false, wait: 0, indirect: !!extra.indirect, ...extra };
    if (type === 'goalkick') r.wait = this.rng.range(1.2, 2.2);
    else if (type === 'throw') r.wait = this.rng.range(0.7, 1.4);
    else r.wait = this.rng.range(1.0, 1.8);
    this.restart = r;
    AI.setupRestart(this, r);   // targets for every player, taker id, wall
    const taker = this.byId.get(r.taker);
    // the user controls the taker of their own restart
    for (const c of this.ctls) {
      if (c.team === team && taker) this.control(c, taker);
      if (type === 'penalty' && c.team !== team) { const g = this.gk(c.team); if (g) this.control(c, g); }
    }
    for (const c of this.ctls) { c.hold = null; c.aimX = 0; c.aimY = 0; c.curl = 0; }
    if (this.teams[team].pendingSubs.length || this.teams[1 - team].pendingSubs.length) { this.applySubs(team); this.applySubs(1 - team); }
    for (const tt of this.teams) if (tt.cpu || tt.autoSubs) AI.cpuSubs(this, tt);
    this.cue('restart', { kind: type, team });
  }

  stepRestart() {
    const r = this.restart;
    if (!r) { this.phase = 'live'; return; }
    r.t++;
    const b = this.ball;
    const taker = this.byId.get(r.taker);
    if (!taker || !taker.onPitch) { AI.setupRestart(this, r); return; }
    const setupDone = r.ready || r.t > 75;
    if (!r.ready) {
      // walk everyone to their spots quickly
      let far = 0;
      for (const p of this.players) {
        if (!p.onPitch) continue;
        const s = r.spots?.get(p.id);
        if (!s) continue;
        const dx = s.x - p.x, dy = s.y - p.y, d = Math.hypot(dx, dy);
        far = Math.max(far, d);
        const step = Math.max(0.15, d * 0.09);
        if (d > 0.05) { const k = Math.min(1, step / d); p.x += dx * k; p.y += dy * k; }
        p.face = s.face ?? Math.atan2(b.y - p.y, b.x - p.x);
        p.vx = p.vy = 0;
        if (p.act && p.act.type === 'down') { p.act.t++; if (p.act.t >= p.act.dur) p.act = null; }
      }
      if (far < 0.1 || r.t > 70) {
        for (const p of this.players) { const s = r.spots?.get(p.id); if (s && p.onPitch) { p.x = s.x; p.y = s.y; p.face = s.face ?? p.face; } }
        r.ready = true; r.readyT = r.t;
        this.owner = taker;
        b.x = r.x; b.y = r.y; b.z = r.type === 'throw' ? 2.0 : 0;
        b.vx = b.vy = b.vz = 0;
      }
      return;
    }
    void setupDone;
    // take phase: the taker holds the ball at the spot
    this.owner = taker;
    b.x = r.x; b.y = r.y; b.z = r.type === 'throw' ? 2.0 : 0;
    for (const p of this.players) {
      if (!p.onPitch || p === taker) continue;
      const s = r.spots?.get(p.id);
      if (s && r.type !== 'kickoff') { p.wantX = (s.x - p.x); p.wantY = (s.y - p.y); p.wantS = Math.hypot(p.wantX, p.wantY) > 0.4 ? 0.3 : 0; }
      else { p.wantX = 0; p.wantY = 0; p.wantS = 0; }
      if (p.act && p.act.type === 'kick') p.act = null;
      this.stepPlayer(p);
    }
    // kicker wind-up in progress?
    if (taker.act && taker.act.type === 'kick') {
      taker.act.t++;
      if (taker.act.t >= taker.act.wind) { const spec = taker.act.spec; taker.act = { type: 'follow', t: 0, dur: 10 }; this.restartKick(taker, spec); }
      return;
    }
    const human = this.ctls.find((c) => c.pid === taker.id);
    if (r.type === 'penalty') return this.stepPenaltyTake(r, taker, human);
    if (human) {
      this.humanRestart(human, taker, r);
    } else if ((r.t - r.readyT) / 60 >= r.wait * this.diff.restartWait) {
      const spec = AI.restartKick(this, r, taker);
      if (spec) this.startKick(taker, spec, spec.type === 'shot' ? 16 : 8);
    }
  }

  /** The keeper commits to a side as a penalty (or shootout kick) is struck. */
  penaltyGuess(taker) {
    if (this.penGuess && this.penGuess.tick === this.tick) return;
    const r = this.restart;
    const g = this.gk(1 - taker.team);
    const human = g && this.ctls.find((c) => c.pid === g.id);
    const pick = human ? r?.gkPick : null;
    const side = pick ? (pick.stay ? 0 : Math.sign(pick.y || 0)) : AI.penaltyDive(this, g);
    this.penGuess = { tick: this.tick, team: 1 - taker.team, side };
    if (g && side) { g.diveAt = this.tick + 2; g.diveTo = { x: g.x, y: side * 2.6, z: 0.8, dur: 22 }; }
  }

  restartKick(taker, spec) {
    const r = this.restart;
    const b = this.ball;
    this.owner = taker;
    b.z = r && r.type === 'throw' ? 2.0 : 0;
    if (r && r.type === 'throw') spec = { ...spec, type: spec.type === 'ground' || spec.type === 'driven' ? 'throw' : spec.type === 'through' ? 'throw' : 'throw', short: spec.type === 'ground' };
    this.cue('whistle', { short: true, quiet: r?.type === 'throw' || r?.type === 'goalkick' });
    if (r?.type === 'penalty') this.penaltyGuess(taker);
    const was = r?.type;
    this.fireKick(taker, spec, false);
    if (was === 'goalkick' || was === 'corner' || was === 'freekick' || was === 'kickoff' || was === 'penalty') this.log('restart_taken', { kind: was, team: taker.team });
    if (was === 'corner') this.log('corner', { team: taker.team });
  }

  // ---------------------------------------------------------------- penalties (in match and shootout)
  stepPenaltyTake(r, taker, human) {
    const gk = this.gk(1 - r.team);
    const gkHuman = gk && this.ctls.find((c) => c.pid === gk.id);
    if (gkHuman && gk) {
      const f = gkHuman.frame ?? EMPTY;
      // keeper may shuffle on the line, and pre-pick a dive with arrows + D
      gk.y = clamp(gk.y + f.my * 0.02 * -this.teams[gk.team].dir * 0 + f.my * 0.02, -1.5, 1.5);
      if (gkHuman.press & B.SHOOT) r.gkPick = { y: f.my * (this.teams[gk.team].dir) * 0 + f.my, z: (f.mx ? 0 : 0), stay: !f.my, mx: f.mx };
      if (gkHuman.frame.b & B.JOCK) r.gkPick = { stay: true };
    }
    if (human) {
      const f = human.frame ?? EMPTY;
      // aim marker inside the goal: arrows move it
      r.aimY = clamp((r.aimY ?? 0) + f.my * 0.07 * 1, -PITCH.GOAL_HALF_W + 0.2, PITCH.GOAL_HALF_W - 0.2);
      r.aimZ = clamp((r.aimZ ?? 0.5) - 0, 0.15, 2.2);
      if (f.mx) r.aimZ = clamp((r.aimZ ?? 0.5) + f.mx * this.teams[r.team].dir * 0.04, 0.15, 2.2);
      const cb = human;
      if (cb.press & B.SHOOT) cb.hold = { btn: B.SHOOT, t: 0, mods: cb.frame.b };
      if (cb.hold) {
        cb.hold.t++;
        if ((cb.rel & B.SHOOT) || cb.hold.t > HOLD_MAX.shot + HOLD_EXTRA) {
          const power = clamp(cb.hold.t / HOLD_MAX.shot, 0.1, 1);
          const mods = cb.hold.mods | cb.frame.b;
          cb.hold = null;
          const st = mods & B.MOD ? 'chip' : 'penalty';
          const spec = { type: 'shot', shotType: st, tx: this.teams[r.team].dir * PITCH.HALF_L, ty: r.aimY, tz: r.aimZ, power, errMult: mods & B.FIN ? 0.75 : 1, finesse: !!(mods & B.FIN), setPiece: 'penalty', timed: null };
          r.taken = true;
          this.startKick(taker, spec, 20);
          r.timedStart = this.tick;
          this.timedWindow(human, taker, spec, 20);
        }
      }
    } else if ((r.t - r.readyT) / 60 >= 1.4 && !r.taken) {
      r.taken = true;
      const spec = AI.penaltySpec(this, taker);
      this.startKick(taker, spec, 20);
    }
    // keeper guesses at the moment of the kick (handled when the shot is fired: see AI.penaltyDive)
  }

  /** Arm the Timed Finish window for a human shot: second press of D during the wind-up. */
  timedWindow(c, p, spec, wind) {
    if (!c.assist.timed) return;
    c.timed = { start: this.tick, wind, spec, p: p.id, done: false };
  }

  startShootout() {
    this.phase = 'shootout';
    this.log('shootout_start', {});
    const first = this.rng.chance(0.5) ? 0 : 1;
    this.shootout = { first, kicks: [[], []], turn: first, n: 0, state: 'setup', t: 0, order: [AI.penOrder(this, 0), AI.penOrder(this, 1)] };
    this.cue('shootout', {});
    this.setupShootoutKick();
  }

  setupShootoutKick() {
    const so = this.shootout;
    const team = so.turn;
    const t = this.teams[team];
    const order = so.order[team];
    const taker = order[so.kicks[team].length % order.length];
    // shootout always toward the same goal (side +1 end)
    const side = 1;
    const spotX = side * (PITCH.HALF_L - PITCH.PEN_SPOT);
    so.state = 'kick'; so.t = 0; so.side = side;
    // temporarily set direction so the shot code aims at the right goal
    t.dir = side; this.teams[1 - team].dir = -side;
    this.phase = 'restart';
    Object.assign(this.ball, makeBall());
    this.ball.x = spotX; this.ball.y = 0;
    this.restart = { type: 'penalty', team, x: spotX, y: 0, t: 0, ready: false, wait: 1.4, shootout: true, taker: taker.id };
    AI.setupRestart(this, this.restart);
    for (const c of this.ctls) {
      if (c.team === team) this.control(c, taker);
      else { const g = this.gk(c.team); if (g) this.control(c, g); }
    }
  }

  stepShootout() {
    const so = this.shootout;
    if (so.state === 'done') return;
    if (so.state === 'kick') {
      // runs inside restart/live phases; we get here between kicks
      so.t++;
      if (so.t > 30) this.setupShootoutKick();
      return;
    }
  }

  /** Called every step during a shootout kick's live phase to detect the result. */
  shootoutWatch() {
    const so = this.shootout;
    if (!so || this.phase !== 'live') return;
    const b = this.ball;
    so.watch = (so.watch ?? 0) + 1;
    const speed = Math.hypot(b.vx, b.vy, b.vz);
    let res = null;
    if (b.inNet) res = 1;
    else if (so.watch > 150 || this.owner || (speed < 1 && so.watch > 40) || Math.abs(b.x) > PITCH.HALF_L + 0.3 || Math.abs(b.y) > PITCH.HALF_W) res = 0;
    if (res === null) return;
    so.kicks[so.turn].push(res);
    this.log('shootout_kick', { team: so.turn, pid: this.lastKick?.pid, scored: !!res });
    this.cue(res ? 'goal_small' : 'miss', {});
    so.watch = 0;
    const dec = shootoutDecided(so.kicks);
    if (dec >= 0) {
      so.state = 'done'; so.winner = dec;
      this.teams[dec].pens = so.kicks[dec].reduce((s, v) => s + v, 0);
      this.teams[1 - dec].pens = so.kicks[1 - dec].reduce((s, v) => s + v, 0);
      this.log('shootout_end', { winner: dec, pens: [this.teams[0].pens, this.teams[1].pens] });
      this.finish();
      return;
    }
    so.turn = 1 - so.turn;
    so.state = 'kick'; so.t = 0;
    this.phase = 'shootout';
    this.owner = null;
  }

  stepShootoutLive() {
    for (const p of this.players) { if (!p.onPitch) continue; p.wantX = 0; p.wantY = 0; p.wantS = 0; this.stepPlayer(p); }
    this.stepBallLive();
    this.shootoutWatch();
  }

  // ---------------------------------------------------------------- substitutions
  requestSub(team, offId, onId) {
    const t = this.teams[team];
    if (t.subsUsed + t.pendingSubs.length >= 5) return false;
    if (t.pendingSubs.some((s) => s.off === offId || s.on === onId)) return false;
    t.pendingSubs.push({ off: offId, on: onId });
    return true;
  }

  applySubs(team, halfTime = false) {
    const t = this.teams[team];
    if (!t.pendingSubs.length) return;
    let used = false;
    for (const s of t.pendingSubs.splice(0)) {
      if (t.subsUsed >= 5) break;
      const off = t.on.find((p) => p.id === s.off && p.onPitch);
      const on = t.bench.find((p) => p.id === s.on);
      if (!off || !on) continue;
      on.slot = off.slot; on.pos = off.pos; on.onPitch = true; on.x = off.x; on.y = PITCH.HALF_W * Math.sign(off.y || 1); on.face = off.face; on.entered = this.clock(); on.stamina = 1;
      off.onPitch = false; off.slot = null;
      t.on[t.on.indexOf(off)] = on;
      t.bench = t.bench.filter((p) => p !== on);
      t.off.push(off);
      this.players[this.players.indexOf(off)] = on;
      for (const c of this.ctls) if (c.pid === off.id) { off.ctl = null; c.pid = null; this.control(c, on); }
      if (this.owner === off) this.owner = on;
      if (this.restart?.taker === off.id) { this.restart.taker = on.id; }
      t.subsUsed++;
      this.dead.subs++;
      used = true;
      this.log('sub', { team, off: off.id, on: on.id });
      this.cue('sub', { team, off: off.id, on: on.id });
    }
    if (used && !halfTime) t.windowsUsed++;
    if (this.restart) AI.setupRestart(this, this.restart, true);
  }

  // ---------------------------------------------------------------- human input
  stepHumans() {
    for (const c of this.ctls) {
      const p = this.ctlPlayer(c);
      if (!p || !p.onPitch) { this.autoSelect(c); continue; }
      this.humanLive(c, p);
    }
  }

  /** Move direction from a frame, as a world vector. */
  dirOf(f) { const l = Math.hypot(f.mx, f.my); return l ? { x: f.mx / l, y: f.my / l } : null; }

  humanLive(c, p) {
    const f = c.frame ?? EMPTY;
    const t = this.teams[p.team];
    const hasBall = this.owner === p;
    const lk = this.lastKick;
